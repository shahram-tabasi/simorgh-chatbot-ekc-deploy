<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="%BASE_URL%favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simorgh Design Software</title>
      <script>
      // Set the theme before the first paint. React mounts a moment later, and
      // without this the page renders light and then flips, which is worse to
      // look at than either theme. Mirrors the fallback order in useTheme.ts:
      // an explicit choice, otherwise whatever the system asks for.
      (function () {
        try {
          var saved = localStorage.getItem('simorgh-theme');
          var dark = saved ? saved === 'dark'
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
