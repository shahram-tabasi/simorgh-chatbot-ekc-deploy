# =============================================================================
# Simorgh Soft - Container Nginx Configuration
# Serves React frontend static files and proxies /api/ to Node.js backend
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow PDF / Excel attachments + the (sometimes hefty) project-context
    # snapshot we ship with each /api/chat-* call. Nginx's 1 MB default
    # made the chatbot return "Failed to fetch" the moment any document
    # was attached.
    client_max_body_size 100M;

    # Frontend - serve static files, fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desktop installer — a ~100 MB file, streamed straight through instead of
    # being buffered to disk first.
    location /api/desktop/download {
        proxy_pass http://127.0.0.1:3001/api/desktop/download;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 900s;
    }

    # API - proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        # Local-model calls can take a while (PDF parsing + 4k-token
        # generation). Bumped from 120s to give the LLM headroom.
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
