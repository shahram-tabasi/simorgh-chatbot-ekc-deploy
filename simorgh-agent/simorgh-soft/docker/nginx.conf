# =============================================================================
# Simorgh Soft - Container Nginx Configuration
# Serves React frontend static files and proxies /api/ to Node.js backend
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow PDF / Excel attachments + the (sometimes hefty) project-context
    # snapshot we ship with each /api/chat-* call. Nginx's 1 MB default
    # made the chatbot return "Failed to fetch" the moment any document
    # was attached.
    client_max_body_size 100M;

    # index.html is the one file that must never be cached. It names the
    # hashed bundle, and every build produces new hashes: a browser holding
    # yesterday's index.html asks for a bundle this image no longer has, gets
    # 404, and shows a white page. The SPA fallback below lands here too
    # (try_files re-matches the location), so both paths are covered.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Which build this image is, for the same reason index.html is never
    # cached: a stale answer to "what is running" is worse than no answer.
    # =404 rather than the SPA fallback, so an image built before this existed
    # says so plainly instead of returning index.html as if it were JSON.
    location = /build.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Frontend - serve static files, fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desktop installer — a ~100 MB file, streamed straight through instead of
    # being buffered to disk first.
    location /api/desktop/download {
        proxy_pass http://127.0.0.1:3001/api/desktop/download;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 900s;
    }

    # API - proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        # Local-model calls can take a while (PDF parsing + 4k-token
        # generation). Bumped from 120s to give the LLM headroom.
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
