<!doctype html>
<!--
  The welcome window: shown every time the app starts, while the suite loads
  behind it in a hidden window. main.js closes it once the suite is ready to
  show (and it has been up long enough to be read). It is a local page — it
  shows even when the server is slow or down, which is exactly when a window
  that says something is better than a blank one.
-->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Simorgh Design Suite</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #e2e8f0;
    background: radial-gradient(700px 420px at 75% 30%, #062a5c 0%, #01112a 55%, #000c1f 100%);
    border: 1px solid rgba(96, 165, 250, .25);
    box-sizing: border-box;
    -webkit-user-select: none; user-select: none;
    -webkit-app-region: drag;           /* it can be moved, like any window */
    display: flex; flex-direction: column;
  }
  .art {
    display: block; width: 100%; height: auto;
    -webkit-mask-image: linear-gradient(#000 78%, transparent);
            mask-image: linear-gradient(#000 78%, transparent);
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }
  .body { padding: 6px 28px 0; flex: 1; animation: rise 1.2s .25s cubic-bezier(.2,.7,.2,1) both; }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; color: #fff; }
  p  { margin: 0; font-size: 13px; color: #94a3b8; }
  .bar {
    position: relative; height: 4px; margin-top: 18px; border-radius: 2px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .bar::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #38bdf8, #2563eb, transparent);
    animation: slide 1.6s ease-in-out infinite;
  }
  .foot {
    display: flex; justify-content: space-between; padding: 14px 28px 16px;
    font-size: 11px; color: #64748b;
  }
  @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { left: -40%; } to { left: 100%; } }
</style>
</head>
<body>
  <img class="art" src="welcome-art.jpg" alt="Simorgh Design Suite" draggable="false">
  <div class="body">
    <h1>Welcome to Simorgh Design Suite</h1>
    <p>Opening your workspace…</p>
    <div class="bar"></div>
  </div>
  <div class="foot">
    <span>Simorgh Technology &nbsp;|&nbsp; All rights reserved.</span>
    <span id="ver"></span>
  </div>
  <script>
    // The version, from the query main.js passes — nothing else is read here.
    try { document.getElementById('ver').textContent = 'v' + new URLSearchParams(location.search).get('v'); } catch (e) {}
  </script>
</body>
</html>
