<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Server address</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif; color: #e2e8f0;
      background: radial-gradient(900px 600px at 15% 10%, #14335f 0%, #0a1a33 45%, #060e1e 100%);
    }
    .card { width: 100%; padding: 26px 30px; }
    h1 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
    p  { margin: 0 0 16px; font-size: 12px; line-height: 1.6; color: #94a3b8; }
    input {
      width: 100%; padding: 9px 11px; font-size: 13px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #f8fafc;
    }
    input:focus { outline: none; border-color: #60a5fa; }
    .row { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }
    button {
      padding: 8px 18px; border: 0; border-radius: 8px; font-size: 13px; cursor: pointer;
      background: #2563eb; color: #fff;
    }
    button.secondary { background: rgba(255,255,255,.12); }
    .hint { font-size: 11px; color: #64748b; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Where is Simorgh Design Suite served from?</h1>
    <p>Enter the address of the server running the suite. It is remembered, and can be changed later from <strong>File → Change server address…</strong></p>
    <input id="url" type="text" spellcheck="false" placeholder="http://192.168.1.10/simorgh-design-suite/">
    <div class="row">
      <button class="secondary" id="cancel">Cancel</button>
      <button id="save">Connect</button>
    </div>
    <div class="hint">Examples: <code>localhost</code> · <code>192.168.1.10/simorgh-design-suite/</code></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const input = document.getElementById('url');
    input.value = params.get('url') || '';
    input.focus();
    input.select();

    const save = async () => {
      const ok = await window.simorgh.saveServerUrl(input.value);
      if (ok) window.close();
    };
    document.getElementById('save').addEventListener('click', save);
    document.getElementById('cancel').addEventListener('click', () => window.close());
    input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  </script>
</body>
</html>
