# =============================================================================
# Simorgh — BUILD ON THIS MACHINE
#
# The default docker-compose.yml pulls every image from ghcr.io, where the
# GitHub workflow puts them. This file is the other half: an override that
# tells compose to build each of them here instead.
#
#   Pull (default):   docker compose up -d
#   Build here:       docker compose -f docker-compose.yml -f docker-compose.build.yml build
#                     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d
#
# It is an override rather than a second copy of the stack on purpose: every
# service is still defined once, in compose/<name>.yml, with its build context
# and its environment. All this file changes is where the image comes from.
#
# `pull_policy: build` is what does it. Without it compose is free to take a
# stale image off the local daemon, or to reach for ghcr.io — which on a
# machine with limited internet is a twenty-minute hang, not an error.
#
# The image keeps the same ghcr.io name when built here. That is deliberate:
# the service files name the image once, `docker compose up` finds what was
# just built, and nothing has to agree about a second name. To build under the
# old local names instead, set IMAGE_PREFIX and IMAGE_TAG:
#
#   IMAGE_PREFIX= IMAGE_TAG=local docker compose -f docker-compose.yml \
#     -f docker-compose.build.yml build
#
# The list is every service the default stack actually starts. Two buildable
# services are deliberately absent — tei and whisper-server, whose includes are
# commented out in docker-compose.yml — because an override for a service the
# project does not define is not an override, it is a half-declared service,
# and compose rejects the whole project for it. Uncomment one of those
# includes and add its two lines here at the same time.
# =============================================================================

services:
  # ── compose/core-backend.yml
  backend:
    pull_policy: build
  # ── compose/core-frontend.yml
  frontend:
    pull_policy: build
  # ── compose/soft-app.yml
