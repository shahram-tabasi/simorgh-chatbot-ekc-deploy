# =============================================================================
# Simorgh — BUILD ON THIS MACHINE
#
# The default docker-compose.yml pulls every image from ghcr.io, where the
# GitHub workflow puts them. This file is the other half: it carries the build
# instructions, and only with it does anything get built here.
#
#   Pull (default):   docker compose up -d
#   Build here:       docker compose -f docker-compose.yml -f docker-compose.build.yml build
#                     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d
#
# The build sections live HERE and not beside each service, and that is the
# whole point of the file. They used to sit in compose/<name>.yml next to the
# image they build, which reads better and is wrong: when a service names both
# an image and a build context, a failed pull falls through to building it. So
# an expired registry login on this machine did not fail — it started a
# twenty-minute build of the thing it could not download, which is the exact
# outcome the split exists to prevent. With no build section in the default
# stack there is nothing to fall through to, and a failed pull is an error that
# says so.
#
# `pull_policy: build` then forces the build when this file IS in play, rather
# than letting compose reuse whatever stale image is on the daemon.
#
# Two buildable services are deliberately absent — tei and whisper-server,
# whose includes are commented out in docker-compose.yml — because an override
# for a service the project does not define makes compose reject the whole
# project. Uncomment one of those includes and move its build section here at
# the same time.
# =============================================================================

services:
  admin-service:
    pull_policy: build
    build: admin-service
  auth-service:
    pull_policy: build
    build: auth-service
  backend:
    pull_policy: build
    build:
      context: backend
      tags:
        - simorgh-backend:local

  chat-history-mcp:
    pull_policy: build
    build:
      context: .
      dockerfile: chat-history-mcp-service/Dockerfile

  chat-service:
    pull_policy: build
    build: chat-service
  command-gen:
    pull_policy: build
    build: command-gen-service
  context-search:
    pull_policy: build
    build:
      context: .
      dockerfile: context-search-service/Dockerfile

  doc-processor:
    pull_policy: build
    build: doc-processor
  docling-serve:
    pull_policy: build
    build:
      context: docling
      dockerfile: Dockerfile

  documents-rag-service:
    pull_policy: build
    build: documents-rag-service
  embeddings-service:
    pull_policy: build
    build: embeddings-service
  eplan-bridge:
    pull_policy: build
    build: eplan-bridge-service
  eplan-sql-service:
    pull_policy: build
    build: eplan-sql-service
  file-export:
    pull_policy: build
    build: file-export-service
  frontend:
    pull_policy: build
    build: frontend
  gitlab-mcp:
    pull_policy: build
    build:
      context: .
      dockerfile: gitlab-mcp-service/Dockerfile

  graph-rag-service:
    pull_policy: build
    build: graph-rag-service
  grounding-verifier:
    pull_policy: build
    build: grounding-verifier
  hr-kb-service:
    pull_policy: build
    build: hr-kb-service
  llm-gateway:
    pull_policy: build
    build: llm-gateway
  mail-bridge:
    pull_policy: build
    build:
      context: .
      dockerfile: mail-bridge/Dockerfile

  org-data-service:
    pull_policy: build
    build: org-data-service
  payments-service:
    pull_policy: build
    build: payments-service
  project-agent-service:
    pull_policy: build
    build: project-agent-service
  project-analysis:
    pull_policy: build
    build: project-analysis-service
  project-explorer:
    pull_policy: build
    build:
      context: .
      dockerfile: project-explorer-service/Dockerfile

  project-init:
    pull_policy: build
    build:
      context: .
      dockerfile: project-init-service/Dockerfile

  runtime-broker:
    pull_policy: build
    build:
      context: .
      dockerfile: runtime-broker/Dockerfile

  search-service:
    pull_policy: build
    build: search-service
  simorgh-soft:
    pull_policy: build
    build:
      context: simorgh-soft
      dockerfile: Dockerfile
      # Without this, both npm stages fall back to the ARG's own default
      # (public registry.npmjs.org) regardless of NPM_REGISTRY in .env —
      # which is what silently caused build failures/partial installs here.
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}

  specification-agent-service:
    pull_policy: build
    build: specification-agent-service
  stt-service:
    pull_policy: build
    build: stt-service
  techserver-mcp:
    pull_policy: build
    build:
      context: .
      dockerfile: techserver-mcp-service/Dockerfile

  tier-quota-service:
    pull_policy: build
    build: tier-quota-service
  tpms-context-agent:
    pull_policy: build
    build:
      context: .
      dockerfile: tpms-context-agent/Dockerfile

  tpms-fetcher:
    pull_policy: build
    build: tpms-fetcher-service
  tts-service:
    pull_policy: build
    build: tts-service