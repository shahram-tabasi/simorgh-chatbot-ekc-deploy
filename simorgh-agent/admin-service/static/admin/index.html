<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simorgh — Admin Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink:   { 950: '#06070b', 900: '#0a0b12', 800: '#11131c', 700: '#181a26', 600: '#222536', 500: '#2c3046' },
            edge:  '#2a2f44',
            accent: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed' },
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-ink-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Login -->
  <div id="login-screen" class="hidden min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="flex items-center justify-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-accent-500 to-accent-600 flex items-center justify-center shadow-lg shadow-accent-500/40">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
      </div>
      <h1 class="text-2xl font-semibold text-center mb-1">Simorgh Admin</h1>
      <p class="text-sm text-slate-400 text-center mb-8">Sign in with an admin account</p>
      <form id="login-form" class="space-y-4 bg-ink-800 border border-ink-600 rounded-2xl p-6 shadow-xl">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1.5">Email</label>
          <input type="email" id="login-email" required class="w-full bg-ink-900 border border-ink-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500/40" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
          <input type="password" id="login-password" required class="w-full bg-ink-900 border border-ink-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500/40" />
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-accent-500 to-accent-600 hover:from-accent-600 hover:to-accent-700 text-white font-medium py-2.5 rounded-lg transition shadow-lg shadow-accent-500/30">
          Sign in
        </button>
        <div id="login-error" class="text-red-400 text-sm hidden text-center"></div>
      </form>
    </div>
  </div>

  <!-- App shell -->
  <div id="app-shell" class="hidden flex min-h-screen">
    <aside class="w-60 bg-ink-900 border-r border-ink-600 flex flex-col fixed inset-y-0 left-0 z-30">
      <div class="px-5 py-5 border-b border-ink-600">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent-500 to-accent-600 flex items-center justify-center shadow shadow-accent-500/30">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <div>
            <div class="font-semibold text-sm leading-tight">Simorgh</div>
            <div class="text-[10px] text-slate-500 uppercase tracking-wider">Admin Console</div>
          </div>
        </div>
      </div>

      <nav id="sidebar-nav" class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto"></nav>

      <div class="px-3 py-3 border-t border-ink-600">
        <div id="user-chip" class="flex items-center gap-2.5 px-2 py-2 rounded-lg bg-ink-800 border border-ink-600">
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-accent-500 to-accent-600 flex items-center justify-center text-xs font-semibold" id="user-initial">?</div>
          <div class="flex-1 min-w-0">
            <div class="text-xs font-medium truncate" id="user-name">—</div>
            <div class="text-[10px] text-slate-500 truncate" id="user-email">—</div>
          </div>
          <button id="logout-btn" title="Sign out" class="text-slate-400 hover:text-red-400 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="flex-1 ml-60">
      <header class="h-14 bg-ink-900/80 backdrop-blur border-b border-ink-600 sticky top-0 z-20 flex items-center justify-between px-6">
        <div>
          <h1 id="page-title" class="text-sm font-semibold">Dashboard</h1>
          <p id="page-subtitle" class="text-[11px] text-slate-500">Live overview of the Simorgh stack</p>
        </div>
        <div class="flex items-center gap-3">
          <div id="health-pill" class="hidden text-xs px-2.5 py-1 rounded-full border"></div>
          <button id="refresh-btn" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-ink-700 transition" title="Refresh">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
        </div>
      </header>

      <div id="page-content" class="p-6"></div>
    </main>
  </div>

  <!-- Modal host -->
  <div id="modal-host" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" data-modal-backdrop></div>
    <div id="modal-card" class="relative bg-ink-800 border border-ink-600 rounded-2xl shadow-2xl max-w-lg w-full p-6"></div>
  </div>

  <!-- Toast host -->
  <div id="toast-host" class="fixed bottom-6 right-6 z-[60] space-y-2"></div>

  <script src="app.js"></script>
</body>
</html>
