<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simorgh — Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink:    { 950: '#04050c', 900: '#080a14', 800: '#0c0e18', 700: '#111420', 600: '#161925', 500: '#1e2130', 400: '#272a3d' },
            accent: { 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-ink-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- ── Login ───────────────────────────────────────────────────────── -->
  <div id="login-screen" class="hidden min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
    <div class="glow-orb glow-purple"></div>
    <div class="glow-orb glow-blue"></div>

    <div class="relative z-10 w-full max-w-sm">
      <div class="flex flex-col items-center mb-8">
        <div class="brand-logo mb-5">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">Simorgh Admin</h1>
        <p class="text-sm text-slate-500 mt-1.5">Authorized access only</p>
      </div>

      <div class="glass-form">
        <form id="login-form" class="space-y-4">
          <div>
            <label class="form-label">Email address</label>
            <input type="email" id="login-email" required placeholder="admin@example.com" class="form-input" autocomplete="email" />
          </div>
          <div>
            <label class="form-label">Password</label>
            <input type="password" id="login-password" required placeholder="••••••••" class="form-input" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn-login">
            Sign in
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
          <div id="login-error" class="login-error hidden"></div>
        </form>
      </div>
    </div>
  </div>

  <!-- ── App Shell ───────────────────────────────────────────────────── -->
  <div id="app-shell" class="hidden flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-[218px] bg-ink-900 border-r border-ink-500 flex flex-col fixed inset-y-0 left-0 z-30">
      <div class="px-4 py-4 border-b border-ink-500">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-accent-500 to-accent-700 flex items-center justify-center flex-shrink-0 shadow-lg shadow-accent-700/30">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <div>
            <div class="font-semibold text-sm leading-tight">Simorgh</div>
            <div class="text-[10px] text-slate-600 uppercase tracking-widest font-medium mt-0.5">Admin Console</div>
          </div>
        </div>
      </div>

      <nav id="sidebar-nav" class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto"></nav>

      <div class="p-3 border-t border-ink-500">
        <div id="user-chip" class="flex items-center gap-2.5 px-2.5 py-2 rounded-xl bg-ink-800 border border-ink-500">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-accent-500 to-accent-700 flex items-center justify-center text-xs font-bold flex-shrink-0" id="user-initial">?</div>
          <div class="flex-1 min-w-0">
            <div class="text-xs font-semibold truncate leading-tight" id="user-name">—</div>
            <div class="text-[10px] text-slate-600 truncate" id="user-email">—</div>
          </div>
          <button id="logout-btn" title="Sign out" class="text-slate-600 hover:text-red-400 transition-colors p-0.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 ml-[218px] flex flex-col min-h-screen">
      <header class="h-[52px] bg-ink-900/90 backdrop-blur-md border-b border-ink-500 sticky top-0 z-20 flex items-center justify-between px-6">
        <div class="flex items-center gap-2">
          <h1 id="page-title" class="text-sm font-semibold text-white"></h1>
          <span class="text-ink-400 text-sm hidden sm:inline">·</span>
          <p id="page-subtitle" class="text-[11px] text-slate-600 hidden sm:block"></p>
        </div>
        <div class="flex items-center gap-2">
          <div id="health-pill" class="hidden"></div>
          <button id="refresh-btn" class="topbar-btn" title="Refresh">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
        </div>
      </header>

      <div id="page-content" class="flex-1 p-6"></div>
    </main>
  </div>

  <!-- ── Modal host ───────────────────────────────────────────────────── -->
  <div id="modal-host" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" data-modal-backdrop></div>
    <div id="modal-card" class="relative w-full max-w-lg modal-card animate-modal"></div>
  </div>

  <!-- ── Toast host ───────────────────────────────────────────────────── -->
  <div id="toast-host" class="fixed bottom-5 right-5 z-[60] space-y-2 pointer-events-none"></div>

  <script src="app.js"></script>
</body>
</html>
