# =============================================================================
# Simorgh Industrial Electrical Assistant — MASTER docker-compose.yml
# Server: 192.168.1.68 (single-host deployment)
#
# This is a thin "menu" file. Every service lives in its own file under
# compose/*.yml so you can ENABLE/DISABLE features by commenting a single
# line.
#
# Companion compose files:
#   • ../llms/docker-compose.yml → 192.168.1.61 + 192.168.1.62 (local LLM)
#
# Notes:
#   • Requires Docker Compose v2.20+ for `include:` support.
#   • TLS terminates at the host nginx; container nginx serves plain HTTP on :85.
#   • Each compose/*.yml is self-contained — you can also bring up a single
#     file with: docker compose -f compose/<name>.yml up -d
# =============================================================================

include:
  # ---- Infrastructure (always on) -------------------------------------------
  - compose/infra-redis.yml
  - compose/infra-qdrant.yml
  - compose/infra-postgres-auth.yml

  # ---- New enterprise infra (GitLab + ELK + Mailcow) ------------------------
  - compose/infra-gitlab.yml
  - compose/infra-elastic.yml
  # Mailcow runs as its own sibling stack — see compose/infra-mailcow.yml for
  # bring-up. Uncomment to add the network-attached probe container.
  # - compose/infra-mailcow.yml

  # ---- Infrastructure (optional — uncomment to enable) ----------------------
  # - compose/infra-neo4j.yml         # Knowledge graph (legacy GraphRAG)
  # - compose/infra-cocoindex-db.yml  # pgvector DB for CocoIndex
  # - compose/infra-cocoindex.yml     # CocoIndex pipeline (needs cocoindex-db)

  # ---- Core app -------------------------------------------------------------
  - compose/core-backend.yml
  - compose/core-frontend.yml
  - compose/core-nginx.yml

  # ---- Microservices (REST + MCP) -------------------------------------------
  - compose/svc-doc-processor.yml
  - compose/svc-stt.yml
  - compose/svc-tts.yml
  - compose/svc-search.yml
  - compose/svc-tpms-fetcher.yml
  - compose/svc-project-init.yml
  - compose/svc-project-analysis.yml
  - compose/svc-command-gen.yml
  - compose/svc-file-export.yml
  - compose/svc-eplan-bridge.yml

  # ---- New services (enterprise migration) ----------------------------------
  - compose/svc-gitlab-mcp.yml         # GitLab REST + MCP (replaces tech-kb + techserver)
  - compose/svc-runtime-broker.yml     # Ephemeral docker exec (replaces shell-service)
  - compose/svc-context-search.yml     # Hybrid (BM25 + kNN) search over ES
  - compose/svc-tpms-context-agent.yml # On-demand TPMS context for CoT
  - compose/svc-mail-bridge.yml        # Mailcow IMAP/SMTP bridge (replaces mail-gateway + project-mail)

  # ---- simorgh-soft (electrical design app) ---------------------------------
  - compose/soft-mongo.yml
  - compose/soft-app.yml

  # ---- Extracted from backend monolith --------------------------------------
  - compose/svc-llm-gateway.yml           # Phase 2 — OpenAI + local LLM router
  - compose/svc-embeddings.yml            # Phase 3 — sentence-transformers embeddings
  - compose/svc-auth.yml                  # Phase 4 — auth_v2 + oauth + email + tpms
  - compose/svc-documents-rag.yml         # Phase 5 — document upload + RAG + Qdrant
  - compose/svc-chat.yml                  # Phase 6 — chat + sessions + context + memory
  - compose/svc-project-agent.yml         # Phase 7 — project init + tasks + COT (REST + MCP)
  - compose/svc-specification-agent.yml   # Phase 8 — electrical spec extraction (REST + MCP)
  - compose/svc-graph-rag.yml             # Phase 9 — Neo4j-based graph RAG
  - compose/svc-payments.yml              # Phase 9 — NOWPayments + IPN
  - compose/svc-admin.yml                 # Phase 9 — admin endpoints
  - compose/svc-tier-quota.yml            # Phase 9 — user tiers + quota

  # ---- General-chat features (legacy login + organization knowledge) --------
  - compose/svc-hr-kb.yml                 # HR knowledge base (port 8041)
  - compose/svc-org-data.yml              # HR/org MySQL data via MCP (port 8042)

  # ---- External-resource gateways (sole entry points to external systems) ---
  - compose/svc-eplan-sql.yml             # MSSQL Eplan_n2 @ 192.168.1.39 (port 8044)

# REMOVED in 2026-05 enterprise migration:
#   - svc-techserver.yml      → replaced by GitLab projects + tools/techserver-importer
#   - svc-tech-kb.yml         → replaced by gitlab-mcp searching the technical-knowledge repo
#   - svc-mail-gateway.yml    → replaced by Mailcow + svc-mail-bridge
#   - svc-project-mail.yml    → replaced by Mailcow + svc-mail-bridge
#   - docker-compose-shell.yml → shell-service deleted; runtime-broker takes over
#   - docker-compose.legacy.yml → legacy monolith path retired
