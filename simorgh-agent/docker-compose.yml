# =============================================================================
# Enhanced Industrial Electrical Assistant - Docker Compose
# Server: 192.168.1.68
# Features: Redis (Cache), Qdrant (Vector), PostgreSQL (Auth), MCP Microservices
#
# Neo4j and CocoIndex have been removed - replaced by MCP + Qdrant + git.
# All images are pulled from GHCR to avoid Docker Hub network issues.
# Third-party images are mirrored via the mirror-images.yml workflow.
# =============================================================================

services:
  # ===========================================================================
  # FRONTEND - React Vite Application (Production Build)
  # ===========================================================================
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/simorgh-frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    expose:
      - "80"
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:80" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ===========================================================================
  # BACKEND - FastAPI Main Application
  # ===========================================================================
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/simorgh-backend:${IMAGE_TAG:-latest}
    container_name: backend
    environment:
      - PYTHONUNBUFFERED=1
      # HuggingFace Model Cache - Use cached models first, fallback to download
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/hub
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/torch/sentence_transformers
      - HF_HUB_OFFLINE=0
      # Neo4j (optional - no longer required, kept for legacy endpoint compatibility)
      - NEO4J_URI=${NEO4J_URI:-}
      - NEO4J_USER=${NEO4J_USER:-}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CHAT_DB=1
      - REDIS_CACHE_DB=2
      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      # CocoIndex (removed - no longer used)
      # - COCOINDEX_PIPELINE_DIR=/app/cocoindex_flows
      # - COCOINDEX_DATABASE_URL=postgresql://cocoindex:${COCOINDEX_DB_PASSWORD:-cocoindex_2024}@cocoindex_db:5432/cocoindex
      # SQL Server (Auth) - Read Only
      - SQL_SERVER_HOST=${SQL_SERVER_HOST}
      - SQL_SERVER_PORT=${SQL_SERVER_PORT:-1433}
      - SQL_SERVER_USER=${SQL_SERVER_USER}
      - SQL_SERVER_PASSWORD=${SQL_SERVER_PASSWORD}
      - SQL_SERVER_DATABASE=${SQL_SERVER_DATABASE}
      # MySQL TPMS (Auth) - Read Only
      - MYSQL_HOST=${MYSQL_HOST:-192.168.1.148}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-TPMS}
      # JWT Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      # PostgreSQL Auth Database (Modern Auth)
      - POSTGRES_AUTH_HOST=postgres_auth
      - POSTGRES_AUTH_PORT=5432
      - POSTGRES_AUTH_DATABASE=${POSTGRES_AUTH_DATABASE:-simorgh_auth}
      - POSTGRES_AUTH_USER=${POSTGRES_AUTH_USER:-simorgh}
      - POSTGRES_AUTH_PASSWORD=${POSTGRES_AUTH_PASSWORD:-simorgh_secure_2024}
      # LLM Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - LOCAL_LLM_URL=http://nginx/api/llm
      - DEFAULT_LLM_MODE=${DEFAULT_LLM_MODE:-online}
      # Document Processor
      - DOC_PROCESSOR_URL=http://doc-processor:8000
      # Google OAuth 2.0
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://simorghai.electrokavir.com/chatbot/auth/google/callback}
      # Email Service (SMTP)
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@simorgh.ai}
      - FROM_NAME=${FROM_NAME:-Simorgh AI}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUTO_VERIFY_EMAIL=${AUTO_VERIFY_EMAIL:-false}
      # Frontend URL (used in email verification/reset links)
      - FRONTEND_URL=${FRONTEND_URL:-https://simorghai.electrokavir.com/chatbot}
      # Cookie & Security Settings (true for HTTPS)
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      # User Tiers & Admin
      - ADMIN_SETUP_SECRET=${ADMIN_SETUP_SECRET}
      # NOWPayments (Crypto Payments)
      - NOWPAYMENTS_API_KEY=${NOWPAYMENTS_API_KEY}
      - NOWPAYMENTS_IPN_SECRET=${NOWPAYMENTS_IPN_SECRET}
      - NOWPAYMENTS_SANDBOX=${NOWPAYMENTS_SANDBOX:-false}
      # Shell Service (Project Agent) - runs on 192.168.1.69
      - SHELL_SERVICE_URL=http://192.168.1.69:8010
      - SHELL_SERVICE_TOKEN=${SHELL_SERVICE_TOKEN:-}
      - SHELL_SERVICE_TIMEOUT=60
      # Project Email Gateway
      - PROJECT_EMAIL_DOMAIN=${PROJECT_EMAIL_DOMAIN:-simorghai.electrokavir.com}
      # Agent Microservice URLs (REST - fallback)
      - SEARCH_SERVICE_URL=http://search-service:8020
      - TPMS_FETCHER_URL=http://tpms-fetcher:8021
      - PROJECT_INIT_URL=http://project-init:8022
      - PROJECT_ANALYSIS_URL=http://project-analysis:8023
      - COMMAND_GEN_URL=http://command-gen:8024
      - FILE_EXPORT_URL=http://file-export:8025
      - EPLAN_BRIDGE_URL=http://eplan-bridge:8026
      # Agent Microservice MCP URLs (primary)
      - SEARCH_MCP_URL=http://search-service:8020/mcp
      - TPMS_FETCHER_MCP_URL=http://tpms-fetcher:8021/mcp
      - PROJECT_INIT_MCP_URL=http://project-init:8022/mcp
      - PROJECT_ANALYSIS_MCP_URL=http://project-analysis:8023/mcp
      - COMMAND_GEN_MCP_URL=http://command-gen:8024/mcp
      - FILE_EXPORT_MCP_URL=http://file-export:8025/mcp
      - EPLAN_BRIDGE_MCP_URL=http://eplan-bridge:8026/mcp
      # Redis Agent DB
      - REDIS_AGENT_DB=5
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backend/services:/app/services
      - huggingface_cache:/root/.cache/huggingface
      - sentence_transformers_cache:/root/.cache/torch/sentence_transformers
    expose:
      - "8890"
    networks:
      - app_net
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres_auth:
        condition: service_healthy
      doc-processor:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8890/health | grep -q 'healthy' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ===========================================================================
  # DOC-PROCESSOR - Document to Markdown Conversion Service
  # ===========================================================================
  doc-processor:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/simorgh-doc-processor:${IMAGE_TAG:-latest}
    container_name: doc-processor
    expose:
      - "8000"
    volumes:
      - ./uploads/docs:/app/processed_docs
      - ./uploads/temp:/app/temp
    networks:
      - app_net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  # ===========================================================================
  # TTS-SERVICE - Text-to-Speech using edge-tts (CPU)
  # ===========================================================================
  tts-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/simorgh-tts-service:${IMAGE_TAG:-latest}
    container_name: tts-service
    expose:
      - "8002"
    volumes:
      - tts_cache:/app/cache # Cache synthesized audio
    networks:
      - app_net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8002/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TTS_VOICE=${TTS_VOICE:-en-US-AriaNeural}
      - TTS_LANGUAGE=${TTS_LANGUAGE:-en}
      - TTS_MAX_CACHE_MB=${TTS_MAX_CACHE_MB:-500}

  # ===========================================================================
  # STT-SERVICE - Speech-to-Text using Faster-Whisper (CPU)
  # ===========================================================================
  stt-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/simorgh-stt-service:${IMAGE_TAG:-latest}
    container_name: stt-service
    expose:
      - "8001"
    volumes:
      - stt_models:/app/models # Cache Whisper models
    networks:
      - app_net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8001/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s # Model loading takes time
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base} # tiny, base, small, medium
      - WHISPER_DEVICE=cpu # Use CPU to avoid GPU memory conflicts
      - WHISPER_COMPUTE_TYPE=int8 # Optimized for CPU

  # ===========================================================================
  # NEO4J - REMOVED (replaced by MCP + Qdrant + git-based project management)
  # ===========================================================================
  # neo4j:
  #   image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirror-neo4j:5.15.0-community
  #   container_name: neo4j
  #   ...
  # To restore, see git history for the full service definition.

  # ===========================================================================
  # REDIS - Caching & Session Store (Mirrored from Docker Hub to GHCR)
  # ===========================================================================
  redis:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirror-redis:7.2-alpine
    container_name: redis
    command: >
      redis-server  --appendonly yes  --maxmemory 512mb  --maxmemory-policy allkeys-lru --save 60 1 --save 300 10
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - app_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # QDRANT - Vector Database (Mirrored from Docker Hub to GHCR)
  # ===========================================================================
  qdrant:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirror-qdrant:latest
    container_name: qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app_net
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # ===========================================================================
  # COCOINDEX + COCOINDEX DB - REMOVED (no longer needed)
  # ===========================================================================
  # CocoIndex and its PostgreSQL database have been removed.
  # Document processing now uses Qdrant for vector search directly.
  # To restore, see git history for the full service definitions.

  # ===========================================================================
  # POSTGRES AUTH - PostgreSQL for Modern Authentication (Mirrored from Docker Hub to GHCR)
  # ===========================================================================
  postgres_auth:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirror-postgres:16-alpine
    container_name: postgres_auth
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_AUTH_USER:-simorgh}
      - POSTGRES_PASSWORD=${POSTGRES_AUTH_PASSWORD:-simorgh_secure_2024}
      - POSTGRES_DB=${POSTGRES_AUTH_DATABASE:-simorgh_auth}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./backend/database/migrations/001_create_auth_tables.sql:/docker-entrypoint-initdb.d/001_create_auth_tables.sql:ro
      - ./backend/database/migrations/003_project_agent_system.sql:/docker-entrypoint-initdb.d/003_project_agent_system.sql:ro
    expose:
      - "5432"
    networks:
      - app_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER:-simorgh} -d ${POSTGRES_AUTH_DATABASE:-simorgh_auth}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # PGADMIN - PostgreSQL Administration Tool (DISABLED - Docker Hub issues)
  # ===========================================================================
  # Uncomment when Docker Hub is accessible:
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: pgadmin
  #   restart: unless-stopped
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@simorgh.local}
  #     - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
  #     - PGADMIN_CONFIG_SERVER_MODE=True
  #     - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - app_net
  #   depends_on:
  #     postgres_auth:
  #       condition: service_healthy

  # ===========================================================================
  # NGINX - Reverse Proxy (HTTP-only, TLS terminated at host nginx)

  # NGINX - Reverse Proxy (Mirrored from Docker Hub to GHCR)
  # ===========================================================================
  # SSL disabled until firewall allows .well-known paths for Let's Encrypt

  # ===========================================================================
  nginx:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirror-nginx:alpine
    container_name: nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "85:80"    # HTTP - mapped to port 85 (host nginx proxies here)
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ./nginx_configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx_configs/includes/locations.inc:/etc/nginx/includes/locations.inc:ro
      - ./static:/usr/share/nginx/html/old:ro
      - nginx-cache:/data/nginx/cache
      - nginx-logs:/var/log/nginx
    networks:
      - app_net
    restart: unless-stopped

  # ===========================================================================
  # CERTBOT SERVICES - DISABLED (firewall blocks .well-known paths)
