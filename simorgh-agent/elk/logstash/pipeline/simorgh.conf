input {
  # Filebeat ships container stdout (JSON or plaintext).
  beats {
    port => 5044
  }
  # Services using simorgh_logging.send_to_logstash() ship structlog JSON
  # directly here over TCP.
  tcp {
    port  => 5045
    codec => json_lines
    type  => "simorgh-app"
  }
}

filter {
  # Filebeat container logs arrive with the docker JSON envelope around the
  # actual application JSON. Unwrap if present.
  if [type] != "simorgh-app" and [message] =~ /^\s*\{/ {
    json {
      source        => "message"
      target        => "app"
      skip_on_invalid_json => true
    }
    if "_jsonparsefailure" not in [tags] {
      mutate {
        rename => { "[app][service]"     => "service" }
        rename => { "[app][level]"       => "level" }
        rename => { "[app][event]"       => "event" }
        rename => { "[app][request_id]"  => "request_id" }
        rename => { "[app][user_id]"     => "user_id" }
        rename => { "[app][project_id]"  => "project_id" }
        rename => { "[app][oenum]"       => "oenum" }
        rename => { "[app][cot_step_id]" => "cot_step_id" }
        rename => { "[app][tool]"        => "tool" }
        rename => { "[app][latency_ms]"  => "latency_ms" }
      }
    }
  }

  # Normalise level → keyword.
  if [level] {
    mutate { lowercase => [ "level" ] }
  }

  # Drop very chatty health-check lines.
  if [event] == "GET /health" or [message] =~ /GET \/health/ {
    drop {}
  }
}

output {
  # Route by event-class into purpose-specific indices. The agent's
  # context-search-service queries these by name.
  if [event] == "cot_step" or [cot_step_id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "simorgh-cot-%{+YYYY.MM.dd}"
    }
  } else if [event] == "audit" or [tool] == "audit" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "simorgh-audit-%{+YYYY.MM.dd}"
    }
  } else if [service] == "mail-bridge" or [tool] == "mail" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "simorgh-mail-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "simorgh-logs-%{+YYYY.MM.dd}"
    }
  }
}
