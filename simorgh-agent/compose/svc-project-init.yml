# =============================================================================
# PROJECT-INIT - Project initialization orchestrator
# Port 8022. Talks to tpms-fetcher (REST) and shell-service (REST, on .69).
# =============================================================================
services:
  project-init:
    build: ../project-init-service
    image: simorgh-project-init:local
    container_name: project-init
    expose:
      - "8022"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - TPMS_FETCHER_URL=http://tpms-fetcher:8021
      - SHELL_SERVICE_URL=${SHELL_SERVICE_URL:-http://192.168.1.69:8010}
      - SHELL_SERVICE_TOKEN=${SHELL_SERVICE_TOKEN:-}
    depends_on:
      tpms-fetcher:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8022/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
