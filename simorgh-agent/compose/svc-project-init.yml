# =============================================================================
# PROJECT-INIT - Project initialization orchestrator (rewritten).
# Port 8022. Talks to gitlab-mcp, tpms-context-agent, context-search.
# Shell-service is GONE — there is no .69 host involved any more.
# =============================================================================
services:
  project-init:
    image: ${IMAGE_PREFIX:-ghcr.io/shahram-tabasi/}simorgh-project-init:${IMAGE_TAG:-latest}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    container_name: project-init
    expose:
      - "8022"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - GITLAB_MCP_URL=${GITLAB_MCP_URL:-http://gitlab-mcp:8047}
      - RUNTIME_BROKER_URL=${RUNTIME_BROKER_URL:-http://runtime-broker:8048}
      - TPMS_CONTEXT_URL=${TPMS_CONTEXT_URL:-http://tpms-context-agent:8050}
      - TPMS_FETCHER_URL=${TPMS_FETCHER_URL:-http://tpms-fetcher:8021}
      - CONTEXT_SEARCH_URL=${CONTEXT_SEARCH_URL:-http://context-search:8049}
      - PROJECT_EXPLORER_URL=${PROJECT_EXPLORER_URL:-http://project-explorer:8052}
      - DOC_PROCESSOR_URL=${DOC_PROCESSOR_URL:-http://doc-processor:8000}
      - GITLAB_PROJECTS_GROUP=${GITLAB_PROJECTS_GROUP:-simorgh-projects}
      - GITLAB_TECH_KB_REPO=${GITLAB_TECH_KB_REPO:-simorgh-knowledge/technical-knowledge}
      - EKC_KB_CLONE_URL=${EKC_KB_CLONE_URL:-}
      - TECHSERVER_HOST=${TECHSERVER_HOST:-192.168.1.3}
      - TECHSERVER_SHARE=${TECHSERVER_SHARE:-techser}
      - TECHSERVER_USER=${TECHSERVER_USER:-}
      - TECHSERVER_PASS=${TECHSERVER_PASS:-}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      - BROKER_TOKEN=${BROKER_TOKEN:-}
      - LOGSTASH_HOST=${LOGSTASH_HOST:-logstash}
      - LOGSTASH_PORT=${LOGSTASH_PORT:-5045}
    depends_on:
      gitlab-mcp:
        condition: service_healthy
      runtime-broker:
        condition: service_healthy
      tpms-context-agent:
        condition: service_healthy
      context-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8022/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
