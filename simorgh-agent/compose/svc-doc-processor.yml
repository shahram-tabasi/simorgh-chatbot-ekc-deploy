# =============================================================================
# DOC-PROCESSOR - Universal document → Markdown converter (PDF/Excel/Word + OCR)
# Port 8000. Used by: backend (DOC_PROCESSOR_URL).
# =============================================================================
services:
  doc-processor:
    image: simorgh-doc-processor:local
    build: ../doc-processor
    container_name: doc-processor
    expose:
      - "8000"
    volumes:
      - ../uploads/docs:/app/processed_docs
      - ../uploads/temp:/app/temp
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # Set USE_DOCLING=1 (and uncomment svc-docling.yml in docker-compose.yml)
      # to route PDF/DOCX extraction through docling-serve. On any failure
      # (network, timeout, empty result) doc-processor silently falls back
      # to the local pdfplumber+EasyOCR / python-docx pipeline — flipping
      # this flag cannot break uploads.
      - USE_DOCLING=${USE_DOCLING:-0}
      - DOCLING_URL=${DOCLING_URL:-http://docling-serve:5001}
      - DOCLING_TIMEOUT_SEC=${DOCLING_TIMEOUT_SEC:-180}
      # VLM image understanding. Images are described by the local VLM
      # (Qwen2.5-VL on .62) via llm-gateway → structured markdown, the
      # perception stage of describe-then-reason. Falls back to EasyOCR
      # on any failure. Set USE_VLM_IMAGES=0 to force the OCR path.
      - LLM_GATEWAY_URL=${LLM_GATEWAY_URL:-http://llm-gateway:8030}
      - USE_VLM_IMAGES=${USE_VLM_IMAGES:-1}
      - VLM_IMAGE_MAX_TOKENS=${VLM_IMAGE_MAX_TOKENS:-1800}
      - VLM_IMAGE_TIMEOUT_SEC=${VLM_IMAGE_TIMEOUT_SEC:-180}

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
