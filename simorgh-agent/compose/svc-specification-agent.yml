# =============================================================================
# SPECIFICATION-AGENT-SERVICE - Electrical spec extraction + equipment classifier
# Port 8036. REST + MCP. Extracted from backend in Phase 8.
# AI/COT clients use http://specification-agent-service:8036/mcp.
# REST routes at /api/v2/specs/*.
# =============================================================================
services:
  specification-agent-service:
    image: ${IMAGE_PREFIX:-ghcr.io/shahram-tabasi/}simorgh-specification-agent-service:${IMAGE_TAG:-latest}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    build: ../specification-agent-service
    container_name: specification-agent-service
    expose:
      - "8036"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_AUTH_HOST=${POSTGRES_AUTH_HOST:-postgres_auth}
      - POSTGRES_AUTH_PORT=${POSTGRES_AUTH_PORT:-5432}
      - POSTGRES_AUTH_DATABASE=${POSTGRES_AUTH_DATABASE:-simorgh_auth}
      - POSTGRES_AUTH_USER=${POSTGRES_AUTH_USER:-simorgh}
      - POSTGRES_AUTH_PASSWORD=${POSTGRES_AUTH_PASSWORD:-simorgh_secure_2024}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://nginx/api/llm}
      - DEFAULT_LLM_MODE=${DEFAULT_LLM_MODE:-online}
      - LLM_GATEWAY_URL=http://llm-gateway:8030
      - DOC_PROCESSOR_URL=http://doc-processor:8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/torch/sentence_transformers
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - sentence_transformers_cache:/root/.cache/torch/sentence_transformers
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8036/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  huggingface_cache:
    name: simorgh_huggingface_cache
    driver: local
  sentence_transformers_cache:
    name: simorgh_sentence_transformers_cache
    driver: local
