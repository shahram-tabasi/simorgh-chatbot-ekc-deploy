# =============================================================================
# RUNTIME-BROKER - Ephemeral docker-run sandbox for python / bash / node.
# Replaces shell-service. The broker spawns a fresh container per task using
# stock images (python:3.12-slim, node:20-alpine, ubuntu:22.04), enforces
# cgroup mem/CPU/pids/seccomp, and tears it down on completion.
#
# Needs access to /var/run/docker.sock to spawn sibling containers.
# =============================================================================
services:
  runtime-broker:
    build:
      context: ..
      dockerfile: runtime-broker/Dockerfile
    image: simorgh-runtime-broker:local
    container_name: runtime-broker
    # Run with multiple uvicorn workers so concurrent CoT calls don't queue.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8048",
              "--workers", "${BROKER_WORKERS:-4}"]
    expose:
      - "8048"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - BROKER_TOKEN=${BROKER_TOKEN:?set BROKER_TOKEN in .env}
      - BROKER_NETWORK=${BROKER_NETWORK:-none}
      - BROKER_PYTHON_IMAGE=${BROKER_PYTHON_IMAGE:-python:3.12-slim}
      - BROKER_NODE_IMAGE=${BROKER_NODE_IMAGE:-node:20-alpine}
      - BROKER_SHELL_IMAGE=${BROKER_SHELL_IMAGE:-ubuntu:22.04}
      - BROKER_DEFAULT_TIMEOUT=${BROKER_DEFAULT_TIMEOUT:-30}
      - BROKER_MAX_TIMEOUT=${BROKER_MAX_TIMEOUT:-300}
      - BROKER_MEM_LIMIT=${BROKER_MEM_LIMIT:-1g}
      - BROKER_CPU_QUOTA=${BROKER_CPU_QUOTA:-100000}   # 1 full CPU / 100ms
      - BROKER_PIDS_LIMIT=${BROKER_PIDS_LIMIT:-256}
      - BROKER_TMPFS_SIZE=${BROKER_TMPFS_SIZE:-256m}
      - BROKER_MAX_CONCURRENT=${BROKER_MAX_CONCURRENT:-32}
      - LOGSTASH_HOST=${LOGSTASH_HOST:-logstash}
      - LOGSTASH_PORT=${LOGSTASH_PORT:-5045}
    deploy:
      resources:
        limits:
          memory: ${BROKER_MEM_LIMIT_BROKER:-1g}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runtime_workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8048/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  runtime_workspace:
    name: simorgh_runtime_workspace
    driver: local
