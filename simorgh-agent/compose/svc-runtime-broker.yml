# =============================================================================
# RUNTIME-BROKER - Per-project long-lived shell-runtime containers.
# Each project gets one named container with a persistent docker volume mounted
# at /work. The broker exposes start/stop/exec/file IO for the CoT engine.
#
# Needs access to /var/run/docker.sock to spawn sibling containers.
# =============================================================================
services:
  runtime-broker:
    build:
      context: ..
      dockerfile: runtime-broker/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/shahram-tabasi/}simorgh-runtime-broker:${IMAGE_TAG:-latest}
    container_name: runtime-broker
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8048",
              "--workers", "${BROKER_WORKERS:-4}"]
    expose:
      - "8048"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - BROKER_TOKEN=${BROKER_TOKEN:?set BROKER_TOKEN in .env}
      - BROKER_SESSION_IMAGE=${BROKER_SESSION_IMAGE:-simorgh/session-runtime:latest}
      - BROKER_SESSION_NETWORK=${BROKER_SESSION_NETWORK:-bridge}
      - BROKER_DEFAULT_TIMEOUT=${BROKER_DEFAULT_TIMEOUT:-60}
      - BROKER_MAX_TIMEOUT=${BROKER_MAX_TIMEOUT:-1800}
      - BROKER_MEM_LIMIT=${BROKER_MEM_LIMIT:-1g}
      - BROKER_CPU_QUOTA=${BROKER_CPU_QUOTA:-100000}
      - BROKER_PIDS_LIMIT=${BROKER_PIDS_LIMIT:-512}
      # Idle teardown — containers untouched for this many seconds get
      # stopped (volume is preserved). 0 disables the sweeper.
      - BROKER_IDLE_TTL_SEC=${BROKER_IDLE_TTL_SEC:-86400}
      - BROKER_IDLE_SWEEP_SEC=${BROKER_IDLE_SWEEP_SEC:-600}
      - DOC_PROCESSOR_URL=${DOC_PROCESSOR_URL:-http://doc-processor:8000}
      - LOGSTASH_HOST=${LOGSTASH_HOST:-logstash}
      - LOGSTASH_PORT=${LOGSTASH_PORT:-5045}
    deploy:
      resources:
        limits:
          memory: ${BROKER_MEM_LIMIT_BROKER:-1g}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runtime_workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8048/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  runtime_workspace:
    name: simorgh_runtime_workspace
    driver: local
