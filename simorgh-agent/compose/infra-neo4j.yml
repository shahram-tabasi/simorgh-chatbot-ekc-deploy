# =============================================================================
# NEO4J - Knowledge graph database (legacy GraphRAG, optional)
# Off by default. Enable by uncommenting in master docker-compose.yml.
# =============================================================================
services:
  neo4j:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirror-neo4j:5.15.0-community
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-simorgh_secure_2024}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  neo4j_data:
    name: simorgh_neo4j_data
    driver: local
  neo4j_logs:
    name: simorgh_neo4j_logs
    driver: local
  neo4j_plugins:
    name: simorgh_neo4j_plugins
    driver: local
