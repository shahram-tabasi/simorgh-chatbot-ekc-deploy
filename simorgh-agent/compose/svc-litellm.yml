# =============================================================================
# LITELLM PROXY - OpenAI-compatible gateway in front of vLLM (.61, .62)
# Internal port 4000.
#
# Now consumed via the llm-gateway shim (USE_LITELLM=1, see
# svc-llm-gateway.yml). Clients keep talking to llm-gateway's existing
# /generate, /generate/stream, /embeddings routes; llm-gateway rewrites
# the upstream transport to point here. No client-code changes needed.
#
# Activation:
#   1. Edit litellm/config.yaml — model_list[].api_base must match your
#      vLLM endpoints on .61 / .62. Default config already points at
#      192.168.1.61:8000 and 192.168.1.62:8000.
#   2. Uncomment the master include for this file.
#   3. Set USE_LITELLM=1 in .env (or shell) so llm-gateway routes here.
#   4. docker compose up -d litellm llm-gateway
#   5. Verify: curl http://<host>/api/llm-gateway/health | jq .litellm
#              curl http://<host>/api/llm-gateway/health/deep | jq .checks.litellm
#
# Roll back instantly:
#   USE_LITELLM=0 docker compose up -d llm-gateway
#
# (Direct-path migration — clients calling LiteLLM at /v1/chat/completions
# bypassing llm-gateway — is still possible if you want to retire
# llm-gateway entirely. Not the default path: the shim keeps all the
# Simorgh-specific routing logic (mode/auto, vision sniffing, /stats,
# /generate/stream protocol) intact.)
# =============================================================================
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    expose:
      - "4000"
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
      - "--num_workers=2"
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_TELEMETRY=False     # offline-safe: no phone-home
      # - LITELLM_MASTER_KEY=...     # set if you want /v1 endpoints auth-gated
      # - DATABASE_URL=...           # set if you want spend tracking via Postgres
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4000/health/liveliness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
