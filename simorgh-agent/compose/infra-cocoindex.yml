# =============================================================================
# COCOINDEX - Data framework / document indexing pipeline (optional)
# Off by default. Enable together with infra-cocoindex-db.yml.
# Builds Rust toolchain inside container; first start can take 5-10 min.
# =============================================================================
services:
  cocoindex:
    image: python:3.11-bookworm
    container_name: cocoindex
    restart: unless-stopped
    depends_on:
      cocoindex_db:
        condition: service_healthy
    volumes:
      - ../uploads:/docs:ro
      - ../backend/cocoindex_flows:/app
    working_dir: /app
    command: >
      sh -c "
        echo 'Starting CocoIndex setup...' &&
        apt-get update && apt-get install -y git build-essential curl &&
        rm -rf /tmp/coco || true &&
        (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y || (echo 'WARNING: Rust install failed.' && tail -f /dev/null)) &&
        . /root/.cargo/env &&
        (git clone --depth 1 https://github.com/cocoindex-io/cocoindex.git /tmp/coco || (echo 'WARNING: clone failed.' && tail -f /dev/null)) &&
        cd /tmp/coco && pip install --no-cache-dir . openai &&
        cd /app && echo 'CocoIndex ready' && tail -f /dev/null
      "
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COCOINDEX_DATABASE_URL=postgresql://cocoindex:${COCOINDEX_DB_PASSWORD:-cocoindex_2024}@cocoindex_db:5432/cocoindex
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-simorgh_secure_2024}
    networks:
      - app_net

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
