# =============================================================================
# TECHSERVER-MCP - Read-only MCP over the legacy techserver (SMB host).
# Port 8053. REST + MCP. Modelled on gitlab-mcp.
#
# Each engineering project is a top-level SMB share on 192.168.1.3 named
# after its OE folder (OE12065, OE11071-Sunlight…). This service lists a
# project's tree WITHOUT downloading and fetches single files on demand —
# it never bulk-copies (the Drawing/ CAD subtree is gigabytes and is hard-
# excluded). The CoT engine consumes it via TECHSERVER_MCP_URL.
#
# It also serves what EPLAN writes back to that share: /eplan/pdf and
# /eplan/zip, which simorgh-soft's Send to EPLAN download buttons read. Those
# two step past the exclusions on purpose — see the note in app.py. They used
# to live in a service of their own; there is one techserver and one set of
# credentials for it, and two services SMB-ing into the same shares with two
# different SMB libraries was one configuration too many.
# =============================================================================
services:
  techserver-mcp:
    image: ${IMAGE_PREFIX:-ghcr.io/shahram-tabasi/}simorgh-techserver-mcp:${IMAGE_TAG:-latest}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    build:
      context: ..
      dockerfile: techserver-mcp-service/Dockerfile
    container_name: techserver-mcp
    expose:
      - "8053"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Internal-only traffic (SMB to .3, HTTP to doc-processor/redis).
      # The xray proxy 503s on RFC1918 dst, so disable it.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=*
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      # Techserver SMB connection. EKC\tech is the working login proven
      # against the live host; password MUST be supplied via env/secret.
      - TECHSERVER_HOST=${TECHSERVER_HOST:-192.168.1.3}
      - TECHSERVER_USER=${TECHSERVER_USER:-EKC\tech}
      - TECHSERVER_PASSWORD=${TECHSERVER_PASSWORD:-}
      - TECHSERVER_DOMAIN=${TECHSERVER_DOMAIN:-}
      - TECHSERVER_SMB_PROTO=${TECHSERVER_SMB_PROTO:-SMB3}
      - TECHSERVER_SMB_TIMEOUT=${TECHSERVER_SMB_TIMEOUT:-120}
      - TECHSERVER_GET_TIMEOUT=${TECHSERVER_GET_TIMEOUT:-300}
      # Hard exclusions (never touch Drawing/, never pull CAD/archives).
      - TECHSERVER_EXCLUDE_DIRS=${TECHSERVER_EXCLUDE_DIRS:-Drawing}
      - TECHSERVER_EXCLUDE_EXTS=${TECHSERVER_EXCLUDE_EXTS:-.dwg,.dxf,.ema,.edb,.elk,.dwl,.bak,.7z,.rar,.zip}
      - TECHSERVER_MAX_ARTIFACT_BYTES=${TECHSERVER_MAX_ARTIFACT_BYTES:-41943040}
      # Tree cache.
      - REDIS_URL=${TECHSERVER_REDIS_URL:-redis://redis:6379/0}
      - TECHSERVER_TREE_TTL=${TECHSERVER_TREE_TTL:-3600}
      - TECHSERVER_SHARE_TTL=${TECHSERVER_SHARE_TTL:-86400}
      # Type-aware extraction (PDF/Office/text + VLM for images).
      - DOC_PROCESSOR_URL=${DOC_PROCESSOR_URL:-http://doc-processor:8000}
      # What EPLAN produced. /eplan/pdf and /eplan/zip hand back the drawing
      # and the project that Send to EPLAN leaves on this same share — the
      # only two routes here that step past the exclusions above, because an
      # .elk, its .edb and a plot PDF are exactly what those exclusions name.
      # Bounded instead by the .elk suffix and by this ceiling, which is its
      # own because a project legitimately runs to hundreds of megabytes.
      - EPLAN_ZIP_MAX_BYTES=${EPLAN_ZIP_MAX_BYTES:-2147483648}
      # Optional. Set it and those two routes require X-API-Key; leave it
      # unset and they are open on app_net like the rest of this service.
      - EPLAN_FILES_API_KEY=${EPLAN_FILES_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8053/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
