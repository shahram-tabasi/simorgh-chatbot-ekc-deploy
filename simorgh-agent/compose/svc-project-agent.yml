# =============================================================================
# PROJECT-AGENT-SERVICE - Project init + task execution + COT engine
# Port 8035. REST + MCP. Extracted from backend in Phase 7.
# AI/COT clients use http://project-agent-service:8035/mcp.
# REST routes mounted at /api/v2/agent/*.
# =============================================================================
services:
  project-agent-service:
    image: simorgh-project-agent-service:local
    build: ../project-agent-service
    container_name: project-agent-service
    expose:
      - "8035"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # The docker daemon injects HTTP_PROXY=http://172.17.0.1:10809 (Xray)
      # into every container. The proxy returns 503 / hangs on internal
      # service hostnames (e.g. project-explorer), which breaks MCP
      # connect_all because httpx routes streamablehttp_client traffic
      # through it. project-agent only talks to internal docker
      # services, so disable the proxy outright here.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=*
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_AGENT_DB=5
      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      # PostgreSQL
      - POSTGRES_AUTH_HOST=${POSTGRES_AUTH_HOST:-postgres_auth}
      - POSTGRES_AUTH_PORT=${POSTGRES_AUTH_PORT:-5432}
      - POSTGRES_AUTH_DATABASE=${POSTGRES_AUTH_DATABASE:-simorgh_auth}
      - POSTGRES_AUTH_USER=${POSTGRES_AUTH_USER:-simorgh}
      - POSTGRES_AUTH_PASSWORD=${POSTGRES_AUTH_PASSWORD:-simorgh_secure_2024}
      # LLM
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://nginx/api/llm}
      - DEFAULT_LLM_MODE=${DEFAULT_LLM_MODE:-online}
      - LLM_GATEWAY_URL=http://llm-gateway:8030
      # CoT planner endpoint. Priority order in cot_engine._call_llm,
      # controlled by COT_PLANNER_PRIMARY:
      #   harmony     (default) → LLM_GATEWAY_URL with Harmony tool calls
      #                           (gpt-oss-20b on .61 emits submit_plan via
      #                           native tool_calls channel; rich plans).
      #   guided_json           → LLM_GATEWAY_URL with vLLM guided_json
      #                           decoding (schema-constrained; still gpt-oss
      #                           on .61, kept for A/B testing).
      #   Both paths auto-fall-through to COT_LLM_BASE_URL (Qwen2.5-VL-7B
      #   on .62) if the gpt-oss reply is empty / unparseable, and finally
      #   to the legacy self.llm_service path.
      - COT_PLANNER_PRIMARY=${COT_PLANNER_PRIMARY:-harmony}
      - COT_LLM_BASE_URL=${COT_LLM_BASE_URL:-http://nginx/api/vlm/v1}
      - COT_LLM_MODEL=${COT_LLM_MODEL:-qwen2.5-vl-7b}
      # 4096 covers the full submit_plan arguments object for typical
      # multi-step plans; 2048 was tight enough to truncate gpt-oss JSON
      # mid-step on retrieval-heavy requests.
      - COT_LLM_MAX_TOKENS=${COT_LLM_MAX_TOKENS:-4096}
      # MCP transport tuning. Some MCP servers (context-search, gitlab-mcp)
      # reap idle sessions; the streamable-http client doesn't propagate
      # the resulting 400 back to the in-flight call_tool future, so every
      # stale call would otherwise wait MCP_CALL_TIMEOUT_SEC before the
      # retry path fires. We pre-emptively reconnect any session that has
      # been idle longer than MCP_SESSION_MAX_IDLE_SEC.
      - MCP_CALL_TIMEOUT_SEC=${MCP_CALL_TIMEOUT_SEC:-15}
      - MCP_SESSION_MAX_IDLE_SEC=${MCP_SESSION_MAX_IDLE_SEC:-25}
      - MCP_RECONNECT_TIMEOUT_SEC=${MCP_RECONNECT_TIMEOUT_SEC:-10}
      # Background keepalive interval. Each connected MCP session is
      # pinged on this cadence so the server's idle reaper never fires
      # (recommended upstream pattern; fastmcp#120, mcp spec). Set to 0
      # to disable and rely entirely on the on-call refresh path.
      - MCP_KEEPALIVE_SEC=${MCP_KEEPALIVE_SEC:-20}
      # 2026-05 enterprise migration: code exec → runtime-broker (ephemeral
      # docker), project files → gitlab-mcp, mail → mail-bridge.
      - RUNTIME_BROKER_URL=${RUNTIME_BROKER_URL:-http://runtime-broker:8048}
      - BROKER_TOKEN=${BROKER_TOKEN:-}
      - GITLAB_MCP_URL=${GITLAB_MCP_URL:-http://gitlab-mcp:8047}
      - GITLAB_PROJECTS_GROUP=${GITLAB_PROJECTS_GROUP:-simorgh-projects}
      - GITLAB_TECH_KB_REPO=${GITLAB_TECH_KB_REPO:-simorgh-knowledge/technical-knowledge}
      # Always-on knowledge-repo grounding layer (knowledge_repo_service).
      # GITLAB_TECH_KB_REPO above tells it WHICH repo to mirror; the
      # next two govern HOW. EMBEDDINGS_URL is HARDCODED here — same
      # rationale as chat-service: .env may set it to a legacy host
      # like http://embeddings:8037 for context-search, which would
      # silently break the knowledge query/embed step.
      - EMBEDDINGS_URL=http://embeddings-service:8031
      - KNOWLEDGE_REPO_BRANCH=${KNOWLEDGE_REPO_BRANCH:-main}
      - KNOWLEDGE_REPO_COLLECTION=${KNOWLEDGE_REPO_COLLECTION:-technical_knowledge_kb}
      - KNOWLEDGE_REPO_REFRESH_HOURS=${KNOWLEDGE_REPO_REFRESH_HOURS:-24}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      # Mail bridge to Mailcow (replaces mail-gateway + project-mail).
      - MAIL_BRIDGE_URL=http://mail-bridge:8051
      - PROJECT_EMAIL_DOMAIN=${PROJECT_EMAIL_DOMAIN:-simorghai.electrokavir.com}
      # On-demand TPMS context for CoT (replaces shell-copy of tpms_project_data.md).
      - TPMS_CONTEXT_URL=${TPMS_CONTEXT_URL:-http://tpms-context-agent:8050}
      - TPMS_FETCHER_URL=http://tpms-fetcher:8021
      # Hybrid (BM25 + kNN) search over ES — feeds high-quality LLM context.
      - CONTEXT_SEARCH_URL=${CONTEXT_SEARCH_URL:-http://context-search:8049}
      # Roles allowed to create projects (project-creation auth gate).
      - PROJECT_CREATE_ALLOWED_ROLES=${PROJECT_CREATE_ALLOWED_ROLES:-expert_technical}
      # Admin-managed restrictions file. Free-text constraints prepended to
      # every COT system prompt as hard rules on the final response.
      - RESTRICTIONS_PATH=/app/restrictions/system.txt
      # Other microservices reachable as MCP (the agent calls these)
      - SEARCH_MCP_URL=http://search-service:8020/mcp
      - TPMS_FETCHER_MCP_URL=http://tpms-fetcher:8021/mcp
      - PROJECT_INIT_MCP_URL=http://project-init:8022/mcp
      - PROJECT_ANALYSIS_MCP_URL=http://project-analysis:8023/mcp
      - COMMAND_GEN_MCP_URL=http://command-gen:8024/mcp
      - FILE_EXPORT_MCP_URL=http://file-export:8025/mcp
      - EPLAN_BRIDGE_MCP_URL=http://eplan-bridge:8026/mcp
      # MCP discovery for the extracted services. Set any value to "" to
      # disable that specific tool surface for the COT engine.
      - SPECIFICATION_AGENT_MCP_URL=http://specification-agent-service:8036/mcp
      - HR_KB_MCP_URL=http://hr-kb-service:8041/mcp
      - ORG_DATA_MCP_URL=http://org-data-service:8042/mcp
      - EPLAN_SQL_MCP_URL=http://eplan-sql-service:8044/mcp
      - DOCUMENTS_RAG_MCP_URL=http://documents-rag-service:8033/mcp
      - GRAPH_RAG_MCP_URL=http://graph-rag-service:8037/mcp
      # 2026-05 enterprise migration — new MCP surfaces consumed by CoT.
      - GITLAB_MCP_URL_MCP=http://gitlab-mcp:8047/mcp
      - RUNTIME_BROKER_MCP_URL=http://runtime-broker:8048/mcp
      - PROJECT_EXPLORER_MCP_URL=http://project-explorer:8052/mcp
      - TPMS_CONTEXT_MCP_URL=http://tpms-context-agent:8050/mcp
      - CONTEXT_SEARCH_MCP_URL=http://context-search:8049/mcp
      # Legacy techserver (SMB) read surface — list project tree + fetch
      # single files on demand (Drawing/ CAD excluded). Replaces the old
      # bulk techserver_sync copy.
      - TECHSERVER_MCP_URL=http://techserver-mcp:8053/mcp
      # MySQL TPMS (legacy)
      - MYSQL_HOST=${MYSQL_HOST:-192.168.1.148}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-TPMS}
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      # CORS
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      # EKC knowledge
      - EKC_KNOWLEDGE_PATH=/app/ekc-knowledge
      # HuggingFace cache (shared with embeddings-service / chat-service)
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/torch/sentence_transformers
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
      - ekc_knowledge:/app/ekc-knowledge:ro
      - huggingface_cache:/root/.cache/huggingface
      - sentence_transformers_cache:/root/.cache/torch/sentence_transformers
      # Admin-managed restrictions file. Edit on the host at
      # ${RESTRICTIONS_HOST_PATH:-/home/ubuntu/simorgh-restrictions} or
      # via PUT /api/v2/agent/restrictions.
      - restrictions:/app/restrictions
    depends_on:
      redis:
        condition: service_healthy
      postgres_auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8035/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  ekc_knowledge:
    name: simorgh_ekc_knowledge
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${EKC_KNOWLEDGE_HOST_PATH:-/home/ubuntu/ekc-knowledge}
  restrictions:
    name: simorgh_restrictions
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RESTRICTIONS_HOST_PATH:-/home/ubuntu/simorgh-restrictions}
  huggingface_cache:
    name: simorgh_huggingface_cache
    driver: local
  sentence_transformers_cache:
    name: simorgh_sentence_transformers_cache
    driver: local
