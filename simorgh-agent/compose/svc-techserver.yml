# =============================================================================
# TECHSERVER-SERVICE - Sole gateway to the corporate SMB share at .3
# Port 8043. REST + MCP. Per the no-direct-external-access policy, NO
# other service may connect to //192.168.1.3/<share> directly.
# =============================================================================
services:
  techserver-service:
    build: ../techserver-service
    container_name: techserver-service
    expose:
      - "8043"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TECHSERVER_IP=${TECHSERVER_IP:-192.168.1.3}
      - TECHSERVER_USER=${TECHSERVER_USER:-EKC\tech}
      - TECHSERVER_PASSWORD=${TECHSERVER_PASSWORD}
      - TECHSERVER_SHARE=${TECHSERVER_SHARE:-tech}
      - SMB_TIMEOUT_SEC=${SMB_TIMEOUT_SEC:-30}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8043/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
