# =============================================================================
# COCOINDEX DB - PostgreSQL with pgvector for CocoIndex pipelines (optional)
# Off by default. Enable together with infra-cocoindex.yml.
# =============================================================================
services:
  cocoindex_db:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirror-pgvector:pg17
    container_name: cocoindex_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cocoindex
      - POSTGRES_PASSWORD=${COCOINDEX_DB_PASSWORD:-cocoindex_2024}
      - POSTGRES_DB=cocoindex
    volumes:
      - cocoindex_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocoindex"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  cocoindex_db_data:
    name: simorgh_cocoindex_db_data
    driver: local
