# =============================================================================
# FRONTEND - React + Vite production build (port 80, served by nginx-alpine)
# =============================================================================
services:
  frontend:
    image: simorgh-frontend:local
    build: ../frontend
    container_name: frontend
    expose:
      - "80"
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      # Bypass any HTTP_PROXY env (Xray) the docker daemon injects —
      # otherwise wget routes the localhost request through the proxy
      # and gets a 503 from there. Also GET (not HEAD) since some nginx
      # setups have try_files rules that 4xx on HEAD.
      test: ["CMD-SHELL", "http_proxy= https_proxy= HTTP_PROXY= HTTPS_PROXY= wget -qO /dev/null http://localhost:80/chatbot/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
