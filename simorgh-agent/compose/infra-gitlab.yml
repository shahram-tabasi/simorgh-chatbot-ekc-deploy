# =============================================================================
# GITLAB CE - Source of truth for project repos + technical-knowledge.
# Replaces the SMB techserver copy + the local tech-knowledge clone that used
# to live on shell-service (.69). The agent reaches GitLab via gitlab-mcp.
#
# IMPORTANT: GitLab CE wants ~4 GB RAM and ~10 GB disk. Tune below for the
# .68 host.
# =============================================================================
services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:-17.5.1-ce.0}
    container_name: gitlab
    hostname: ${GITLAB_HOSTNAME:-gitlab.simorgh.local}
    restart: unless-stopped
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME:-gitlab.simorgh.local}'
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}
        # Tame memory on a single-host deployment.
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 10
        postgresql['shared_buffers'] = "256MB"
        prometheus_monitoring['enable'] = false
        gitlab_rails['gitlab_default_projects_features_container_registry'] = false
        # Disable mattermost / pages — we don't need them.
        mattermost['enable'] = false
        pages_external_url nil
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?set GITLAB_ROOT_PASSWORD in .env}
    ports:
      # Only the SSH port needs host exposure for git over SSH; HTTP goes
      # through host nginx (or directly via app_net for internal services).
      - "${GITLAB_SSH_PORT:-2222}:22"
    expose:
      - "80"
      - "443"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: "256m"
    networks:
      - app_net
    healthcheck:
      # /-/readiness returns 200 once Rails + Postgres + Redis are all up.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/-/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20      # GitLab can take 5+ min to come up cold.
      start_period: 300s

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  gitlab_config:
    name: simorgh_gitlab_config
    driver: local
  gitlab_logs:
    name: simorgh_gitlab_logs
    driver: local
  gitlab_data:
    name: simorgh_gitlab_data
    driver: local
