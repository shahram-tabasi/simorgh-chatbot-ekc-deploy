# =============================================================================
# PROJECT-EXPLORER - Two-phase project exploration agent.
# Port 8052. Reads via gitlab-mcp (phase 1) and execs inside the project's
# runtime-broker session container (phase 2). Result lives in Redis under
# `project:{id}:exploration` for the CoT engine to consume.
# =============================================================================
services:
  project-explorer:
    image: ${IMAGE_PREFIX:-ghcr.io/shahram-tabasi/}simorgh-project-explorer:${IMAGE_TAG:-latest}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    container_name: project-explorer
    expose:
      - "8052"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - GITLAB_MCP_URL=${GITLAB_MCP_URL:-http://gitlab-mcp:8047}
      - RUNTIME_BROKER_URL=${RUNTIME_BROKER_URL:-http://runtime-broker:8048}
      # Hard-coded redis db so the operator's top-level REDIS_URL in .env
      # (typically /0 for the legacy backend) can't accidentally clobber
      # the explorer's per-project exploration store on /5.
      - REDIS_URL=redis://redis:6379/5
      - BROKER_TOKEN=${BROKER_TOKEN:-}
      - LOGSTASH_HOST=${LOGSTASH_HOST:-logstash}
      - LOGSTASH_PORT=${LOGSTASH_PORT:-5045}
    depends_on:
      gitlab-mcp:
        condition: service_healthy
      runtime-broker:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8052/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
