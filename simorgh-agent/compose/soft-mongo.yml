# =============================================================================
# SIMORGH-SOFT MONGO - MongoDB backing store for the simorgh-soft design app
# =============================================================================
services:
  simorgh-soft-mongo:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirror-mongo:7
    container_name: simorgh-soft-mongo
    expose:
      - "27017"
    networks:
      - app_net
    volumes:
      - simorgh_soft_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  simorgh_soft_mongo_data:
    name: simorgh_soft_mongo_data
    driver: local
