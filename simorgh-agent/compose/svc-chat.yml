# =============================================================================
# CHAT-SERVICE - Chat send/stream + sessions + context + memory + summarizer
# Port 8034. REST. Extracted from backend in Phase 6.
# Routers:
#   /api/v2/chat/*               (chatbot_v2)
#   /api/v2/projects/*/sessions  (project_session)
# =============================================================================
services:
  chat-service:
    image: ${IMAGE_PREFIX:-ghcr.io/shahram-tabasi/}simorgh-chat-service:${IMAGE_TAG:-latest}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    container_name: chat-service
    expose:
      - "8034"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CHAT_DB=1
      - REDIS_CACHE_DB=2
      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      # Embeddings + HR KB (for the general-chat HR direct-RAG path).
      # HARDCODED — not ${EMBEDDINGS_URL:-...} — because chat-service
      # MUST hit the same embeddings container that hr-kb-service used
      # at index time, otherwise the query vectors come from a
      # different model and similarity scores collapse to ~0. The
      # repo's .env was overriding this to http://embeddings:8037
      # (an unrelated/legacy host) which silently broke retrieval.
      # Same reason hr-kb-service's compose hardcodes it.
      - EMBEDDINGS_URL=http://embeddings-service:8031
      - HR_KB_COLLECTION=${HR_KB_COLLECTION:-hr_general_kb}
      - HR_LLM_MODEL=${HR_LLM_MODEL:-qwen3-30b-a3b}
      # 0.15 matches the lowered Python default in hr_chat.py
      # (see commit f68db39).
      - HR_RELEVANCE_THRESHOLD=${HR_RELEVANCE_THRESHOLD:-0.15}
      # Neo4j (optional)
      - NEO4J_URI=${NEO4J_URI:-}
      - NEO4J_USER=${NEO4J_USER:-}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
      # PostgreSQL
      - POSTGRES_AUTH_HOST=${POSTGRES_AUTH_HOST:-postgres_auth}
      - POSTGRES_AUTH_PORT=${POSTGRES_AUTH_PORT:-5432}
      - POSTGRES_AUTH_DATABASE=${POSTGRES_AUTH_DATABASE:-simorgh_auth}
      - POSTGRES_AUTH_USER=${POSTGRES_AUTH_USER:-simorgh}
      - POSTGRES_AUTH_PASSWORD=${POSTGRES_AUTH_PASSWORD:-simorgh_secure_2024}
      # LLM (used directly + via gateway)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://nginx/api/llm}
      - DEFAULT_LLM_MODE=${DEFAULT_LLM_MODE:-online}
      - LLM_GATEWAY_URL=http://llm-gateway:8030
      # External services
      - DOC_PROCESSOR_URL=http://doc-processor:8000
      - DOCUMENTS_RAG_URL=http://documents-rag-service:8033
      # 2026-05: code exec via runtime-broker, files via gitlab-mcp.
      - RUNTIME_BROKER_URL=${RUNTIME_BROKER_URL:-http://runtime-broker:8048}
      - BROKER_TOKEN=${BROKER_TOKEN:-}
      - GITLAB_MCP_URL=${GITLAB_MCP_URL:-http://gitlab-mcp:8047}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      - CONTEXT_SEARCH_URL=${CONTEXT_SEARCH_URL:-http://context-search:8049}
      # Microservice MCP URLs (chat may invoke tools)
      - SEARCH_MCP_URL=http://search-service:8020/mcp
      - TPMS_FETCHER_MCP_URL=http://tpms-fetcher:8021/mcp
      - PROJECT_INIT_MCP_URL=http://project-init:8022/mcp
      - PROJECT_ANALYSIS_MCP_URL=http://project-analysis:8023/mcp
      - COMMAND_GEN_MCP_URL=http://command-gen:8024/mcp
      - FILE_EXPORT_MCP_URL=http://file-export:8025/mcp
      - EPLAN_BRIDGE_MCP_URL=http://eplan-bridge:8026/mcp
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      # CORS
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      # HF caches
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/torch/sentence_transformers
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
      - huggingface_cache:/root/.cache/huggingface
      - sentence_transformers_cache:/root/.cache/torch/sentence_transformers
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres_auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8034/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  huggingface_cache:
    name: simorgh_huggingface_cache
    driver: local
  sentence_transformers_cache:
    name: simorgh_sentence_transformers_cache
    driver: local
