# =============================================================================
# PROJECT-MAIL-SERVICE - Sole gateway for the simorghai@electrokavir.com mailbox
# Port 8045. REST. Per the no-direct-external-access policy, NO other service
# may open IMAP/SMTP connections to the corporate mail provider.
#
# Inbound:  IMAP poll → identify session (X-Simorgh-Session header / In-Reply-To
#           / [Simorgh #<id>] subject prefix) → POST to project-agent-service.
# Outbound: project-agent-service → POST /send → SMTP relay → recipient.
#           message_id stored in project_sent_emails so replies route back.
# =============================================================================
services:
  project-mail-service:
    build: ../project-mail-service
    container_name: project-mail-service
    expose:
      - "8045"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # The single canonical project mailbox.
      - PROJECT_MAILBOX=${PROJECT_MAILBOX:-simorghai@electrokavir.com}
      - PROJECT_FROM_NAME=${PROJECT_FROM_NAME:-Simorgh AI}

      # IMAP (inbound)
      - IMAP_HOST=${IMAP_HOST}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-${PROJECT_MAILBOX:-simorghai@electrokavir.com}}
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - IMAP_FOLDER=${IMAP_FOLDER:-INBOX}
      - IMAP_POLL_SEC=${IMAP_POLL_SEC:-30}
      - IMAP_USE_TLS=${IMAP_USE_TLS:-true}

      # SMTP (outbound)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-${PROJECT_MAILBOX:-simorghai@electrokavir.com}}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_STARTTLS=${SMTP_USE_STARTTLS:-true}

      # Where to forward routed inbound mail
      - PROJECT_AGENT_URL=http://project-agent-service:8035
      - PROJECT_AGENT_PATH=/api/v2/agent/projects/{project_id}/message

      # Postgres (thread index)
      - POSTGRES_AUTH_HOST=${POSTGRES_AUTH_HOST:-postgres_auth}
      - POSTGRES_AUTH_PORT=${POSTGRES_AUTH_PORT:-5432}
      - POSTGRES_AUTH_DATABASE=${POSTGRES_AUTH_DATABASE:-simorgh_auth}
      - POSTGRES_AUTH_USER=${POSTGRES_AUTH_USER:-simorgh}
      - POSTGRES_AUTH_PASSWORD=${POSTGRES_AUTH_PASSWORD:-simorgh_secure_2024}

      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    depends_on:
      postgres_auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8045/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
