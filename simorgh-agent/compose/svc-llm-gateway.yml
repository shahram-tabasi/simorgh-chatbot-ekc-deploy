# =============================================================================
# LLM-GATEWAY - Hybrid OpenAI + local LLM (.61/.62) router
# Port 8030. REST. Extracted from backend/services/llm_service.py in Phase 2.
# Local LLM endpoint is the load-balanced nginx (LOCAL_LLM_URL) which fronts
# the GPU servers on 192.168.1.61 and 192.168.1.62 (see llms/docker-compose.yml).
# =============================================================================
services:
  llm-gateway:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/simorgh-llm-gateway:${IMAGE_TAG:-latest}
    build: ../llm-gateway
    pull_policy: build
    container_name: llm-gateway
    expose:
      - "8030"
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://nginx/api/llm}
      - DEFAULT_LLM_MODE=${DEFAULT_LLM_MODE:-online}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8030/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge
