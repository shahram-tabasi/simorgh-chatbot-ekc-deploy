# =============================================================================
# MAIL-GATEWAY - Project email gateway (REST + SMTP receiver)
# Port 8027 (REST), 2525 (SMTP). Inbound emails → backend webhook.
# =============================================================================
services:
  mail-gateway:
    build: ../mail-gateway-service
    image: simorgh-mail-gateway:local
    container_name: mail-gateway
    expose:
      - "8027"
    ports:
      - "2525:2525"
    volumes:
      - mail_storage:/app/mail-storage
    networks:
      - app_net
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:8890
      - BACKEND_WEBHOOK_PATH=/api/v2/agent/email-webhook
      - PROJECT_EMAIL_DOMAIN=${PROJECT_EMAIL_DOMAIN:-simorghai.electrokavir.com}
      - SMTP_LISTEN_PORT=2525
      - MAIL_GATEWAY_TOKEN=${MAIL_GATEWAY_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8027/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  app_net:
    name: simorgh_app_net
    driver: bridge

volumes:
  mail_storage:
    name: simorgh_mail_storage
    driver: local
