server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route under /chatbot/ serves /chatbot/index.html
    location /chatbot/ {
        try_files $uri $uri/ /chatbot/index.html;
    }

    # Root redirect to /chatbot/
    location = / {
        return 301 /chatbot/;
    }
}
