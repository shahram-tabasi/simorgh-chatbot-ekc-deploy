# =======================================================================
# NGINX Configuration for Simorgh AI Chatbot
# - HTTP-only (TLS terminated at host nginx)
# - External access: simorghai.electrokavir.com → modern login
# - Local access: 192.168.1.68 → legacy login
# =======================================================================

# =======================================================================
# UPSTREAM DEFINITIONS
# =======================================================================

upstream llm_servers {
    # TEXT LLM cluster — gpt-oss-20b served via vllm/vllm-openai on .61.
    # NOTE: 192.168.1.62 is now the VLM box (qwen2.5-vl-7b), NOT a second
    # text node. Routing image-bearing requests via this upstream would
    # hit the wrong model — use `vlm_servers` (below) or the llm-gateway
    # (which auto-routes between the two) for multimodal traffic.
    ip_hash;
    server 192.168.1.61:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream vlm_servers {
    # Vision-Language Model on .62 (Qwen2.5-VL-7B-Instruct-AWQ via vllm).
    # OpenAI-compatible — POST /v1/chat/completions with messages whose
    # content is a list of {type:text} + {type:image_url} parts.
    server 192.168.1.62:80 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

upstream backend {
    server backend:8890;
    keepalive 32;
}

upstream stt_service {
    server stt-service:8001;
    keepalive 8;
}

upstream tts_service {
    server tts-service:8002;
    keepalive 8;
}

upstream simorgh_soft {
    server simorgh-soft:80;
    keepalive 8;
}

# Extracted from backend monolith (Phases 2-9). Each is a standalone
# microservice. Comment out the matching `include:` line in
# docker-compose.yml to disable a service; requests then fall through
# to the legacy `backend` upstream via the catch-all /api/ block.
upstream llm_gateway              { server llm-gateway:8030;              keepalive 16; }
upstream embeddings_service       { server embeddings-service:8031;       keepalive 8;  }
upstream auth_service             { server auth-service:8032;             keepalive 16; }
upstream documents_rag_service    { server documents-rag-service:8033;    keepalive 16; }
upstream chat_service             { server chat-service:8034;             keepalive 32; }
upstream project_agent_service    { server project-agent-service:8035;    keepalive 16; }
upstream specification_agent_svc  { server specification-agent-service:8036; keepalive 8; }
upstream graph_rag_service        { server graph-rag-service:8037;        keepalive 8;  }
upstream payments_service         { server payments-service:8038;         keepalive 8;  }
upstream admin_service            { server admin-service:8039;            keepalive 8;  }
upstream tier_quota_service       { server tier-quota-service:8040;       keepalive 8;  }
upstream gitlab_mcp_service       { server gitlab-mcp:8047;               keepalive 8;  }
upstream runtime_broker_service   { server runtime-broker:8048;           keepalive 8;  }
upstream project_init_service     { server project-init:8022;             keepalive 8;  }

# =======================================================================
# RATE LIMITING ZONES
# =======================================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

# =======================================================================
# MAP - Detect Local vs External Access (determines login mode)
# =======================================================================
map $host $login_mode {
    default                              "modern";
    "simorghai.electrokavir.com"         "modern";
    "192.168.1.68"                       "legacy";
    "~^192\.168\."                       "legacy";
    "~^10\."                             "legacy";
    "~^172\.(1[6-9]|2[0-9]|3[0-1])\."    "legacy";
    "localhost"                          "legacy";
    "127.0.0.1"                          "legacy";
}

# =======================================================================
# HTTP SERVER - Main Application (TLS terminated at host nginx)
# =======================================================================
server {
    listen 80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    include /etc/nginx/includes/locations.inc;
}
