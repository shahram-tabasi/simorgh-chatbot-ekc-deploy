# =======================================================================
# NGINX Configuration for Simorgh AI Chatbot
# - HTTPS enabled with self-signed certificates (Docker internal network)
# - External access: simorghai.electrokavir.com → modern login
# - Local access: 192.168.1.68 → legacy login
# =======================================================================

# =======================================================================
# UPSTREAM DEFINITIONS
# =======================================================================

upstream llm_servers {
    ip_hash;
    server 192.168.1.61:80 max_fails=3 fail_timeout=30s;
    server 192.168.1.62:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

upstream backend {
    server backend:8890;
    keepalive 32;
}

upstream stt_service {
    server stt-service:8001;
    keepalive 8;
}

# =======================================================================
# RATE LIMITING ZONES
# =======================================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

# =======================================================================
# MAP - Detect Local vs External Access (determines login mode)
# =======================================================================
map $host $login_mode {
    default                              "modern";
    "simorghai.electrokavir.com"         "modern";
    "192.168.1.68"                       "legacy";
    "~^192\.168\."                       "legacy";
    "~^10\."                             "legacy";
    "~^172\.(1[6-9]|2[0-9]|3[0-1])\."    "legacy";
    "localhost"                          "legacy";
    "127.0.0.1"                          "legacy";
}

# =======================================================================
# HTTP SERVER - Redirect to HTTPS
# =======================================================================
server {
    listen 80 default_server;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# =======================================================================
# HTTPS SERVER - Main Application (Self-Signed Certificate)
# =======================================================================
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Self-signed SSL certificates
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/includes/locations.inc;
}
