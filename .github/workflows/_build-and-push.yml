name: _build-and-push (reusable)

# Reusable workflow: build ONE image and push it to GHCR.
# Called by the per-image wrapper workflows in image-*.yml.
#
# After it runs, the image is downloadable on .68 via:
#   docker pull 192.168.1.64:5003/<owner>/simorgh-<service>:<tag>
# (Nexus ghcr-proxy in front) or directly:
#   docker pull ghcr.io/<owner>/simorgh-<service>:<tag>

on:
  workflow_call:
    inputs:
      service:
        description: "Service short name (becomes image: simorgh-<service>)"
        type: string
        required: true
      context:
        description: "Docker build context"
        type: string
        required: true
      dockerfile:
        description: "Dockerfile path"
        type: string
        required: true
      big:
        description: "Heavy image — free up extra runner disk before build"
        type: boolean
        default: false
      ref:
        description: "Git ref to build"
        type: string
        required: true
      tag:
        description: "Image tag"
        type: string
        default: "local"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Lowercase owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Free runner disk (heavy)
        if: ${{ inputs.big }}
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Free runner disk (light)
        if: ${{ !inputs.big }}
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/simorgh-${{ inputs.service }}:${{ inputs.tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to:   type=gha,scope=${{ inputs.service }},mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Print pull commands
        run: |
          OWNER_LC="${{ steps.owner.outputs.lc }}"
          cat <<EOF
          ============================================================
          Pushed: ghcr.io/${OWNER_LC}/simorgh-${{ inputs.service }}:${{ inputs.tag }}

          Pull on .68 (via Nexus ghcr-proxy on 192.168.1.64:5003):
            docker pull 192.168.1.64:5003/${OWNER_LC}/simorgh-${{ inputs.service }}:${{ inputs.tag }}
            docker tag  192.168.1.64:5003/${OWNER_LC}/simorgh-${{ inputs.service }}:${{ inputs.tag }} \\
                        simorgh-${{ inputs.service }}:${{ inputs.tag }}

          Or pull directly through Squid:
            docker pull ghcr.io/${OWNER_LC}/simorgh-${{ inputs.service }}:${{ inputs.tag }}

          One-time: flip the package to PUBLIC at
            https://github.com/users/${OWNER_LC}/packages/container/simorgh-${{ inputs.service }}/settings
          ============================================================
          EOF
