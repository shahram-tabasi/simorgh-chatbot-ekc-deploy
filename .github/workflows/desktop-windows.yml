# Builds the Windows installer for the Simorgh Design Suite desktop client.
# electron-builder needs a Windows runner for an NSIS installer, so this is the
# supported way to produce the .exe — run it from the Actions tab, or let it run
# on a tag, and download the installer from the run's artifacts.
name: Desktop installer (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: simorgh-agent/simorgh-soft/desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build the installer
        run: npm run dist:win

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: SimorghDesignSuite-Windows-Setup
          path: simorgh-agent/simorgh-soft/desktop/release/*.exe
          if-no-files-found: error
