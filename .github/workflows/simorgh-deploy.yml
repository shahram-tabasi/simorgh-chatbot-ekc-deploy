name: Build Simorgh Industrial Assistant Images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'simorgh-agent/**'
      - '.github/workflows/simorgh-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-simorgh-agent:
    name: Build Simorgh Agent Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        service:
          - name: backend
            context: ./simorgh-agent/backend
            dockerfile: ./simorgh-agent/backend/Dockerfile
          - name: frontend
            context: ./simorgh-agent/frontend
            dockerfile: ./simorgh-agent/frontend/Dockerfile
          - name: stt-service
            context: ./simorgh-agent/stt-service
            dockerfile: ./simorgh-agent/stt-service/Dockerfile
          - name: tts-service
            context: ./simorgh-agent/tts-service
            dockerfile: ./simorgh-agent/tts-service/Dockerfile
          - name: doc-processor
            context: ./simorgh-agent/doc-processor
            dockerfile: ./simorgh-agent/doc-processor/Dockerfile
          - name: shell-service
            context: ./simorgh-agent/shell-service
            dockerfile: ./simorgh-agent/shell-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Lowercase repository owner
        id: lowercase
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "Lowercase owner: $OWNER_LC"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/simorgh-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Simorgh Industrial Electrical Assistant - ${{ matrix.service.name }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=${{ matrix.service.name }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER_LC }}/simorgh-${{ matrix.service.name }}:cache
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.service.name }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER_LC }}/simorgh-${{ matrix.service.name }}:cache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
