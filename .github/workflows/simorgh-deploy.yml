name: Build & push Simorgh images to GHCR

# Builds every simorgh-agent custom image on GitHub-hosted runners and
# pushes each to `ghcr.io/<owner>/simorgh-<name>:<tag>`. The .68 host
# (which has internet egress via Squid) then pulls them with a normal
# `docker pull`.
#
# Why GHCR instead of artifacts: this repo is private on the Free plan,
# where Actions-artifacts + Releases share a tiny storage quota that the
# 40+ GB image set blows past instantly. GHCR container packages, when
# made PUBLIC, have no storage cap. The source repo stays private; only
# the compiled image layers are visible.
#
# First-time setup (one time, after the first successful run):
#   1. Open https://github.com/users/<owner>/packages?repo_name=simorgh-chatbot-ekc-deploy
#   2. For each newly created `simorgh-*` package:
#        Package settings → Danger Zone → "Change visibility" → Public
#      OR via API (requires a PAT with `write:packages,delete:packages`):
#        gh api -X PATCH "user/packages/container/simorgh-backend/visibility" -f visibility=public
#
# On .68 (operator must have internet via Squid):
#   docker login ghcr.io -u <github-username> -p <PAT-with-read:packages>
#   cd ~/simorgh-chatbot-ekc-deploy/simorgh-agent
#   IMAGE_REGISTRY=ghcr.io/<owner> docker compose pull
#   docker compose up -d

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch / tag / sha)"
        type: string
        default: "claude/review-codebase-p4gQf"
      services:
        description: "Comma-separated subset to build (blank = build everything)"
        type: string
        default: ""
      tag:
        description: "Image tag to apply"
        type: string
        default: "local"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Owner must be lowercase for GHCR. ${{ github.repository_owner }} is
  # already correct case for this account.
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: build · ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180          # backend + ML services pull torch + cuDNN through pip

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service:
          # ---- Original services -----------------------------------------
          - { name: backend,                      context: ./simorgh-agent/backend,    dockerfile: ./simorgh-agent/backend/Dockerfile,                       big: true  }
          - { name: frontend,                     context: ./simorgh-agent/frontend,   dockerfile: ./simorgh-agent/frontend/Dockerfile,                      big: false }
          - { name: stt-service,                  context: ./simorgh-agent/stt-service, dockerfile: ./simorgh-agent/stt-service/Dockerfile,                  big: true  }
          - { name: tts-service,                  context: ./simorgh-agent/tts-service, dockerfile: ./simorgh-agent/tts-service/Dockerfile,                  big: true  }
          - { name: doc-processor,                context: ./simorgh-agent/doc-processor, dockerfile: ./simorgh-agent/doc-processor/Dockerfile,              big: true  }

          # ---- 2026-05 enterprise migration (build with parent context for shared/) ----
          - { name: gitlab-mcp,                   context: ./simorgh-agent, dockerfile: ./simorgh-agent/gitlab-mcp-service/Dockerfile,                      big: false }
          - { name: runtime-broker,               context: ./simorgh-agent, dockerfile: ./simorgh-agent/runtime-broker/Dockerfile,                          big: false }
          - { name: context-search,               context: ./simorgh-agent, dockerfile: ./simorgh-agent/context-search-service/Dockerfile,                  big: false }
          - { name: tpms-context-agent,           context: ./simorgh-agent, dockerfile: ./simorgh-agent/tpms-context-agent/Dockerfile,                      big: false }
          - { name: mail-bridge,                  context: ./simorgh-agent, dockerfile: ./simorgh-agent/mail-bridge/Dockerfile,                             big: false }
          - { name: project-init,                 context: ./simorgh-agent, dockerfile: ./simorgh-agent/project-init-service/Dockerfile,                    big: false }

          # ---- Phases 2-9: extracted from backend monolith ----------------
          - { name: llm-gateway,                  context: ./simorgh-agent/llm-gateway,                  dockerfile: ./simorgh-agent/llm-gateway/Dockerfile,                  big: false }
          - { name: embeddings-service,           context: ./simorgh-agent/embeddings-service,           dockerfile: ./simorgh-agent/embeddings-service/Dockerfile,           big: true  }
          - { name: auth-service,                 context: ./simorgh-agent/auth-service,                 dockerfile: ./simorgh-agent/auth-service/Dockerfile,                 big: false }
          - { name: documents-rag-service,        context: ./simorgh-agent/documents-rag-service,        dockerfile: ./simorgh-agent/documents-rag-service/Dockerfile,        big: false }
          - { name: chat-service,                 context: ./simorgh-agent/chat-service,                 dockerfile: ./simorgh-agent/chat-service/Dockerfile,                 big: false }
          - { name: project-agent-service,        context: ./simorgh-agent/project-agent-service,        dockerfile: ./simorgh-agent/project-agent-service/Dockerfile,        big: false }
          - { name: specification-agent-service,  context: ./simorgh-agent/specification-agent-service,  dockerfile: ./simorgh-agent/specification-agent-service/Dockerfile,  big: false }
          - { name: graph-rag-service,            context: ./simorgh-agent/graph-rag-service,            dockerfile: ./simorgh-agent/graph-rag-service/Dockerfile,            big: false }
          - { name: payments-service,             context: ./simorgh-agent/payments-service,             dockerfile: ./simorgh-agent/payments-service/Dockerfile,             big: false }
          - { name: admin-service,                context: ./simorgh-agent/admin-service,                dockerfile: ./simorgh-agent/admin-service/Dockerfile,                big: false }
          - { name: tier-quota-service,           context: ./simorgh-agent/tier-quota-service,           dockerfile: ./simorgh-agent/tier-quota-service/Dockerfile,           big: false }

          # ---- Microservices ---------------------------------------------
          - { name: search-service,               context: ./simorgh-agent/search-service,               dockerfile: ./simorgh-agent/search-service/Dockerfile,               big: false }
          - { name: tpms-fetcher,                 context: ./simorgh-agent/tpms-fetcher-service,         dockerfile: ./simorgh-agent/tpms-fetcher-service/Dockerfile,         big: false }
          - { name: project-analysis,             context: ./simorgh-agent/project-analysis-service,     dockerfile: ./simorgh-agent/project-analysis-service/Dockerfile,     big: false }
          - { name: command-gen,                  context: ./simorgh-agent/command-gen-service,          dockerfile: ./simorgh-agent/command-gen-service/Dockerfile,          big: false }
          - { name: file-export,                  context: ./simorgh-agent/file-export-service,          dockerfile: ./simorgh-agent/file-export-service/Dockerfile,          big: false }
          - { name: eplan-bridge,                 context: ./simorgh-agent/eplan-bridge-service,         dockerfile: ./simorgh-agent/eplan-bridge-service/Dockerfile,         big: false }

          # ---- General-chat feature services -----------------------------
          - { name: hr-kb-service,                context: ./simorgh-agent/hr-kb-service,                dockerfile: ./simorgh-agent/hr-kb-service/Dockerfile,                big: false }
          - { name: org-data-service,             context: ./simorgh-agent/org-data-service,             dockerfile: ./simorgh-agent/org-data-service/Dockerfile,             big: false }
          - { name: eplan-sql-service,            context: ./simorgh-agent/eplan-sql-service,            dockerfile: ./simorgh-agent/eplan-sql-service/Dockerfile,            big: false }

          # ---- Standalone CAD app ---------------------------------------
          - { name: simorgh-soft,                 context: ./simorgh-agent/simorgh-soft,                 dockerfile: ./simorgh-agent/simorgh-soft/Dockerfile,                 big: false }

    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Skip if not in selected list
        id: filter
        run: |
          set -eu
          requested='${{ inputs.services }}'
          if [ -z "$requested" ]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for s in $(echo "$requested" | tr ',' ' '); do
            if [ "$s" = "${{ matrix.service.name }}" ]; then
              echo "selected=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "selected=false" >> "$GITHUB_OUTPUT"

      - name: Lowercase owner (GHCR requires lowercase)
        if: ${{ steps.filter.outputs.selected == 'true' }}
        id: owner
        run: |
          echo "lc=$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Free up runner disk (heavy)
        if: ${{ matrix.service.big && steps.filter.outputs.selected == 'true' }}
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Free up runner disk (light)
        if: ${{ !matrix.service.big && steps.filter.outputs.selected == 'true' }}
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Docker Buildx
        if: ${{ steps.filter.outputs.selected == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ steps.filter.outputs.selected == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        if: ${{ steps.filter.outputs.selected == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/simorgh-${{ matrix.service.name }}:${{ inputs.tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,scope=${{ matrix.service.name }},mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Print pull command
        if: ${{ steps.filter.outputs.selected == 'true' }}
        run: |
          echo "Pushed: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/simorgh-${{ matrix.service.name }}:${{ inputs.tag }}"

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Final instructions
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat <<EOF
          ============================================================
          Images pushed to GHCR
          ============================================================
          Registry: ghcr.io/${OWNER_LC}
          Tag:      ${{ inputs.tag }}

          ONE-TIME setup before .68 can pull
          ------------------------------------------------------------
          1. Make each new package PUBLIC (no storage quota that way):
               https://github.com/users/${OWNER_LC}/packages?repo_name=simorgh-chatbot-ekc-deploy
             Click each package → Package settings → Change visibility → Public.

          2. On .68, log in to GHCR once:
               # create a PAT at https://github.com/settings/tokens
               # scope: read:packages   (only — no write needed for .68)
               echo \$PAT | docker login ghcr.io -u <github-username> --password-stdin

          On .68 — pull and run
          ------------------------------------------------------------
          docker pull ghcr.io/${OWNER_LC}/simorgh-backend:${{ inputs.tag }}
          docker pull ghcr.io/${OWNER_LC}/simorgh-frontend:${{ inputs.tag }}
          # …etc. for each service you need

          Or pull everything at once:
            for s in backend frontend stt-service tts-service doc-processor \\
                     gitlab-mcp runtime-broker context-search tpms-context-agent \\
                     mail-bridge project-init llm-gateway embeddings-service \\
                     auth-service documents-rag-service chat-service \\
                     project-agent-service specification-agent-service \\
                     graph-rag-service payments-service admin-service \\
                     tier-quota-service search-service tpms-fetcher \\
                     project-analysis command-gen file-export eplan-bridge \\
                     hr-kb-service org-data-service eplan-sql-service \\
                     simorgh-soft; do
              docker pull ghcr.io/${OWNER_LC}/simorgh-\${s}:${{ inputs.tag }}
              # retag to the short name the compose files expect:
              docker tag ghcr.io/${OWNER_LC}/simorgh-\${s}:${{ inputs.tag }} \\
                         simorgh-\${s}:${{ inputs.tag }}
            done

          docker images | grep '^simorgh-'
          cd ~/simorgh-chatbot-ekc-deploy/simorgh-agent
          docker compose up -d
          ============================================================
          EOF
