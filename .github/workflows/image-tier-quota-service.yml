name: Build artifact · tier-quota-service

# Builds simorgh-tier-quota-service on a GitHub-hosted runner and uploads the
# resulting image as a downloadable artifact (no GHCR push).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        default: "claude/review-codebase-p4gQf"
      tag:
        description: "Image tag"
        type: string
        default: "local"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-and-artifact.yml
    with:
      service:    "tier-quota-service"
      context:    "./simorgh-agent/tier-quota-service"
      dockerfile: "./simorgh-agent/tier-quota-service/Dockerfile"
      big:        false
      ref:        ${{ inputs.ref }}
      tag:        ${{ inputs.tag }}
