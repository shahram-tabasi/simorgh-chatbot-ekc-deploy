name: Build · project-agent-service

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        default: "claude/review-codebase-p4gQf"
      tag:
        description: "Image tag"
        type: string
        default: "local"

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_build-and-push.yml
    with:
      service:    "project-agent-service"
      context:    "./simorgh-agent/project-agent-service"
      dockerfile: "./simorgh-agent/project-agent-service/Dockerfile"
      big:        false
      ref:        ${{ inputs.ref }}
      tag:        ${{ inputs.tag }}
