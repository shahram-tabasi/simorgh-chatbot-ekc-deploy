# .github/workflows/extract-binary.yml
name: Pull Docker Registry and Release Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  extract-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pull registry image
        run: docker pull registry:latest

      - name: Extract registry binary
        run: |
          CONTAINER_ID=$(docker create registry:latest)
          docker cp "$CONTAINER_ID:/bin/registry" ./registry
          docker rm "$CONTAINER_ID"
          chmod +x ./registry

      - name: Get tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Create Release with binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Docker Registry Binary ${{ steps.tag.outputs.tag }}"
          body: |
            Registry binary extracted from `registry:latest` (Docker Hub).

            **Usage:**
            ```bash
            chmod +x ./registry
            ./registry --version
            ```
          files: registry
