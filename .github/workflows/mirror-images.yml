# =============================================================================
# Mirror Third-Party Docker Images to GHCR
#
# This workflow pulls images from Docker Hub and pushes them to GHCR.
# This allows deployment servers to only connect to GHCR instead of Docker Hub.
#
# CACHING STRATEGY:
# - Compares image digests between Docker Hub and GHCR
# - Skips push if image already exists with same digest
# - Use force_update=true to bypass cache and force re-push
#
# Run manually or on schedule to keep images updated.
# =============================================================================

name: Mirror Docker Images to GHCR

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update all images (ignore cache)'
        required: false
        default: 'false'
        type: boolean

  # Weekly schedule to keep images updated (Sunday at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 0'

  # Also run when this workflow file changes
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mirror-images.yml'

env:
  REGISTRY: ghcr.io

jobs:
  mirror-images:
    name: Mirror Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          # Neo4j - Knowledge Graph Database
          - source: neo4j:5.15.0-community
            target: neo4j
            tag: 5.15.0-community

          # Redis - Caching & Session Store
          - source: redis:7.2-alpine
            target: redis
            tag: 7.2-alpine

          # Qdrant - Vector Database
          - source: qdrant/qdrant:latest
            target: qdrant
            tag: latest

          # PostgreSQL - For CocoIndex and Auth
          - source: postgres:16-alpine
            target: postgres
            tag: 16-alpine

          # pgvector - PostgreSQL with vector extension
          - source: pgvector/pgvector:pg17
            target: pgvector
            tag: pg17

          # Nginx - Reverse Proxy
          - source: nginx:alpine
            target: nginx
            tag: alpine

          # Python - For CocoIndex build
          - source: python:3.11-bookworm
            target: python
            tag: 3.11-bookworm

    steps:
      - name: Lowercase repository owner
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # =======================================================================
      # CACHING: Check if image needs update by comparing digests
      # =======================================================================
      - name: Check if update needed
        id: check_cache
        run: |
          TARGET="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-${{ matrix.image.target }}:${{ matrix.image.tag }}"
          SOURCE="${{ matrix.image.source }}"
          FORCE="${{ inputs.force_update }}"

          echo "Checking cache for ${{ matrix.image.target }}..."

          # If force update, skip cache check
          if [ "$FORCE" = "true" ]; then
            echo "Force update requested, skipping cache check"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get source digest from Docker Hub (without pulling full image)
          echo "Fetching source digest from Docker Hub..."
          SOURCE_DIGEST=$(docker manifest inspect "$SOURCE" 2>/dev/null | jq -r '.config.digest // .manifests[0].digest // empty' || echo "")

          if [ -z "$SOURCE_DIGEST" ]; then
            echo "Could not get source digest, will pull and push"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Source digest: $SOURCE_DIGEST"

          # Get target digest from GHCR
          echo "Fetching target digest from GHCR..."
          TARGET_DIGEST=$(docker manifest inspect "$TARGET" 2>/dev/null | jq -r '.config.digest // .manifests[0].digest // empty' || echo "")

          if [ -z "$TARGET_DIGEST" ]; then
            echo "Target image not found in GHCR, will push"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Target digest: $TARGET_DIGEST"

          # Compare digests
          if [ "$SOURCE_DIGEST" = "$TARGET_DIGEST" ]; then
            echo "✅ Image ${{ matrix.image.target }} is up-to-date (same digest)"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "Image ${{ matrix.image.target }} has new version, will update"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull image from Docker Hub
        if: steps.check_cache.outputs.needs_update == 'true'
        run: |
          echo "Pulling ${{ matrix.image.source }} from Docker Hub..."
          docker pull ${{ matrix.image.source }}

      - name: Tag image for GHCR
        if: steps.check_cache.outputs.needs_update == 'true'
        run: |
          SOURCE="${{ matrix.image.source }}"
          TARGET="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-${{ matrix.image.target }}:${{ matrix.image.tag }}"

          echo "Tagging $SOURCE as $TARGET"
          docker tag "$SOURCE" "$TARGET"

          # Also tag as latest for convenience
          LATEST="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-${{ matrix.image.target }}:latest"
          docker tag "$SOURCE" "$LATEST"

      - name: Push to GHCR
        if: steps.check_cache.outputs.needs_update == 'true'
        run: |
          TARGET="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-${{ matrix.image.target }}:${{ matrix.image.tag }}"
          LATEST="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-${{ matrix.image.target }}:latest"

          echo "Pushing $TARGET to GHCR..."
          docker push "$TARGET"

          echo "Pushing $LATEST to GHCR..."
          docker push "$LATEST"

      - name: Skip message
        if: steps.check_cache.outputs.needs_update == 'false'
        run: |
          echo "⏭️ Skipped ${{ matrix.image.target }} - already up-to-date in GHCR"

      - name: Verify image in GHCR
        if: steps.check_cache.outputs.needs_update == 'true'
        run: |
          TARGET="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-${{ matrix.image.target }}:${{ matrix.image.tag }}"

          echo "Verifying $TARGET exists in GHCR..."
          docker pull "$TARGET"
          echo "✅ Image verified: $TARGET"

  summary:
    name: Mirror Summary
    runs-on: ubuntu-latest
    needs: mirror-images
    if: always()

    steps:
      - name: Lowercase repository owner
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV

      - name: Print Summary
        run: |
          echo "=============================================="
          echo "Docker Image Mirror Summary"
          echo "=============================================="
          echo ""
          echo "The following images are available in GHCR:"
          echo ""
          echo "  ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-neo4j:5.15.0-community"
          echo "  ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-redis:7.2-alpine"
          echo "  ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-qdrant:latest"
          echo "  ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-postgres:16-alpine"
          echo "  ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-pgvector:pg17"
          echo "  ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-nginx:alpine"
          echo "  ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/mirror-python:3.11-bookworm"
          echo ""
          echo "Images are only updated when source digest changes."
          echo "Use force_update=true to bypass cache."
          echo "=============================================="
