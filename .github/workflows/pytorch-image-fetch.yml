name: Download pytorch base image (torch 2.6 fixes bge-m3 CVE gate)

# Pulls a pytorch/pytorch CUDA runtime image on a GitHub-hosted runner,
# `docker save | gzip`s it, splits into N parts, and uploads each part
# as an artifact. Same shape as ghcr-image-fetch.yml / hf-model-fetch.yml /
# docling-models-fetch.yml, tuned for the pytorch image's size.
#
# Why a dedicated workflow?
#   - The image is ~9 GB compressed — needs runner-disk cleanup BEFORE pull.
#   - The 2.6.0-cuda12.4-cudnn9-runtime tag specifically fixes the
#     bge-m3 / transformers>=4.46 load failure (torch.load CVE gate in
#     torch<2.6). Several simorgh services (project-agent-service,
#     context-search-service, doc-processor, embeddings-service,
#     backend) use this image as their FROM base. Loading the right
#     tag on .68 lets every subsequent `docker compose build` reuse
#     the same layer with no further pulls.
#
# After the workflow finishes:
#   ./REASSEMBLE.sh                           # cat parts → tarball → verify
#   docker load -i pytorch__pytorch__2.6.0-cuda12.4-cudnn9-runtime.tar.gz
#   # Update simorgh service Dockerfiles' FROM lines to 2.6.0-... and
#   # docker compose build the services that use it (see install notes).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "pytorch/pytorch tag to pull"
        type: choice
        default: "2.6.0-cuda12.4-cudnn9-runtime"
        options:
          - "2.6.0-cuda12.4-cudnn9-runtime"
          - "2.7.0-cuda12.4-cudnn9-runtime"
          - "2.7.0-cuda12.6-cudnn9-runtime"
          - "2.6.0-cuda12.6-cudnn9-runtime"
          - "2.5.0-cuda12.4-cudnn9-runtime"
      parts:
        description: "Split tarball into N parts (1=single, 3=default for 5GB/day cap)"
        type: choice
        default: "3"
        options: ["1", "2", "3", "4", "5"]
      compress_level:
        description: "gzip compression — 1=fastest+biggest, 6=balanced, 9=smallest+slowest"
        type: choice
        default: "1"
        options: ["1", "3", "6", "9"]

permissions:
  contents: read

env:
  REGISTRY: "docker.io"
  REPO:     "pytorch/pytorch"

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free up runner disk
        # Free runners ship with ~14 GB on /, but ~6 GB of that is the
        # preinstalled toolchain (Android SDK, dotnet, CodeQL, etc.).
        # The pytorch image is ~9 GB compressed and decompresses to
        # ~12 GB on the docker daemon; without this cleanup the pull
        # OOMs on disk halfway through.
        run: |
          set -eu
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/chromium \
            /usr/local/share/powershell /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          sudo apt-get clean
          echo "After:"; df -h /

      - name: Compute filename-safe tag
        id: name
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # docker.io/pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
          #   → pytorch__pytorch__2.6.0-cuda12.4-cudnn9-runtime
          IMAGE="${REGISTRY}/${REPO}:${TAG}"
          SAFE="$(echo -n "${REPO}__${TAG}" | tr ':/' '__')"
          echo "image=$IMAGE"      >> "$GITHUB_OUTPUT"
          echo "fname=$SAFE"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"

      - name: Pull image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -eu
          echo "Pulling $IMAGE …"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" \
            --format='{{.Id}} · size {{.Size}} bytes · created {{.Created}}'
          # Sanity — runner must still have headroom for `docker save`
          df -h / | tail -1

      - name: Save + gzip image
        id: pack
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          FNAME: ${{ steps.name.outputs.fname }}
          ZLEVEL: ${{ inputs.compress_level }}
        run: |
          set -eu
          OUT="${FNAME}.tar.gz"
          echo "Saving $IMAGE → $OUT (gzip -$ZLEVEL) …"
          # `docker save` → gzip pipeline never materialises the
          # uncompressed tarball — saves ~5-8 GB of peak disk usage.
          docker save "$IMAGE" | gzip "-${ZLEVEL}" > "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          # Now we can drop the docker copy of the image to free disk
          # for the artifact-upload tmp space.
          docker rmi "$IMAGE" >/dev/null 2>&1 || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
          echo "out=$OUT"      >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Split tarball into N parts
        id: split
        env:
          OUT:   ${{ steps.pack.outputs.out }}
          PARTS: ${{ inputs.parts }}
        run: |
          set -eu
          mkdir -p parts
          if [ "$PARTS" -le 1 ]; then
            mv "$OUT" parts/
            mv "$OUT.sha256" parts/
            echo "split=false" >> "$GITHUB_OUTPUT"
            ls -lh parts/
            exit 0
          fi
          split -n "$PARTS" -d --suffix-length=2 "$OUT" "parts/${OUT}.part."
          mv "$OUT.sha256" parts/
          rm -f "$OUT"
          cat > "parts/REASSEMBLE.sh" <<BASH
          #!/usr/bin/env bash
          set -e
          base="${OUT}"
          parts=( \$(ls "\${base}".part.* | sort) )
          echo "Reassembling \${#parts[@]} parts → \${base} …"
          cat "\${parts[@]}" > "\${base}"
          echo "Verifying SHA-256 …"
          sha256sum -c "\${base}.sha256"
          echo "Loading image into docker (this is ~9 GB and may take a minute) …"
          docker load -i "\${base}"
          echo
          echo "✅ Image ready. List with:"
          echo "    docker images | grep pytorch"
          BASH
          chmod +x parts/REASSEMBLE.sh
          ls -lh parts/
          echo "split=true" >> "$GITHUB_OUTPUT"

      # ── Single-piece upload ──────────────────────────────────────────
      - name: Upload artifact (single piece)
        if: steps.split.outputs.split == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}
          path: |
            parts/${{ steps.name.outputs.fname }}.tar.gz
            parts/${{ steps.name.outputs.fname }}.tar.gz.sha256
          retention-days: 14
          compression-level: 0     # already gzip'd; don't double-compress

      # ── Split upload: one artifact per part, downloadable independently.
      - name: Upload part 1 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-1of${{ inputs.parts }}
          path: |
            parts/${{ steps.name.outputs.fname }}.tar.gz.part.00
            parts/${{ steps.name.outputs.fname }}.tar.gz.sha256
            parts/REASSEMBLE.sh
          retention-days: 14
          compression-level: 0

      - name: Upload part 2 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '2'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-2of${{ inputs.parts }}
          path: parts/${{ steps.name.outputs.fname }}.tar.gz.part.01
          retention-days: 14
          compression-level: 0

      - name: Upload part 3 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '3'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-3of${{ inputs.parts }}
          path: parts/${{ steps.name.outputs.fname }}.tar.gz.part.02
          retention-days: 14
          compression-level: 0

      - name: Upload part 4 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '4'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-4of${{ inputs.parts }}
          path: parts/${{ steps.name.outputs.fname }}.tar.gz.part.03
          retention-days: 14
          compression-level: 0

      - name: Upload part 5 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '5'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-5of${{ inputs.parts }}
          path: parts/${{ steps.name.outputs.fname }}.tar.gz.part.04
          retention-days: 14
          compression-level: 0

      - name: Install instructions
        env:
          PARTS:    ${{ inputs.parts }}
          SPLIT:    ${{ steps.split.outputs.split }}
          FNAME:    ${{ steps.name.outputs.fname }}
          IMAGE:    ${{ steps.name.outputs.image }}
          TAG:      ${{ steps.name.outputs.tag }}
        run: |
          if [ "$SPLIT" != "true" ]; then
            cat <<EOF
          ============================================================
          Artifact: ${FNAME}   (single piece)
          Image:    ${IMAGE}
          ============================================================

          # 1. On any machine with gh CLI + internet:
          gh run download \$RUN_ID \\
              -R shahram-tabasi/simorgh-chatbot-ekc-deploy \\
              -n ${FNAME}
          sha256sum -c ${FNAME}.tar.gz.sha256

          # 2. Transfer to .68:
          scp ${FNAME}.tar.gz ubuntu@192.168.1.68:/tmp/

          # 3. Load on .68 (one-liner):
          ssh ubuntu@192.168.1.68 'docker load -i /tmp/${FNAME}.tar.gz'

          # 4. Verify the load:
          ssh ubuntu@192.168.1.68 'docker images | grep pytorch'
          # Expect:  pytorch/pytorch   ${TAG}   ...

          # 5. Update simorgh Dockerfiles to point at the new tag, then
          #    rebuild the services that use it as base:
          cd ~/simorgh-chatbot-ekc-deploy
          grep -lE 'pytorch/pytorch:[0-9.]+-cuda' simorgh-agent/*/Dockerfile \\
            | xargs sed -i.bak 's|pytorch/pytorch:[0-9.]\+-cuda[0-9.]\+-cudnn[0-9]\+-runtime|pytorch/pytorch:${TAG}|'

          cd simorgh-agent
          docker compose build project-agent-service context-search \\
                                doc-processor embeddings-service backend
          docker compose up -d
          ============================================================
          EOF
            exit 0
          fi

          cat <<EOF
          ============================================================
          Artifact: ${FNAME}   (split into ${PARTS} parts)
          Image:    ${IMAGE}
          ============================================================

          # 1. On a workstation with internet — download each part you
          #    haven't already grabbed (one per day if you're on a cap):
          for i in \$(seq 1 ${PARTS}); do
            gh run download \$RUN_ID \\
                -R shahram-tabasi/simorgh-chatbot-ekc-deploy \\
                -n ${FNAME}-part-\${i}of${PARTS}
          done

          # 2. Reassemble (REASSEMBLE.sh ships inside part 1of${PARTS}):
          chmod +x REASSEMBLE.sh
          ./REASSEMBLE.sh
          # → produces ${FNAME}.tar.gz, verified by sha256

          # 3. Transfer + load on .68:
          scp ${FNAME}.tar.gz ubuntu@192.168.1.68:/tmp/
          ssh ubuntu@192.168.1.68 'docker load -i /tmp/${FNAME}.tar.gz'

          # 4. Update simorgh Dockerfiles + rebuild:
          ssh ubuntu@192.168.1.68 <<'REMOTE'
            cd ~/simorgh-chatbot-ekc-deploy
            grep -lE 'pytorch/pytorch:[0-9.]+-cuda' simorgh-agent/*/Dockerfile \\
              | xargs sed -i.bak 's|pytorch/pytorch:[0-9.]\+-cuda[0-9.]\+-cudnn[0-9]\+-runtime|pytorch/pytorch:${TAG}|'
            cd simorgh-agent
            docker compose build project-agent-service context-search \\
                                  doc-processor embeddings-service backend
            docker compose up -d
          REMOTE
          ============================================================
          EOF
