name: Pack GitHub repo into split artifacts

# Same split-into-N-parts trick we use for HuggingFace models, but the
# source is a GitHub repository. Useful when:
#   • the repo itself is too big to clone over a metered link
#   • you want a specific subdirectory shipped as a tarball
#   • you store model weights / datasets in your own repo (or as LFS)
#     and need to fetch them in chunks
#
# The artifact name pattern matches hf-model-fetch.yml:
#   gh-<owner>__<repo>-<sanitisedRef>-part-<i>of<N>
#
# Reassembly works exactly the same — REASSEMBLE.sh lands inside part 1.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo to fetch (blank = this repo)"
        type: string
        default: ""
      ref:
        description: "Branch / tag / commit (blank = default branch)"
        type: string
        default: ""
      path:
        description: "Path inside the repo to pack (file or directory, default = whole repo)"
        type: string
        default: "."
      include_git:
        description: "Include the .git directory (lets the recipient `git checkout` after extraction)"
        type: boolean
        default: false
      lfs:
        description: "Pull LFS-tracked files during checkout"
        type: boolean
        default: false
      parts:
        description: "Split the tarball into N parts (1 = no split)"
        type: choice
        default: "2"
        options: ["1", "2", "3", "4", "5", "6"]

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve target repo + ref
        id: target
        env:
          RAW_REPO: ${{ inputs.repo }}
          RAW_REF:  ${{ inputs.ref }}
        run: |
          set -eu
          # Default repo = the one this workflow is in.
          REPO="${RAW_REPO:-${GITHUB_REPOSITORY}}"
          # Forgive a leading https://github.com/ if pasted from the URL bar.
          REPO="${REPO#https://github.com/}"
          REPO="${REPO#http://github.com/}"
          REPO="${REPO%.git}"
          if [[ ! "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid repo '$RAW_REPO' (after normalising to '$REPO'). Expected 'owner/repo'."
            exit 1
          fi
          # Ref can be blank — actions/checkout will use the default branch.
          REF="${RAW_REF}"
          # Filename-safe ref for the artifact name.
          REF_SAFE="${REF:-default}"
          REF_SAFE="$(echo -n "$REF_SAFE" | tr '/ :' '___')"
          echo "repo=$REPO"          >> "$GITHUB_OUTPUT"
          echo "ref=$REF"            >> "$GITHUB_OUTPUT"
          echo "ref_safe=$REF_SAFE"  >> "$GITHUB_OUTPUT"
          # safe filename: <owner>__<repo>-<ref>
          base=$(echo "$REPO" | tr '/' '__')
          echo "fname=${base}-${REF_SAFE}" >> "$GITHUB_OUTPUT"
          echo "Repo : $REPO"
          echo "Ref  : ${REF:-(default branch)}"
          echo "Path : ${{ inputs.path }}"
          echo "LFS  : ${{ inputs.lfs }}"

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref:        ${{ steps.target.outputs.ref }}
          path:       src
          lfs:        ${{ inputs.lfs }}
          # Always need full history when include_git=true so the resulting
          # working copy is a real clone; otherwise default shallow is fine
          # and faster.
          fetch-depth: ${{ inputs.include_git == true && '0' || '1' }}

      - name: Pack tarball
        id: pack
        env:
          FNAME: ${{ steps.target.outputs.fname }}
          PATH_IN_REPO: ${{ inputs.path }}
          INCLUDE_GIT: ${{ inputs.include_git }}
        run: |
          set -eu
          OUT="${FNAME}.tar.gz"

          # `tar` runs from inside the checkout. We honour PATH_IN_REPO so a
          # user can request just `models/qwen/` instead of the whole tree.
          cd src
          if [ ! -e "$PATH_IN_REPO" ]; then
            echo "::error::Path '$PATH_IN_REPO' does not exist in the checkout."
            exit 1
          fi

          # By default skip .git unless explicitly requested — it inflates
          # the archive and most consumers won't care.
          EXCLUDES=()
          if [ "$INCLUDE_GIT" != "true" ]; then
            EXCLUDES+=( --exclude='./.git' --exclude='./.github' )
          fi
          tar "${EXCLUDES[@]}" -czf "../$OUT" "$PATH_IN_REPO"
          cd ..

          ls -lh "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Split tarball into N parts
        id: split
        env:
          OUT: ${{ steps.pack.outputs.out }}
          PARTS: ${{ inputs.parts }}
        run: |
          set -eu
          mkdir -p parts
          if [ "$PARTS" -le 1 ]; then
            cp "$OUT" parts/
            cp "$OUT.sha256" parts/
            echo "split=false" >> "$GITHUB_OUTPUT"
            echo "Single-piece mode."
            ls -lh parts/
            exit 0
          fi
          split -n "$PARTS" -d --suffix-length=2 "$OUT" "parts/${OUT}.part."
          cp "$OUT.sha256" "parts/"
          # Self-contained reassembler — same shape as hf-model-fetch.yml.
          cat > "parts/REASSEMBLE.sh" <<BASH
          #!/usr/bin/env bash
          # Concatenate all .part.NN pieces back into the original tarball
          # and verify the SHA-256 against the recorded checksum.
          set -e
          base="${OUT}"
          parts=( \$(ls "\${base}".part.* | sort) )
          echo "Reassembling \${#parts[@]} parts → \${base} …"
          cat "\${parts[@]}" > "\${base}"
          echo "Verifying SHA-256 …"
          sha256sum -c "\${base}.sha256"
          echo "✅ \${base} ready. Extract with: tar xzf \${base}"
          BASH
          chmod +x parts/REASSEMBLE.sh
          ls -lh parts/
          echo "split=true" >> "$GITHUB_OUTPUT"

      # ── Single-piece upload ────────────────────────────────────────────
      - name: Upload artifact (single piece)
        if: steps.split.outputs.split == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: gh-${{ steps.target.outputs.fname }}
          path: |
            parts/${{ steps.target.outputs.fname }}.tar.gz
            parts/${{ steps.target.outputs.fname }}.tar.gz.sha256
          retention-days: 14
          compression-level: 0

      # ── Split upload: one artifact per part. Mirrors hf-model-fetch.yml. ─
      - name: Upload part 1 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '1'
        uses: actions/upload-artifact@v4
        with:
          name: gh-${{ steps.target.outputs.fname }}-part-1of${{ inputs.parts }}
          path: |
            parts/${{ steps.target.outputs.fname }}.tar.gz.part.00
            parts/${{ steps.target.outputs.fname }}.tar.gz.sha256
            parts/REASSEMBLE.sh
          retention-days: 14
          compression-level: 0

      - name: Upload part 2 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '2'
        uses: actions/upload-artifact@v4
        with:
          name: gh-${{ steps.target.outputs.fname }}-part-2of${{ inputs.parts }}
          path: parts/${{ steps.target.outputs.fname }}.tar.gz.part.01
          retention-days: 14
          compression-level: 0

      - name: Upload part 3 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '3'
        uses: actions/upload-artifact@v4
        with:
          name: gh-${{ steps.target.outputs.fname }}-part-3of${{ inputs.parts }}
          path: parts/${{ steps.target.outputs.fname }}.tar.gz.part.02
          retention-days: 14
          compression-level: 0

      - name: Upload part 4 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '4'
        uses: actions/upload-artifact@v4
        with:
          name: gh-${{ steps.target.outputs.fname }}-part-4of${{ inputs.parts }}
          path: parts/${{ steps.target.outputs.fname }}.tar.gz.part.03
          retention-days: 14
          compression-level: 0

      - name: Upload part 5 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '5'
        uses: actions/upload-artifact@v4
        with:
          name: gh-${{ steps.target.outputs.fname }}-part-5of${{ inputs.parts }}
          path: parts/${{ steps.target.outputs.fname }}.tar.gz.part.04
          retention-days: 14
          compression-level: 0

      - name: Upload part 6 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '6'
        uses: actions/upload-artifact@v4
        with:
          name: gh-${{ steps.target.outputs.fname }}-part-6of${{ inputs.parts }}
          path: parts/${{ steps.target.outputs.fname }}.tar.gz.part.05
          retention-days: 14
          compression-level: 0

      - name: Install instructions
        env:
          FNAME: ${{ steps.target.outputs.fname }}
          PARTS: ${{ inputs.parts }}
          SPLIT: ${{ steps.split.outputs.split }}
          REPO_HERE: ${{ github.repository }}
        run: |
          if [ "$SPLIT" != "true" ]; then
            cat <<EOF
            ============================================================
            Artifact: gh-${FNAME}   (single piece)
            ============================================================
            gh run download \$RUN_ID -R ${REPO_HERE} -n gh-${FNAME}
            tar xzf ${FNAME}.tar.gz
            ============================================================
          EOF
            exit 0
          fi

          cat <<EOF
          ============================================================
          Artifact: gh-${FNAME}   (split into ${PARTS} parts)
          ============================================================
          Each part is its own artifact — download whichever ones you
          haven't fetched yet, on different days if you have a daily-
          bandwidth cap.

          # Download every part:
          for i in \$(seq 1 ${PARTS}); do
            gh run download \$RUN_ID -R ${REPO_HERE} \\
              -n gh-${FNAME}-part-\${i}of${PARTS}
          done

          # Reassemble (script lives inside part 1):
          chmod +x REASSEMBLE.sh
          ./REASSEMBLE.sh
          # → ${FNAME}.tar.gz, verified by sha256

          tar xzf ${FNAME}.tar.gz
          ============================================================
          EOF
