name: Build artifact · backend

# Builds simorgh-backend on a GitHub-hosted runner and uploads the
# resulting image as a downloadable artifact (no GHCR push).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        default: "claude/review-codebase-p4gQf"
      tag:
        description: "Image tag"
        type: string
        default: "local"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-and-artifact.yml
    with:
      service:    "backend"
      context:    "./simorgh-agent/backend"
      dockerfile: "./simorgh-agent/backend/Dockerfile"
      big:        true
      ref:        ${{ inputs.ref }}
      tag:        ${{ inputs.tag }}
