name: Pull GHCR image (split download)

# Pull a pre-built image from GHCR (e.g. ghcr.io/shahram-tabasi/simorgh-backend:local)
# on a GitHub-hosted runner, `docker save | gzip` it, split into N
# parts, and upload each part as a separate artifact. Same split UX as
# hf-model-fetch.yml — designed for fetching large images over a
# metered link in two trips.
#
# Why a workflow instead of `docker pull` on .68? When the recipient's
# egress is metered or proxied, a flaky pull restarting from layer 0
# burns the daily cap. Artifacts can be resumed and split by day.
#
# After download:
#   ./REASSEMBLE.sh   → cats parts, verifies sha256, runs `docker load`
#   docker compose up -d backend

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full image reference to pull (registry/owner/name:tag)"
        type: string
        default: "ghcr.io/shahram-tabasi/simorgh-backend:local"
      parts:
        description: "Split the saved-image tarball into N parts (1 = no split)"
        type: choice
        default: "2"
        options: ["1", "2", "3", "4", "5", "6"]

permissions:
  contents: read
  packages: read   # so GITHUB_TOKEN can pull private GHCR packages too

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free up disk space
        # Docker images for simorgh-backend can be 3-5 GB compressed
        # plus the uncompressed layers on the daemon. Clean out the
        # runner's pre-installed cruft first so we don't OOM-on-disk.
        run: |
          set -eu
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h / | tail -1

      - name: Sanitise image for filenames
        id: name
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -eu
          # Drop any registry hostname prefix (ghcr.io/, docker.io/, …)
          # then replace ':' and '/' with '__' so the result is a safe
          # filename. Examples:
          #   ghcr.io/shahram-tabasi/simorgh-backend:local
          #     → shahram-tabasi__simorgh-backend__local
          STRIPPED="${IMAGE#*/}"          # drop everything before the first '/'
          SAFE="$(echo -n "$STRIPPED" | tr ':/' '__')"
          echo "image=$IMAGE"             >> "$GITHUB_OUTPUT"
          echo "fname=image-${SAFE}"      >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        # GITHUB_TOKEN can read packages in the same org/owner. For
        # cross-org or DockerHub pulls, set repo/secret IMAGE_PULL_TOKEN
        # and IMAGE_PULL_USER and we'll use those instead.
        env:
          REGISTRY: ${{ contains(inputs.image, '/') && fromJSON('["", "ghcr.io", "docker.io", "registry-1.docker.io", "quay.io"]')[0] || '' }}
        run: |
          set -eu
          IMG="${{ inputs.image }}"
          host="${IMG%%/*}"
          case "$host" in
            ghcr.io)
              echo "${{ secrets.GITHUB_TOKEN }}" | \
                docker login ghcr.io -u "${{ github.actor }}" --password-stdin
              ;;
            docker.io|registry-1.docker.io)
              if [ -n "${{ secrets.IMAGE_PULL_TOKEN }}" ]; then
                echo "${{ secrets.IMAGE_PULL_TOKEN }}" | \
                  docker login docker.io -u "${{ secrets.IMAGE_PULL_USER }}" --password-stdin
              else
                echo "DockerHub anonymous pull (rate-limited)."
              fi
              ;;
            *)
              if [ -n "${{ secrets.IMAGE_PULL_TOKEN }}" ]; then
                echo "${{ secrets.IMAGE_PULL_TOKEN }}" | \
                  docker login "$host" -u "${{ secrets.IMAGE_PULL_USER }}" --password-stdin
              fi
              ;;
          esac

      - name: Pull image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -eu
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format='{{.Id}} · {{.Size}} bytes'

      - name: Save + compress image
        id: pack
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          FNAME: ${{ steps.name.outputs.fname }}
        run: |
          set -eu
          OUT="${FNAME}.tar.gz"
          echo "Saving $IMAGE → $OUT …"
          # `docker save` → gzip pipeline never materialises the
          # uncompressed tarball — saves ~30-40% disk usage on the runner.
          docker save "$IMAGE" | gzip -1 > "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Split tarball into N parts
        id: split
        env:
          OUT: ${{ steps.pack.outputs.out }}
          PARTS: ${{ inputs.parts }}
        run: |
          set -eu
          mkdir -p parts
          if [ "$PARTS" -le 1 ]; then
            cp "$OUT" parts/
            cp "$OUT.sha256" parts/
            echo "split=false" >> "$GITHUB_OUTPUT"
            ls -lh parts/
            exit 0
          fi
          split -n "$PARTS" -d --suffix-length=2 "$OUT" "parts/${OUT}.part."
          cp "$OUT.sha256" parts/
          # Self-contained reassembler — same shape as the other split
          # workflows in this repo.
          cat > "parts/REASSEMBLE.sh" <<BASH
          #!/usr/bin/env bash
          set -e
          base="${OUT}"
          parts=( \$(ls "\${base}".part.* | sort) )
          echo "Reassembling \${#parts[@]} parts → \${base} …"
          cat "\${parts[@]}" > "\${base}"
          echo "Verifying SHA-256 …"
          sha256sum -c "\${base}.sha256"
          echo "Loading image into docker …"
          docker load -i "\${base}"
          echo "✅ Image ready. List with: docker images | head"
          BASH
          chmod +x parts/REASSEMBLE.sh
          ls -lh parts/
          echo "split=true" >> "$GITHUB_OUTPUT"

      # ── Single-piece upload ────────────────────────────────────────────
      - name: Upload artifact (single piece)
        if: steps.split.outputs.split == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}
          path: |
            parts/${{ steps.name.outputs.fname }}.tar.gz
            parts/${{ steps.name.outputs.fname }}.tar.gz.sha256
          retention-days: 14
          compression-level: 0

      # ── Split upload — one artifact per part. ─────────────────────────
      - name: Upload part 1 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-1of${{ inputs.parts }}
          path: |
            parts/${{ steps.name.outputs.fname }}.tar.gz.part.00
            parts/${{ steps.name.outputs.fname }}.tar.gz.sha256
            parts/REASSEMBLE.sh
          retention-days: 14
          compression-level: 0

      - name: Upload part 2 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '2'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-2of${{ inputs.parts }}
          path: parts/${{ steps.name.outputs.fname }}.tar.gz.part.01
          retention-days: 14
          compression-level: 0

      - name: Upload part 3 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '3'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-3of${{ inputs.parts }}
          path: parts/${{ steps.name.outputs.fname }}.tar.gz.part.02
          retention-days: 14
          compression-level: 0

      - name: Upload part 4 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '4'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-4of${{ inputs.parts }}
          path: parts/${{ steps.name.outputs.fname }}.tar.gz.part.03
          retention-days: 14
          compression-level: 0

      - name: Upload part 5 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '5'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-5of${{ inputs.parts }}
          path: parts/${{ steps.name.outputs.fname }}.tar.gz.part.04
          retention-days: 14
          compression-level: 0

      - name: Upload part 6 of N
        if: steps.split.outputs.split == 'true' && inputs.parts >= '6'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.fname }}-part-6of${{ inputs.parts }}
          path: parts/${{ steps.name.outputs.fname }}.tar.gz.part.05
          retention-days: 14
          compression-level: 0

      - name: Install instructions
        env:
          FNAME: ${{ steps.name.outputs.fname }}
          PARTS: ${{ inputs.parts }}
          SPLIT: ${{ steps.split.outputs.split }}
          IMAGE: ${{ steps.name.outputs.image }}
          REPO:  ${{ github.repository }}
        run: |
          if [ "$SPLIT" != "true" ]; then
            cat <<EOF
            ============================================================
            Artifact: ${FNAME}   (single piece)
            ============================================================
            gh run download \$RUN_ID -R ${REPO} -n ${FNAME}
            docker load -i ${FNAME}.tar.gz
            docker images
            ============================================================
          EOF
            exit 0
          fi

          cat <<EOF
          ============================================================
          Artifact: ${FNAME}   (split into ${PARTS} parts)
          Image:    ${IMAGE}
          ============================================================
          Each part is its own artifact. Download whichever ones you
          haven't fetched yet, on different days if you have a daily-
          bandwidth cap.

          # Download every part:
          for i in \$(seq 1 ${PARTS}); do
            gh run download \$RUN_ID -R ${REPO} \\
              -n ${FNAME}-part-\${i}of${PARTS}
          done

          # Reassemble + docker load (script lives inside part 1):
          chmod +x REASSEMBLE.sh
          ./REASSEMBLE.sh

          # Bring up the service on the target host:
          cd ~/simorgh-chatbot-ekc-deploy/simorgh-agent
          docker compose up -d --force-recreate backend
          docker compose logs -f backend
          ============================================================
          EOF
