name: Bundle build dependencies (pip + npm + apt)

# One-shot offline snapshot of every build-time dependency the simorgh
# stack needs — pip wheels, npm cache, apt .debs — packed into a single
# zip artifact that gets dropped into /srv/build-deps/ on .68. Every
# `docker compose build` after that fetches its deps over the LAN
# (the docker build context) instead of the metered international link.
#
# Skips Docker images on purpose — base images use the existing
# 192.168.1.64:5000 registry. Skips HuggingFace models because
# bge-m3-fetch.yml / hf-model-fetch.yml already cover those.
#
# Re-run this workflow whenever any of these change:
#   - simorgh-agent/*/requirements.txt        (pip)
#   - simorgh-agent/frontend/package-lock.json (npm)
#   - requirements/apt-debs.list               (apt)
# The runner takes 15-25 min depending on total size. Default output is
# ~2-3 GB compressed; split into 2 parts so an Iranian-proxy contributor
# on a 5 GB/day cap can grab one half per day.
#
# Mirrors the split/upload/install-instructions pattern of the other
# workflows in this repo (docling-models-fetch.yml, bge-m3-fetch.yml,
# pytorch-image-fetch.yml).

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version the wheels must target"
        type: choice
        default: "3.11"
        options: ["3.11", "3.12"]
      distros:
        description: "Comma-separated apt distros to bundle"
        type: string
        default: "jammy,trixie"
      include_pypi_extra:
        description: "Also pull from pytorch.org cu124 index"
        type: boolean
        default: true
      parts:
        description: "Split zip into N artifacts (1 = single, 2 = default for 5GB/day cap)"
        type: choice
        default: "2"
        options: ["1", "2", "3", "4"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        # The combined pip+npm+apt cache plus the zip intermediate stage
        # easily breaches the 14 GB / quota on github-hosted runners.
        run: |
          set -eu
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/share/chromium "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h / | tail -1

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ inputs.python_version }}"

      - name: Set up Node 20 (matches frontend builder)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ──────────────────────────────────────────────────────────────────
      # PIP WHEELS — one per service's requirements.txt
      # ──────────────────────────────────────────────────────────────────
      - name: Download pip wheels for every requirements.txt
        env:
          PYV: ${{ inputs.python_version }}
          EXTRA: ${{ inputs.include_pypi_extra }}
        run: |
          set -eu
          mkdir -p deps/wheels
          # Discover every requirements.txt under simorgh-agent/.
          # Stable order so the bundle hash changes only when deps change.
          mapfile -t REQS < <(find simorgh-agent -maxdepth 3 -name requirements.txt | sort)
          echo "Found ${#REQS[@]} requirements files."

          # pip download platform args: target a Linux x86_64 cpython
          # that matches the running containers. manylinux 2_28 is the
          # most-compatible modern tag; manylinux2014 is the fallback.
          # --only-binary=:all: refuses sdist (we never want to compile
          # at runtime). If a service has a sdist-only dep, pip will
          # error and the workflow log will tell you which one — bake
          # a wheel for it via a separate process.
          COMMON_ARGS=(
            --platform manylinux_2_28_x86_64
            --platform manylinux2014_x86_64
            --platform manylinux_2_17_x86_64
            --python-version "$PYV"
            --implementation cp
            --abi "cp${PYV/./}"
            --only-binary=:all:
            --no-deps        # iterate per-package below to get better errors
          )

          if [ "$EXTRA" = "true" ]; then
            COMMON_ARGS+=( --extra-index-url https://download.pytorch.org/whl/cu124 )
          fi

          # Pass 1 — resolve. Walk each requirements.txt and use pip
          # download WITH deps to a flat shared directory. The flat
          # layout means a wheel needed by N services is downloaded
          # once. Per-service "manifests" are kept as the requirements
          # files themselves; install at consume time names the wheels
          # by version, not by service.
          mkdir -p deps/wheels/cache
          for req in "${REQS[@]}"; do
            svc=$(echo "$req" | awk -F/ '{print $2}')
            echo "──── $svc · $req ────"
            # Drop --no-deps for resolve pass; let pip pull transitive
            # wheels too. The flat cache dir means dedup happens by
            # filename automatically.
            pip download \
              --platform manylinux_2_28_x86_64 \
              --platform manylinux2014_x86_64 \
              --platform manylinux_2_17_x86_64 \
              --python-version "$PYV" \
              --implementation cp \
              --abi "cp${PYV/./}" \
              --only-binary=:all: \
              --extra-index-url https://download.pytorch.org/whl/cu124 \
              -r "$req" \
              -d deps/wheels/cache \
              2>&1 | tail -20 || {
                echo "::warning::pip download failed for $svc — continuing"
              }
          done

          # Move from staging cache to final flat dir.
          mv deps/wheels/cache/*.whl deps/wheels/ 2>/dev/null || true
          mv deps/wheels/cache/*.tar.gz deps/wheels/ 2>/dev/null || true
          rmdir deps/wheels/cache || true
          echo "Total wheels: $(ls deps/wheels/*.whl 2>/dev/null | wc -l)"
          echo "Total sdists: $(ls deps/wheels/*.tar.gz 2>/dev/null | wc -l)"
          du -sh deps/wheels

          # Copy each requirements.txt into the bundle too — the
          # install-side Dockerfile pattern uses `pip install --no-index
          # --find-links=/build-deps/wheels -r requirements.txt` so the
          # txt file is the manifest.
          mkdir -p deps/requirements
          for req in "${REQS[@]}"; do
            svc=$(echo "$req" | awk -F/ '{print $2}')
            cp "$req" "deps/requirements/${svc}.txt"
          done
          ls -la deps/requirements

      # ──────────────────────────────────────────────────────────────────
      # NPM CACHE — for the frontend
      # ──────────────────────────────────────────────────────────────────
      - name: Download npm packages (frontend)
        run: |
          set -eu
          mkdir -p deps/npm
          if [ -f simorgh-agent/frontend/package-lock.json ]; then
            cd simorgh-agent/frontend
            # Force npm to put EVERY downloaded tarball into our deps
            # dir so we capture the full cache, not just the global one.
            npm ci --prefer-offline=false --cache "$GITHUB_WORKSPACE/deps/npm"
            cd "$GITHUB_WORKSPACE"
            # Also save the lockfile so the install-side npm ci can
            # reproduce the same tree.
            cp simorgh-agent/frontend/package-lock.json deps/npm/package-lock.json
            cp simorgh-agent/frontend/package.json       deps/npm/package.json
            du -sh deps/npm
          else
            echo "No frontend package-lock.json found — skipping npm bundle."
          fi

      # ──────────────────────────────────────────────────────────────────
      # APT .DEBS — one tree per distro
      # ──────────────────────────────────────────────────────────────────
      - name: Download apt .debs for each distro
        env:
          DISTROS: ${{ inputs.distros }}
        run: |
          set -eu
          if [ ! -f requirements/apt-debs.list ]; then
            echo "::warning::requirements/apt-debs.list missing — skipping apt bundle."
            exit 0
          fi
          # Distro → image map. Debian distros use plain debian:<name>;
          # Ubuntu jammy uses ubuntu:22.04 (jammy). Adjust as needed.
          declare -A IMG=(
            [trixie]="debian:trixie-slim"
            [bookworm]="debian:bookworm-slim"
            [jammy]="ubuntu:22.04"
            [noble]="ubuntu:24.04"
          )
          IFS=',' read -ra REQ_DISTROS <<< "$DISTROS"
          for d in "${REQ_DISTROS[@]}"; do
            d="${d// /}"
            img="${IMG[$d]:-}"
            if [ -z "$img" ]; then
              echo "::warning::Unknown distro '$d' — skipping."
              continue
            fi
            echo "──── apt download for $d ($img) ────"
            mkdir -p "deps/apt/$d"
            docker run --rm \
              -v "$GITHUB_WORKSPACE/deps/apt/$d:/debs" \
              -v "$GITHUB_WORKSPACE/requirements/apt-debs.list:/apt-debs.list:ro" \
              "$img" bash -c '
                set -eu
                apt-get update -y
                cd /debs
                # apt-get download lands the .deb in CWD without
                # installing it. Pipe the requirements list through
                # grep -v "^#" to drop comments and empties.
                grep -vE "^(#|$)" /apt-debs.list \
                  | xargs apt-get download
                # Also dump the apt index so the consume side can do
                # apt-get update --offline if it wants the package list.
                apt-get install -y --download-only \
                  $(grep -vE "^(#|$)" /apt-debs.list) || true
                cp -r /var/cache/apt/archives/*.deb . 2>/dev/null || true
                ls /debs | head
                du -sh /debs
              '
          done
          du -sh deps/apt/* 2>/dev/null || true

      # ──────────────────────────────────────────────────────────────────
      # SUMMARY MANIFEST
      # ──────────────────────────────────────────────────────────────────
      - name: Write manifest
        run: |
          {
            echo "# simorgh-build-deps bundle"
            echo "Generated: $(date -u +%FT%TZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Python: ${{ inputs.python_version }}"
            echo "Distros: ${{ inputs.distros }}"
            echo
            echo "## wheels"
            ls deps/wheels/*.whl 2>/dev/null | wc -l | xargs printf "count: %s\n"
            du -sh deps/wheels 2>/dev/null
            echo
            echo "## npm"
            du -sh deps/npm 2>/dev/null
            echo
            echo "## apt"
            du -sh deps/apt/* 2>/dev/null
          } > deps/MANIFEST.txt
          cat deps/MANIFEST.txt

      # ──────────────────────────────────────────────────────────────────
      # Pack + split + upload (same shape as other workflows)
      # ──────────────────────────────────────────────────────────────────
      - name: Pack zip
        id: pack
        run: |
          set -eu
          OUT="simorgh-build-deps-${GITHUB_SHA:0:8}.zip"
          echo "Packing $OUT …"
          # zip -0 = no compression. Wheels and .debs are already
          # zstandard/xz-compressed; double-compressing would burn
          # CPU for ~2% size gain. Plus -0 lets us split byte-exact.
          ( cd deps && zip -r0 "../$OUT" . )
          ls -lh "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Split zip
        id: split
        env:
          OUT: ${{ steps.pack.outputs.out }}
          PARTS: ${{ inputs.parts }}
        run: |
          set -eu
          mkdir -p parts
          if [ "$PARTS" -le 1 ]; then
            mv "$OUT" parts/
            mv "$OUT.sha256" parts/
            echo "split=false" >> "$GITHUB_OUTPUT"
            ls -lh parts/
            exit 0
          fi
          split -n "$PARTS" -d --suffix-length=2 "$OUT" "parts/${OUT}.part."
          mv "$OUT.sha256" parts/
          rm -f "$OUT"
          cat > "parts/REASSEMBLE.sh" <<BASH
          #!/usr/bin/env bash
          set -e
          base="${OUT}"
          parts=( \$(ls "\${base}".part.* | sort) )
          echo "Reassembling \${#parts[@]} parts → \${base} …"
          cat "\${parts[@]}" > "\${base}"
          echo "Verifying SHA-256 …"
          sha256sum -c "\${base}.sha256"
          echo "✅ \${base} ready. Run install-build-deps.sh next."
          BASH
          chmod +x parts/REASSEMBLE.sh
          ls -lh parts/
          echo "split=true" >> "$GITHUB_OUTPUT"

      - name: Upload (single piece)
        if: steps.split.outputs.split == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-build-deps
          path: |
            parts/${{ steps.pack.outputs.out }}
            parts/${{ steps.pack.outputs.out }}.sha256
          retention-days: 14
          compression-level: 0

      - name: Upload part 1
        if: steps.split.outputs.split == 'true' && inputs.parts >= '1'
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-build-deps-part-1of${{ inputs.parts }}
          path: |
            parts/${{ steps.pack.outputs.out }}.part.00
            parts/${{ steps.pack.outputs.out }}.sha256
            parts/REASSEMBLE.sh
          retention-days: 14
          compression-level: 0

      - name: Upload part 2
        if: steps.split.outputs.split == 'true' && inputs.parts >= '2'
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-build-deps-part-2of${{ inputs.parts }}
          path: parts/${{ steps.pack.outputs.out }}.part.01
          retention-days: 14
          compression-level: 0

      - name: Upload part 3
        if: steps.split.outputs.split == 'true' && inputs.parts >= '3'
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-build-deps-part-3of${{ inputs.parts }}
          path: parts/${{ steps.pack.outputs.out }}.part.02
          retention-days: 14
          compression-level: 0

      - name: Upload part 4
        if: steps.split.outputs.split == 'true' && inputs.parts >= '4'
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-build-deps-part-4of${{ inputs.parts }}
          path: parts/${{ steps.pack.outputs.out }}.part.03
          retention-days: 14
          compression-level: 0

      - name: Install instructions
        env:
          PARTS: ${{ inputs.parts }}
          SPLIT: ${{ steps.split.outputs.split }}
          OUT:   ${{ steps.pack.outputs.out }}
        run: |
          if [ "$SPLIT" != "true" ]; then
            cat <<EOF
          ============================================================
          Artifact: simorgh-build-deps   (single piece)
          File:     ${OUT}
          ============================================================

          # 1. Download from any machine with gh CLI + internet:
          gh run download \$RUN_ID \\
              -R shahram-tabasi/simorgh-chatbot-ekc-deploy \\
              -n simorgh-build-deps
          sha256sum -c ${OUT}.sha256

          # 2. Transfer to .68:
          scp ${OUT} ubuntu@192.168.1.68:/tmp/

          # 3. Install (uses the helper script that ships with this repo):
          ssh ubuntu@192.168.1.68
          cd /home/ubuntu/simorgh-chatbot-ekc-deploy
          git pull   # get install-build-deps.sh + Dockerfile patterns
          ./simorgh-agent/scripts/install-build-deps.sh /tmp/${OUT}

          # The script:
          #   - unzips to /srv/build-deps/
          #   - registers /srv/build-deps as a docker buildx additional
          #     context so Dockerfiles can COPY --from=deps /wheels …
          ============================================================
          EOF
            exit 0
          fi

          cat <<EOF
          ============================================================
          Artifact: simorgh-build-deps   (split into ${PARTS} parts)
          File:     ${OUT}
          ============================================================

          # 1. Download every part (spread across days if metered):
          for i in \$(seq 1 ${PARTS}); do
            gh run download \$RUN_ID \\
                -R shahram-tabasi/simorgh-chatbot-ekc-deploy \\
                -n simorgh-build-deps-part-\${i}of${PARTS}
          done

          # 2. Reassemble (REASSEMBLE.sh ships inside part 1of${PARTS}):
          chmod +x REASSEMBLE.sh
          ./REASSEMBLE.sh
          # → produces ${OUT}, verified by sha256

          # 3. Transfer + install on .68:
          scp ${OUT} ubuntu@192.168.1.68:/tmp/
          ssh ubuntu@192.168.1.68 \\
              'cd /home/ubuntu/simorgh-chatbot-ekc-deploy && git pull && \\
               ./simorgh-agent/scripts/install-build-deps.sh /tmp/${OUT}'
          ============================================================
          EOF
