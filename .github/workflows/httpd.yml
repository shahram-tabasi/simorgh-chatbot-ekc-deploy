name: Publish httpd Image to GHCR

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  push-to-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull httpd:latest from Docker Hub
        run: docker pull httpd:latest

      - name: Save image as tar file
        run: docker save httpd:latest | gzip > httpd-latest.tar.gz

      - name: Get tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "httpd Image ${{ steps.tag.outputs.tag }}"
          body: |
            Docker image `httpd:latest` as a downloadable tar.

            **Load it locally after downloading:**
            ```bash
            docker load < httpd-latest.tar.gz
            ```
          files: httpd-latest.tar.gz
