name: Build LLM service images

# Builds the three custom LLM images and pushes each to
# ghcr.io/<owner>/llm-<service>:<tag>. Triggered automatically on
# pushes that touch llms/, or manually via workflow_dispatch.
#
# After a green run, on the GPU box (.61 or .62):
#   docker pull  ghcr.io/<owner>/llm-<name>:<tag>
#   docker tag   ghcr.io/<owner>/llm-<name>:<tag>  simorgh-llm-<name>:local
#   docker compose -f docker-compose.llm.yml up -d   # or .vlm.yml
#
# The compose files pin `image: simorgh-llm-<name>:local`, so the retag
# is what makes the locally-pulled image satisfy the compose contract.

on:
  push:
    branches: [main, develop]
    paths:
      - 'llms/**'
      - '.github/workflows/llm-deploy.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        default: "claude/review-codebase-p4gQf"
      tag:
        description: "Image tag to apply"
        type: string
        default: "local"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build · ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service:
          # ─── 192.168.1.61 — text LLM (Unsloth + vLLM + FastAPI) ───
          - { name: ai-service,        context: ./llms/ai,          dockerfile: ./llms/ai/Dockerfile,          big: true  }
          - { name: model-initializer, context: ./llms/initializer, dockerfile: ./llms/initializer/Dockerfile, big: false }
          # ─── Both .61 and .62 — VRAM watchdog ─────────────────────
          - { name: gpu-monitor,       context: ./llms/gpu_monitor, dockerfile: ./llms/gpu_monitor/Dockerfile, big: false }

    steps:
      - name: Checkout ${{ inputs.ref || github.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Lowercase owner (GHCR requires lowercase)
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Free runner disk (heavy)
        if: ${{ matrix.service.big }}
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Free runner disk (light)
        if: ${{ !matrix.service.big }}
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/llm-${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ inputs.tag || 'local' }}
            type=ref,event=branch
            type=sha,format=short,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=llm-${{ matrix.service.name }}
          cache-to:   type=gha,scope=llm-${{ matrix.service.name }},mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Print pull instructions
        run: |
          OWNER_LC="${{ steps.owner.outputs.lc }}"
          TAG="${{ inputs.tag || 'local' }}"
          cat <<EOF
          ============================================================
          Pushed: ghcr.io/\${OWNER_LC}/llm-${{ matrix.service.name }}:\${TAG}

          ONE-TIME: flip the package PUBLIC so the GPU boxes can pull
          anonymously (or use a read:packages PAT):
            https://github.com/users/\${OWNER_LC}/packages/container/llm-${{ matrix.service.name }}/settings

          On the GPU box:
            docker pull ghcr.io/\${OWNER_LC}/llm-${{ matrix.service.name }}:\${TAG}
            docker tag  ghcr.io/\${OWNER_LC}/llm-${{ matrix.service.name }}:\${TAG} \\
                        simorgh-llm-${{ matrix.service.name }}:local
            docker compose -f docker-compose.llm.yml up -d   # (or .vlm.yml)
          ============================================================
          EOF
