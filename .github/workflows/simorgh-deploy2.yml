name: Build & save Simorgh images for air-gapped install

# Builds every simorgh-agent custom image on GitHub-hosted runners,
# `docker save`s each into a gzipped tarball, and uploads each as a
# downloadable artifact. The operator then ferries the artifacts to .68
# and `docker load`s them into the local Docker daemon.
#
# This replaces the old GHCR-push workflow (the .68 host can't reach
# ghcr.io anyway).
#
# After a green run:
#   1. On a workstation with GitHub access: open the run → Artifacts →
#      download every "simorgh-<name>-image" artifact you need.
#   2. scp them to .68 (or USB).
#   3. On .68:
#        for z in simorgh-*-image.zip; do unzip -j "$z" -d /tmp/simorgh-imgs/; done
#        cd /tmp/simorgh-imgs
#
#        # backend was split into chunks — reassemble first
#        if ls backend.tar.gz.part-* >/dev/null 2>&1; then
#          cat backend.tar.gz.part-* > backend.tar.gz
#          rm backend.tar.gz.part-*
#        fi
#
#        # load every tarball
#        for f in *.tar.gz; do
#          echo "=== loading $f ==="
#          docker load < "$f"
#        done
#
#        # verify
#        docker images | grep '^simorgh-'

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated subset to build (blank = build everything)"
        type: string
        default: ""
      tag:
        description: "Image tag to apply"
        type: string
        default: "local"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build each service in its own job (parallel). Matrix is the full list;
  # the bash step at the top filters out anything not in inputs.services.
  # ---------------------------------------------------------------------------
  build:
    name: build · ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service:
          # ---- Original services -----------------------------------------
          - { name: backend,                      context: ./simorgh-agent,            dockerfile: ./simorgh-agent/backend/Dockerfile,                       big: true  }
          - { name: frontend,                     context: ./simorgh-agent/frontend,   dockerfile: ./simorgh-agent/frontend/Dockerfile,                      big: false }
          - { name: stt-service,                  context: ./simorgh-agent/stt-service, dockerfile: ./simorgh-agent/stt-service/Dockerfile,                  big: false }
          - { name: tts-service,                  context: ./simorgh-agent/tts-service, dockerfile: ./simorgh-agent/tts-service/Dockerfile,                  big: false }
          - { name: doc-processor,                context: ./simorgh-agent/doc-processor, dockerfile: ./simorgh-agent/doc-processor/Dockerfile,              big: false }

          # ---- 2026-05 enterprise migration (build with parent context for shared/) ----
          - { name: gitlab-mcp,                   context: ./simorgh-agent, dockerfile: ./simorgh-agent/gitlab-mcp-service/Dockerfile,                      big: false }
          - { name: runtime-broker,               context: ./simorgh-agent, dockerfile: ./simorgh-agent/runtime-broker/Dockerfile,                          big: false }
          - { name: context-search,               context: ./simorgh-agent, dockerfile: ./simorgh-agent/context-search-service/Dockerfile,                  big: false }
          - { name: tpms-context-agent,           context: ./simorgh-agent, dockerfile: ./simorgh-agent/tpms-context-agent/Dockerfile,                      big: false }
          - { name: mail-bridge,                  context: ./simorgh-agent, dockerfile: ./simorgh-agent/mail-bridge/Dockerfile,                             big: false }
          - { name: project-init,                 context: ./simorgh-agent, dockerfile: ./simorgh-agent/project-init-service/Dockerfile,                    big: false }

          # ---- Phases 2-9: extracted from backend monolith ----------------
          - { name: llm-gateway,                  context: ./simorgh-agent/llm-gateway,                  dockerfile: ./simorgh-agent/llm-gateway/Dockerfile,                  big: false }
          - { name: embeddings-service,           context: ./simorgh-agent/embeddings-service,           dockerfile: ./simorgh-agent/embeddings-service/Dockerfile,           big: false }
          - { name: auth-service,                 context: ./simorgh-agent/auth-service,                 dockerfile: ./simorgh-agent/auth-service/Dockerfile,                 big: false }
          - { name: documents-rag-service,        context: ./simorgh-agent/documents-rag-service,        dockerfile: ./simorgh-agent/documents-rag-service/Dockerfile,        big: false }
          - { name: chat-service,                 context: ./simorgh-agent/chat-service,                 dockerfile: ./simorgh-agent/chat-service/Dockerfile,                 big: false }
          - { name: project-agent-service,        context: ./simorgh-agent/project-agent-service,        dockerfile: ./simorgh-agent/project-agent-service/Dockerfile,        big: false }
          - { name: specification-agent-service,  context: ./simorgh-agent/specification-agent-service,  dockerfile: ./simorgh-agent/specification-agent-service/Dockerfile,  big: false }
          - { name: graph-rag-service,            context: ./simorgh-agent/graph-rag-service,            dockerfile: ./simorgh-agent/graph-rag-service/Dockerfile,            big: false }
          - { name: payments-service,             context: ./simorgh-agent/payments-service,             dockerfile: ./simorgh-agent/payments-service/Dockerfile,             big: false }
          - { name: admin-service,                context: ./simorgh-agent/admin-service,                dockerfile: ./simorgh-agent/admin-service/Dockerfile,                big: false }
          - { name: tier-quota-service,           context: ./simorgh-agent/tier-quota-service,           dockerfile: ./simorgh-agent/tier-quota-service/Dockerfile,           big: false }

          # ---- Microservices ---------------------------------------------
          - { name: search-service,               context: ./simorgh-agent/search-service,               dockerfile: ./simorgh-agent/search-service/Dockerfile,               big: false }
          - { name: tpms-fetcher,                 context: ./simorgh-agent/tpms-fetcher-service,         dockerfile: ./simorgh-agent/tpms-fetcher-service/Dockerfile,         big: false }
          - { name: project-analysis,             context: ./simorgh-agent/project-analysis-service,     dockerfile: ./simorgh-agent/project-analysis-service/Dockerfile,     big: false }
          - { name: command-gen,                  context: ./simorgh-agent/command-gen-service,          dockerfile: ./simorgh-agent/command-gen-service/Dockerfile,          big: false }
          - { name: file-export,                  context: ./simorgh-agent/file-export-service,          dockerfile: ./simorgh-agent/file-export-service/Dockerfile,          big: false }
          - { name: eplan-bridge,                 context: ./simorgh-agent/eplan-bridge-service,         dockerfile: ./simorgh-agent/eplan-bridge-service/Dockerfile,         big: false }

          # ---- General-chat feature services -----------------------------
          - { name: hr-kb-service,                context: ./simorgh-agent/hr-kb-service,                dockerfile: ./simorgh-agent/hr-kb-service/Dockerfile,                big: false }
          - { name: org-data-service,             context: ./simorgh-agent/org-data-service,             dockerfile: ./simorgh-agent/org-data-service/Dockerfile,             big: false }
          - { name: eplan-sql-service,            context: ./simorgh-agent/eplan-sql-service,            dockerfile: ./simorgh-agent/eplan-sql-service/Dockerfile,            big: false }

          # ---- Standalone CAD app ---------------------------------------
          - { name: simorgh-soft,                 context: ./simorgh-agent/simorgh-soft,                 dockerfile: ./simorgh-agent/simorgh-soft/Dockerfile,                 big: false }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if not in selected list
        id: filter
        run: |
          set -eu
          requested='${{ inputs.services }}'
          if [ -z "$requested" ]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # comma- or space-separated list
          for s in $(echo "$requested" | tr ',' ' '); do
            if [ "$s" = "${{ matrix.service.name }}" ]; then
              echo "selected=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "selected=false" >> "$GITHUB_OUTPUT"

      - name: Free up runner disk (heavy)
        if: ${{ matrix.service.big && steps.filter.outputs.selected == 'true' }}
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Free up runner disk (light)
        if: ${{ !matrix.service.big && steps.filter.outputs.selected == 'true' }}
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Docker Buildx
        if: ${{ steps.filter.outputs.selected == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build image (load to local docker)
        if: ${{ steps.filter.outputs.selected == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true                             # makes image available to `docker save`
          tags: simorgh-${{ matrix.service.name }}:${{ inputs.tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,scope=${{ matrix.service.name }},mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Save & gzip image
        if: ${{ steps.filter.outputs.selected == 'true' }}
        run: |
          set -eu
          IMG="simorgh-${{ matrix.service.name }}:${{ inputs.tag }}"
          OUT="${{ matrix.service.name }}.tar.gz"
          docker save "$IMG" | gzip -1 > "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"

      - name: Split into chunks if > 1.9 GB
        if: ${{ steps.filter.outputs.selected == 'true' }}
        id: chunk
        run: |
          set -eu
          OUT="${{ matrix.service.name }}.tar.gz"
          # GitHub artifact-per-file practical ceiling is ~2 GB. Anything
          # above 1.9 GB gets split.
          MAX_BYTES=$((1900 * 1024 * 1024))
          SIZE=$(stat -c%s "$OUT")
          if [ "$SIZE" -le "$MAX_BYTES" ]; then
            echo "chunked=false" >> "$GITHUB_OUTPUT"
            echo "Image is $(( SIZE / 1024 / 1024 )) MiB; uploading as a single file."
          else
            echo "chunked=true" >> "$GITHUB_OUTPUT"
            echo "Image is $(( SIZE / 1024 / 1024 )) MiB; splitting into 1900M chunks."
            split -b 1900M -d -a 2 "$OUT" "${OUT}.part-"
            ls -lh "${OUT}.part-"*
            rm -f "$OUT"        # remove the unsplit copy to save artifact space
          fi

      - name: Upload artifact (single file)
        if: ${{ steps.filter.outputs.selected == 'true' && steps.chunk.outputs.chunked == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-${{ matrix.service.name }}-image
          path: |
            ${{ matrix.service.name }}.tar.gz
            ${{ matrix.service.name }}.tar.gz.sha256
          retention-days: 14
          compression-level: 0

      - name: Upload artifact (chunked)
        if: ${{ steps.filter.outputs.selected == 'true' && steps.chunk.outputs.chunked == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-${{ matrix.service.name }}-image
          path: |
            ${{ matrix.service.name }}.tar.gz.part-*
            ${{ matrix.service.name }}.tar.gz.sha256
          retention-days: 14
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Summary — prints final usage instructions in the workflow log.
  # ---------------------------------------------------------------------------
  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Final instructions
        run: |
          cat <<'EOF'
          ============================================================
          Air-gapped install instructions for .68
          ============================================================
          1. Open this run's "Artifacts" section. You'll see one
             artifact per built service: simorgh-<name>-image
          2. Download every artifact you need. (Selecting "Download
             all" gives you one combined zip.)
          3. Transfer to .68:
                scp simorgh-*-image.zip ubuntu@192.168.1.68:/tmp/
          4. On .68:
                mkdir -p /tmp/simorgh-imgs
                cd /tmp
                for z in simorgh-*-image.zip; do
                  unzip -j -o "$z" -d /tmp/simorgh-imgs/
                done
                cd /tmp/simorgh-imgs

                # backend (and any other oversized image) was split.
                # Reassemble before loading.
                for stem in $(ls *.tar.gz.part-00 2>/dev/null \
                              | sed 's/\.tar\.gz\.part-00$//'); do
                  echo "==> reassembling $stem"
                  cat "$stem".tar.gz.part-* > "$stem".tar.gz
                  rm "$stem".tar.gz.part-*
                done

                # verify integrity
                sha256sum -c *.sha256

                # load each into the local docker daemon
                for f in *.tar.gz; do
                  echo "==> docker load $f"
                  docker load < "$f"
                done

                docker images | grep '^simorgh-'
          5. Now run the stack — `docker compose up -d` will use the
             local images (no build, no Squid pulls):
                cd ~/simorgh-chatbot-ekc-deploy/simorgh-agent
                docker compose up -d
          ============================================================
          EOF
