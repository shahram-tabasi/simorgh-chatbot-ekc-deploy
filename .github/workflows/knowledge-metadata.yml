name: Knowledge Metadata Generator

# Trigger when documents are pushed to the knowledge/ directory
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'knowledge/**'
      - '!knowledge/.metadata/**'
      - '!knowledge/generate_metadata.py'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate all metadata'
        type: boolean
        default: false

jobs:
  generate-metadata:
    name: Generate Document Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to detect changed files

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect changed documents
        id: changes
        run: |
          if [ "${{ github.event.inputs.force_regenerate }}" = "true" ]; then
            echo "Force regenerate requested - processing all files"
            CHANGED=$(find knowledge/ -maxdepth 1 -type f \
              ! -name '*.py' ! -name '.gitkeep' ! -name '*.metadata.json' \
              | tr '\n' ' ')
            echo "mode=all" >> $GITHUB_OUTPUT
          else
            # Get files changed in the last commit within knowledge/
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'knowledge/' \
              | grep -v '\.metadata/' \
              | grep -v 'generate_metadata\.py' \
              | grep -v '\.gitkeep' \
              | tr '\n' ' ')
            echo "mode=changed" >> $GITHUB_OUTPUT
          fi

          if [ -z "$CHANGED" ]; then
            echo "No document changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed files: $CHANGED"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "files=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Generate metadata
        if: steps.changes.outputs.has_changes == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd knowledge/

          if [ "${{ steps.changes.outputs.mode }}" = "all" ]; then
            echo "Processing all documents..."
            python generate_metadata.py --all --force
          else
            echo "Processing changed documents..."
            # Convert space-separated to arguments
            FILES="${{ steps.changes.outputs.files }}"
            python generate_metadata.py --changed $FILES
          fi

      - name: Commit metadata
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add knowledge/.metadata/
          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
          else
            git commit -m "auto: generate knowledge metadata for updated documents"
            git push
          fi

  deploy-knowledge:
    name: Deploy Knowledge to Servers
    runs-on: ubuntu-latest
    needs: [generate-metadata]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # Pull latest (including metadata commit from previous job)
          fetch-depth: 1

      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref_name }} || true

      - name: Lowercase repository owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2324 95.38.203.173 >> ~/.ssh/known_hosts

      - name: Deploy knowledge to central server (1.68)
        run: |
          echo "=== Deploying knowledge to central server (1.68) ==="

          # Ensure ekc-knowledge directory exists on 1.68
          ssh -p 2324 -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@95.38.203.173 \
            'mkdir -p ~/ekc-knowledge'

          # Sync knowledge directory to central server
          scp -P 2324 -i ~/.ssh/deploy_key -r \
            knowledge/.metadata/* \
            ${{ secrets.SSH_USER }}@95.38.203.173:~/ekc-knowledge/

          # Also copy the raw documents
          scp -P 2324 -i ~/.ssh/deploy_key -r \
            knowledge/ \
            ${{ secrets.SSH_USER }}@95.38.203.173:~/ekc-knowledge-docs/ 2>/dev/null || true

          echo "Knowledge deployed to central server (1.68)"

      - name: Setup SSH from central to 1.69
        run: |
          ssh -p 2324 -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@95.38.203.173 \
            "ssh-keyscan -H 192.168.1.69 >> ~/.ssh/known_hosts 2>/dev/null || true"

      - name: Deploy knowledge to local server (1.69) via central (1.68)
        run: |
          echo "=== Deploying knowledge to local server (1.69) via central (1.68) ==="

          ssh -p 2324 -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@95.38.203.173 << 'ENDSSH'
          # Ensure ekc-knowledge directory exists on 1.69
          ssh -o StrictHostKeyChecking=no ubuntu@192.168.1.69 'mkdir -p ~/ekc-knowledge'

          # Copy metadata from central to 1.69
          scp -o StrictHostKeyChecking=no -r ~/ekc-knowledge/* ubuntu@192.168.1.69:~/ekc-knowledge/

          echo "Knowledge deployed to local server (1.69)"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "=== Verifying knowledge deployment ==="

          # Check on 1.68
          echo "--- Central server (1.68) ---"
          ssh -p 2324 -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@95.38.203.173 \
            'ls -la ~/ekc-knowledge/ && echo "Index:" && cat ~/ekc-knowledge/_index.json 2>/dev/null | head -5 || echo "No index yet"'

          # Check on 1.69
          echo "--- Local server (1.69) ---"
          ssh -p 2324 -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@95.38.203.173 \
            "ssh ubuntu@192.168.1.69 'ls -la ~/ekc-knowledge/ && echo Files: && ls ~/ekc-knowledge/*.json 2>/dev/null | wc -l || echo No files yet'"

          echo "=== Knowledge deployment verified ==="
