# =============================================================================
# Host Nginx Configuration with SSL (Purchased CA Certificate)
# =============================================================================
# This configuration enables HTTPS on the host nginx using a purchased
# SSL certificate and proxies traffic to Docker services.
#
# Certificate files:
#   /etc/ssl/private/fullchain.pem
#   /etc/ssl/private/simorghai.electrokavir.com.key
#
# Deployment:
#   1. Copy this file to /etc/nginx/conf.d/default.conf
#   2. Test: sudo nginx -t
#   3. Reload: sudo systemctl reload nginx
# =============================================================================

# =============================================================================
# Load Balancer Upstream Definitions
# =============================================================================

# Eplanix servers
upstream eplanix_backend {
    ip_hash;
    server 192.168.1.63;
    server 192.168.1.64;

    # Keep connections alive for better performance
    keepalive 32;
}

# Chatbot Docker nginx (local)
upstream chatbot_backend {
    server 127.0.0.1:85;
    keepalive 16;
}

# =============================================================================
# HTTP Server - Redirect all HTTP to HTTPS
# =============================================================================
server {
    listen 80;
    server_name simorghai.electrokavir.com 192.168.1.68;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# =============================================================================
# HTTPS Server - Main Configuration
# =============================================================================
server {
    listen 443 ssl http2;
    server_name simorghai.electrokavir.com 192.168.1.68;

    # =========================================================================
    # SSL Certificate Configuration (Purchased CA Certificate)
    # =========================================================================
    ssl_certificate     /etc/ssl/private/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/simorghai.electrokavir.com.key;

    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL Configuration (TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS - tell browsers to always use HTTPS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # IP whitelist (uncomment to restrict access)
    # allow 192.168.1.0/24;
    # allow 127.0.0.1;
    # deny all;
    allow all;

    # Override global client settings
    client_max_body_size 100M;
    client_body_timeout 300s;

    # =========================================================================
    # Default location - serve ElectroKavir landing page
    # =========================================================================
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Static assets for landing page
    location /Contents/ {
        alias /usr/share/nginx/html/landing/Contents/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # /eplanix - Load balanced to 192.168.1.63 and 192.168.1.64
    # =========================================================================
    location /eplanix/ {
        # Remove /eplanix prefix when forwarding to backend
        rewrite ^/eplanix/(.*) /$1 break;

        proxy_pass http://eplanix_backend;

        # Forward original host and client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /eplanix;

        # HTTP/1.1 for keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Cookie path rewriting
        proxy_cookie_path / /eplanix/;
        proxy_redirect off;

        # Timeouts for large files or slow responses
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Static files for eplanix (direct pass without body rewriting for performance)
    location ~* ^/eplanix/.*\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        rewrite ^/eplanix/(.*) /$1 break;
        proxy_pass http://eplanix_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /eplanix;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Cache static files
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # /simorgh-draft - Simorgh Design Software
    # Proxied to Docker nginx which routes to simorgh-soft container
    # =========================================================================
    location /simorgh-draft/ {
        # Preserve /simorgh-draft/ prefix - container nginx handles stripping
        proxy_pass http://chatbot_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /simorgh-draft;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Static assets for simorgh-draft (cached)
    location ~* ^/simorgh-draft/.*\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://chatbot_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /simorgh-draft;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # /api/stt/ws - STT WebSocket (direct, no /chatbot prefix)
    # =========================================================================
    location /api/stt/ws/ {
        proxy_pass http://chatbot_backend/api/stt/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================================================================
    # /api - Proxy all API requests to Docker nginx (direct, no /chatbot prefix)
    # Frontend uses /api/* URLs relative to root
    # =========================================================================
    location /api/ {
        proxy_pass http://chatbot_backend/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE streaming support
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;

        # Long timeouts for AI processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # Large body for file uploads (STT audio)
        client_max_body_size 100M;
    }

    # =========================================================================
    # /chatbot/api - Proxy API requests to Docker nginx (strip /chatbot prefix)
    # =========================================================================
    location /chatbot/api/ {
        # Strip /chatbot prefix - /chatbot/api/foo -> /api/foo
        proxy_pass http://chatbot_backend/api/;


        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /chatbot;

        # SSE streaming support (critical for chatbot responses)
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Disable buffering for real-time streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;

        # Long timeouts for AI processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # Large body for file uploads
        client_max_body_size 100M;
    }

    # =========================================================================
    # /chatbot - Proxy to Docker nginx on port 85
    # =========================================================================
    location /chatbot/ {
        # NO trailing slash - preserve /chatbot/ prefix in request path
        proxy_pass http://chatbot_backend;


        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /chatbot;

        # SSE streaming support
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;

        # Long timeouts for AI processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        client_max_body_size 100M;
    }

    # =========================================================================
    # /chatbot WebSocket support
    # =========================================================================
    location /chatbot/ws {
        proxy_pass http://chatbot_backend/ws;


        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================================================================
    # /chatbot/api/stt WebSocket for Speech-to-Text
    # =========================================================================
    location /chatbot/api/stt/ws/ {
        proxy_pass http://chatbot_backend/api/stt/ws/;


        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
