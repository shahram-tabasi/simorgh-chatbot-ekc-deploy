# =============================================================================
# Trust the ArvanCDN edge for client addresses
# =============================================================================
# Public traffic reaches this host through the ArvanCDN proxy, so the address
# nginx sees on the connection is Arvan's, not the visitor's. These directives
# tell nginx to take the visitor's address from X-Forwarded-For instead — but
# only for connections that really came from Arvan.
#
# This file is generated. Do not add ranges by hand; run:
#
#     ./update-arvan-ips.sh <url-or-file-with-Arvan's-published-ranges>
#
# and get the list from Arvan's own documentation or panel, never from a guess.
# `set_real_ip_from` means "believe this peer's X-Forwarded-For", so a range
# that is too wide — and 0.0.0.0/0 above all — lets any client on the internet
# name its own address.
#
# What it does NOT affect: which names the internet may ask for. That check is
# keyed on $realip_remote_addr in default.conf, which no header can move, so a
# forged X-Forwarded-For cannot use this file to reach an unpublished service.
#
# Deploy to /etc/nginx/conf.d/arvan-real-ip.conf — nginx includes conf.d/*.conf
# on its own, and these directives are http-level, so no include line is needed.
# The file holds no ranges yet, so it changes nothing until it is generated.
# =============================================================================

real_ip_header    X-Forwarded-For;

# Arvan appends the visitor to any X-Forwarded-For the client sent, so the
# address to trust is the rightmost one that is not itself a trusted proxy.
# That is what the recursive search finds.
real_ip_recursive on;

