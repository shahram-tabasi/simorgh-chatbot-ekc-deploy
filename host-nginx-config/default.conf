# =============================================================================
# Host Nginx — simorghai (192.168.1.68)
# =============================================================================
# One file, three kinds of virtual host:
#
#   1. simorghai.electrokavir.com (and the bare IP) — the legacy, path-based
#      site: the ElectroKavir landing page plus /eplanix/, /simorgh-design-suite/,
#      /chatbot/, /api/, /gitlab/, /kibana/, /kara/, /demo/. This is the
#      default_server, so it is also what a client reaching the box by IP or
#      with no SNI gets.
#
#   2. Named blocks under simorghai.com for the services that live on this
#      host or on a fixed internal IP — eplanix., design., chat., gitlab.,
#      kibana., kara., demo., openstack. They keep their static upstreams, so
#      nginx never does a DNS lookup for them and they can never loop back
#      into nginx.
#
#   3. A wildcard *.simorghai.com block that resolves the requested host
#      through PowerDNS (192.168.1.68) at request time and proxies to it over
#      HTTPS. A new HTTPS service needs a PDNS record and nothing here.
#
# An exact server_name always wins over the wildcard in nginx's SNI matching,
# so 2 takes precedence over 3 — that is what lets OpenStack (plain HTTP
# behind the scenes) and the local services be exceptions to the rule.
#
# Certificates
#   simorghai.electrokavir.com : /etc/ssl/private/fullchain.pem
#                                /etc/ssl/private/simorghai.electrokavir.com.key
#   *.simorghai.com            : /etc/letsencrypt/live/simorghai.com/fullchain.pem
#                                /etc/letsencrypt/live/simorghai.com/privkey.pem
#
# Deployment
#   1. sudo cp host-nginx-config/default.conf /etc/nginx/conf.d/default.conf
#      Public traffic comes through the ArvanCDN, so also deploy its companion:
#      sudo cp host-nginx-config/arvan-real-ip.conf /etc/nginx/conf.d/
#      and fill it in with ./update-arvan-ips.sh <Arvan's published ranges>.
#   2. Make sure no other file in conf.d/ or sites-enabled/ defines these same
#      names, a second `resolver`, or a second default_server — the older
#      wildcard-simorghai.conf and the *.disabled/*.bak copies must not be
#      loaded (nginx only reads *.conf, so the .bak/.disabled ones are inert;
#      wildcard-simorghai.conf has to be renamed or deleted).
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#
# PDNS records this expects (A records in the simorghai.com zone). Everything
# proxied from this host points AT this host — nginx reaches those backends
# over their static upstreams, not through DNS:
#   eplanix / design / chat / gitlab / kibana / kara / demo → 192.168.1.68
#   openstack                                              → 192.168.1.95
#   every other service                                    → its own IP
#
# The one rule for the wildcard: a name it serves must NOT resolve to
# 192.168.1.68, or nginx would proxy to itself. Anything hosted on this box
# gets its own named block above instead. The loop guard in the wildcard block
# turns a mistake into a 508 instead of an endless request storm.
# =============================================================================

# Resolve proxy_pass hostnames at request time through PowerDNS. Required for
# every proxy_pass that uses a variable; `valid=10s` means a record change in
# PDNS is picked up within ten seconds, with no nginx reload.
resolver 192.168.1.68 valid=10s ipv6=off;
resolver_timeout 5s;

# Send `Connection: upgrade` only when the client actually asked for an
# upgrade, and `Connection: close` otherwise. Sending "upgrade" unconditionally
# confuses backends that speak plain HTTP keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================================================
# Who may reach the internal simorghai.com services
# -----------------------------------------------------------------------------
# Host-based routing has no address of its own to firewall: once 443 on the
# public IP reaches this nginx, ANY client on the internet can ask for ANY
# name under simorghai.com just by setting the Host header —
# `curl --resolve monitoring.simorghai.com:443:<public ip>` needs no public DNS
# record at all. Without the two maps below, publishing one subdomain publishes
# the whole PDNS zone.
#
# So the wildcard and openstack blocks ask two questions: is the client on the
# internal network, and is this name one we chose to publish? Internal clients
# get everything. Everyone else gets only what is marked 1 here.
# =============================================================================

# Keyed on $realip_remote_addr — the address the TCP connection actually came
# from — and NOT on $remote_addr. The difference decides whether this check can
# be walked past.
#
# Once arvan-real-ip.conf trusts the CDN's addresses, the realip module rewrites
# $remote_addr from X-Forwarded-For. A request arriving through the CDN carrying
# `X-Forwarded-For: 192.168.1.50` can therefore make $remote_addr an RFC1918
# address — and a geo keyed on that would call the sender internal and hand it
# monitoring, logs and openstack. Measured, not assumed: with the CDN trusted, a
# forged header flipped a $remote_addr check to "internal" while the
# $realip_remote_addr check stayed "external".
#
# $realip_remote_addr is the peer nginx is actually talking to, so a header
# cannot move it. It is populated whether or not the realip module is
# configured, so this is also correct before the CDN file is in place.
#
# The consequence to know: an internal user who reaches the site the long way
# round, out through the CDN and back, counts as external — which is what they
# are at that point.
#
# The other half of the assumption is the firewall: it DNATs 443 without
# masquerading, so a client from the internet still looks like one. Put a
# SNAT/masquerade in that path and every client starts looking internal, with
# nothing visibly broken to notice.
#
# Confirmed from a host outside the network on 2026-09-17: asking this nginx
# for an unpublished name, straight at the public address and past DNS, is
# refused. Re-run it after any change to the NAT rules, or to the trusted CDN
# ranges — those are the changes that break this silently:
#   curl -sk -o /dev/null -w "%{http_code}\n" \
#     --resolve monitoring.simorghai.com:443:95.38.203.173 \
#     https://monitoring.simorghai.com/          # 404 = the check is alive
#
# The published half of the same path was confirmed the same day, from the same
# outside host, through the ArvanCDN edge: cloud.simorghai.com answers 302 —
# Nextcloud's own login redirect, carried the whole way from the cluster. The
# redirect this file sends for plain HTTP is a 301, so a 302 arriving through
# the CDN is also the proof that Arvan reaches the origin over HTTPS rather
# than bouncing off the port-80 block.
geo $realip_remote_addr $client_is_internal {
    default        0;
    127.0.0.0/8    1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

# The publish list. `1` means reachable from the internet, `0` means LAN only.
# Every name in the PDNS zone is listed so the file says what it decided, not
# just what it allowed — a new service defaults to 0 by simply not being here.
map $host $host_is_public {
    default                    0;

    cloud.simorghai.com        1;
    office.simorghai.com       1;
    meet.simorghai.com         1;

    # Operator-facing. Publish these only behind an authenticating proxy or a
    # VPN — a login page on the open internet is not the same protection.
    monitoring.simorghai.com   0;
    logs.simorghai.com         0;
    openstack.simorghai.com    0;

    # registry./harbor. push and pull over the same 443. Turning this on means
    # anonymous pulls are reachable too unless the registry itself requires
    # auth for them.
    registry.simorghai.com     0;
    harbor.simorghai.com       0;

    # turn. is a TURN server, not HTTP — it cannot be proxied by this nginx at
    # all (see the note in the wildcard block). Left here as a reminder.
    turn.simorghai.com         0;

    # The services hosted on this box. They reach their backends over static
    # upstreams rather than through PDNS — see "Services that live on this
    # host" in the wildcard block for why — but the switch is the same one.
    #
    # Careful what 0 means here: it closes the simorghai.com door only. The
    # same apps are also served, deliberately and publicly, as paths under
    # simorghai.electrokavir.com — /simorgh-design-suite/, /chatbot/,
    # /eplanix/, /gitlab/, /kibana/, /kara/, /demo/. Setting one of these to 0
    # does not take that app off the internet; it only means the subdomain is
    # not another way in. To close an app entirely, remove or guard its
    # location in the ElectroKavir vhost as well.
    design.simorghai.com       1;
    chat.simorghai.com         1;
    kara.simorghai.com         1;

    eplanix.simorghai.com      0;
    gitlab.simorghai.com       0;
    kibana.simorghai.com       0;
    demo.simorghai.com         0;
}

map "$client_is_internal$host_is_public" $simorghai_allowed {
    "00"    0;   # outside client, unpublished name — the only refusal
    default 1;
}

# Public traffic arrives through the ArvanCDN edge, so every request comes from
# a CDN address and the logs would record the CDN rather than the visitor. The
# `set_real_ip_from` lines that fix that live in their own file, conf.d/
# arvan-real-ip.conf, because the ranges change on Arvan's schedule and not
# ours — update-arvan-ips.sh regenerates it. nginx includes conf.d/*.conf on its
# own, so nothing has to be included from here, and the absence of that file
# only costs accurate client addresses in the logs: the publish check above
# does not depend on it.

# =============================================================================
# Load Balancer Upstream Definitions
# =============================================================================

# Eplanix servers
upstream eplanix_backend {
    ip_hash;
    # .63 is out of service — drop the `down` to put it back in rotation.
    server 192.168.1.63 down;
    server 192.168.1.64;

    # Keep connections alive for better performance
    keepalive 32;
}

# Chatbot Docker nginx (local)
upstream chatbot_backend {
    server 127.0.0.1:85;
    keepalive 16;
}

# GitLab CE (compose maps host:8929 → ctr:80)
upstream gitlab_backend {
    server 127.0.0.1:8929;
}

# Kibana (compose maps host:5601 → ctr:5601)
upstream kibana_backend {
    server 127.0.0.1:5601;
}

# KARA — Next.js, on its own VM
upstream kara_backend {
    server 192.168.1.69:3000;
}

# DEMO — Vite/React dev server, on a different subnet
upstream demo_backend {
    server 192.168.20.133:5173;
}

# =============================================================================
# HTTP — ACME challenges, then redirect everything else to HTTPS
# =============================================================================
server {
    listen 80 default_server;
    server_name simorghai.electrokavir.com 192.168.1.68 simorghai.com *.simorghai.com _;

    # certbot's webroot challenge has to stay reachable over plain HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS — simorghai.electrokavir.com (default_server, path-based routing)
# =============================================================================
server {
    listen 443 ssl default_server;
    http2 on;
    server_name simorghai.electrokavir.com 192.168.1.68;

    # =========================================================================
    # SSL Certificate Configuration (Purchased CA Certificate)
    # =========================================================================
    ssl_certificate     /etc/ssl/private/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/simorghai.electrokavir.com.key;

    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL Configuration (TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS - tell browsers to always use HTTPS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # =========================================================================
    # Security Headers
    # =========================================================================
    # GitLab's Web IDE loads its workbench in a same-origin iframe; DENY
    # broke it ("Channel timed out while waiting for message
    # web-ide-config-request"). SAMEORIGIN still blocks cross-origin
    # clickjacking attacks but allows our own iframes.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # IP whitelist (uncomment to restrict access)
    # allow 192.168.1.0/24;
    # allow 127.0.0.1;
    # deny all;
    allow all;

    # Override global client settings
    client_max_body_size 100M;
    client_body_timeout 300s;

    # =========================================================================
    # Root-level asset fixes
    # -------------------------------------------------------------------------
    # Three apps here are Vite/React builds that emit absolute, root-level
    # asset URLs (/assets/…, /vite.svg) no matter what prefix they are served
    # under. Root is a single namespace shared by all of them, so each rule
    # below hands one root path to exactly one app — and two apps cannot both
    # own the same one.
    #
    # /assets/ belongs to the chatbot. The Design Suite and DEMO keep their
    # assets under their own prefix (/simorgh-design-suite/assets/,
    # /demo/assets/), which the prefix locations below already match, so they
    # do not collide.
    # =========================================================================
    location ^~ /assets/ {
        proxy_pass http://chatbot_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # /vite.svg belongs to the chatbot too. NOTE: an exact (`=`) match always
    # beats a regex one, so this wins over the DEMO root-asset regex further
    # down, which also lists vite.svg — DEMO must reference /demo/vite.svg.
    location = /vite.svg {
        proxy_pass http://chatbot_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # Default location - serve ElectroKavir landing page
    # =========================================================================
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Static assets for landing page
    location /Contents/ {
        alias /usr/share/nginx/html/landing/Contents/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # /eplanix - Load balanced to 192.168.1.63 and 192.168.1.64
    # =========================================================================
    location /eplanix/ {
        # Remove /eplanix prefix when forwarding to backend
        rewrite ^/eplanix/(.*) /$1 break;

        proxy_pass http://eplanix_backend;

        # Forward original host and client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /eplanix;

        # HTTP/1.1 for keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Cookie path rewriting
        proxy_cookie_path / /eplanix/;
        proxy_redirect off;

        # Timeouts for large files or slow responses
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Static files for eplanix (direct pass without body rewriting for performance)
    location ~* ^/eplanix/.*\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        rewrite ^/eplanix/(.*) /$1 break;
        proxy_pass http://eplanix_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /eplanix;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Cache static files
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # /simorgh-design-suite - Simorgh Design Software
    # Proxied to Docker nginx which routes to simorgh-soft container
    # =========================================================================
    location /simorgh-design-suite/ {
        # Preserve /simorgh-design-suite/ prefix - container nginx handles stripping
        proxy_pass http://chatbot_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /simorgh-design-suite;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Allow PDF / Excel attachments + the chatbot's project-context
        # snapshot to flow through without hitting the 1MB default.
        client_max_body_size 50M;

        # The chatbot's local-LLM round-trip (PDF parse + Qwen generation +
        # tool execution) can take 60-120s for complex prompts. Bumped from
        # 120s so users don't see the bare "Sorry, the page you are looking
        # for is currently unavailable" nginx error page on multi-action
        # prompts.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Static assets for simorgh-design-suite (cached)
    location ~* ^/simorgh-design-suite/.*\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://chatbot_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /simorgh-design-suite;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # /api/stt/ws - STT WebSocket (direct, no /chatbot prefix)
    # =========================================================================
    location /api/stt/ws/ {
        proxy_pass http://chatbot_backend/api/stt/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================================================================
    # /api - Proxy all API requests to Docker nginx (direct, no /chatbot prefix)
    # Frontend uses /api/* URLs relative to root
    # =========================================================================
    location /api/ {
        proxy_pass http://chatbot_backend/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE streaming support
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;

        # Long timeouts for AI processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # Large body for file uploads (STT audio)
        client_max_body_size 100M;
    }

    # =========================================================================
    # /chatbot/api - Proxy API requests to Docker nginx (strip /chatbot prefix)
    # =========================================================================
    location /chatbot/api/ {
        # Strip /chatbot prefix - /chatbot/api/foo -> /api/foo
        proxy_pass http://chatbot_backend/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /chatbot;

        # SSE streaming support (critical for chatbot responses)
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Disable buffering for real-time streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;

        # Long timeouts for AI processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # Large body for file uploads
        client_max_body_size 100M;
    }

    # =========================================================================
    # /chatbot - Proxy to Docker nginx on port 85
    # =========================================================================
    location /chatbot/ {
        # NO trailing slash - preserve /chatbot/ prefix in request path
        proxy_pass http://chatbot_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /chatbot;

        # SSE streaming support
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;

        # Long timeouts for AI processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        client_max_body_size 100M;
    }

    # =========================================================================
    # /chatbot WebSocket support
    # =========================================================================
    location /chatbot/ws {
        proxy_pass http://chatbot_backend/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================================================================
    # /chatbot/api/stt WebSocket for Speech-to-Text
    # =========================================================================
    location /chatbot/api/stt/ws/ {
        proxy_pass http://chatbot_backend/api/stt/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================================================================
    # /gitlab — proxy to in-cluster GitLab CE (compose maps host:8929 → ctr:80).
    # GitLab is configured with external_url=…/gitlab and listens on 80
    # internally; we forward the request URI as-is.
    # =========================================================================
    location /gitlab/ {
        proxy_pass http://gitlab_backend;
        proxy_set_header Host                $http_host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Ssl     on;
        proxy_set_header X-Forwarded-Prefix  /gitlab;

        # WebSocket support — required for the new VS Code-based Web IDE
        # (Monaco workers + collaborative editing channels) and for the
        # GitLab terminal/console feature.
        proxy_http_version                   1.1;
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          $connection_upgrade;

        proxy_read_timeout                   300s;
        proxy_send_timeout                   300s;
        proxy_buffering                      off;

        # Allow large git pushes (LFS, repo imports)
        client_max_body_size                 0;
    }

    # =========================================================================
    # /kibana — proxy to in-cluster Kibana (compose maps host:5601 → ctr:5601).
    # Kibana is configured with SERVER_BASEPATH=/kibana + REWRITEBASEPATH=true,
    # so it already expects the /kibana prefix on every request.
    # =========================================================================
    location /kibana/ {
        proxy_pass http://kibana_backend;
        proxy_set_header Host                $http_host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        # Kibana uses websockets for some panels (Discover live tail, etc.)
        proxy_http_version                   1.1;
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          $connection_upgrade;

        proxy_read_timeout                   300s;
        proxy_send_timeout                   300s;
    }

    # =========================================================================
    # /kara — KARA, a Next.js app on 192.168.1.69:3000
    # Next.js is configured with basePath /kara, so it expects the prefix.
    # =========================================================================
    location = /kara {
        return 308 /kara/login;
    }

    location = /kara/ {
        return 308 /kara/login;
    }

    location ^~ /kara/ {
        proxy_pass http://kara_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /kara;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;

        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # KARA's login page references these three images at the root instead of
    # under /kara/, so they are rewritten back into the prefix. Each one is a
    # root path spent on KARA — keep the list short, and fix the app instead
    # when it grows.
    location ~* ^/(logo-clean\.png|logo\.png|welcome-bg\.jpg)$ {
        rewrite ^/(.*)$ /kara/$1 break;

        proxy_pass http://kara_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # /demo — Vite/React app on 192.168.20.133:5173
    # =========================================================================
    location = /demo {
        return 301 /demo/;
    }

    location ^~ /demo/ {
        proxy_pass http://demo_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /demo;

        # Vite HMR / WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_redirect off;
    }

    # DEMO's two root-level images, rewritten back under /demo/. vite.svg is
    # deliberately NOT in this list: the exact-match location near the top of
    # this vhost already owns it for the chatbot, and an exact match always
    # beats a regex, so listing it here would never fire. DEMO should ask for
    # /demo/vite.svg.
    location ~* ^/(magic_3\.jpg|magic_4\.jpg)$ {
        rewrite ^/(.*)$ /demo/$1 break;

        proxy_pass http://demo_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# =============================================================================
# HTTPS — simorghai.com (apex)
# -----------------------------------------------------------------------------
# *.simorghai.com does not match the bare name, so the apex needs its own block.
# It serves the same landing page as the ElectroKavir host.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name simorghai.com;

    ssl_certificate     /etc/letsencrypt/live/simorghai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simorghai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /Contents/ {
        alias /usr/share/nginx/html/landing/Contents/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# =============================================================================
# HTTPS — openstack.simorghai.com  (EXCEPTION: plain-HTTP backend)
# -----------------------------------------------------------------------------
# Horizon serves plain HTTP on 192.168.1.95:80, so the generic wildcard rule
# below (which always dials https://$host) cannot be used for it. The backend
# is still named, not hard-coded: PDNS resolves openstack.simorghai.com to
# 192.168.1.95, so moving Horizon is a DNS change, not an nginx change.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name openstack.simorghai.com;

    # Not published for outside clients (see the maps at the top). At server
    # level, so it covers every location in this vhost — including any added
    # later. 404 rather than 403: a refusal that says "this exists" is a
    # service discovery endpoint for whoever is scanning.
    if ($simorghai_allowed = 0) {
        return 404;
    }

    ssl_certificate     /etc/letsencrypt/live/simorghai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simorghai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Glance image uploads through Horizon are large.
    client_max_body_size 10G;

    location / {
        # Keep the backend in a variable so nginx resolves it per request
        # instead of once at startup — and so a DNS hiccup does not stop
        # nginx from starting.
        set $openstack_backend "http://openstack.simorghai.com";
        proxy_pass $openstack_backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Horizon builds its absolute URLs and CSRF origin from these two.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Horizon redirects to http:// on login; rewrite those back to https
        # so the browser is not bounced through the port-80 redirect.
        proxy_redirect http://$host/ https://$host/;

        # noVNC / SPICE consoles are websockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

