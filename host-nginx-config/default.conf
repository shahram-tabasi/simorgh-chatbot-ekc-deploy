        return 404;
    }

    ssl_certificate     /etc/letsencrypt/live/simorghai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simorghai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    # The Web IDE loads its workbench in a same-origin iframe.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Large git pushes (LFS, repo imports)
    client_max_body_size 0;

    location = / {
        return 301 https://$host/gitlab/;
    }

    location /gitlab/ {
        proxy_pass http://gitlab_backend;
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Ssl    on;
        proxy_set_header X-Forwarded-Prefix /gitlab;

        proxy_http_version                  1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        proxy_read_timeout                  300s;
        proxy_send_timeout                  300s;
        proxy_buffering                     off;
    }
}

