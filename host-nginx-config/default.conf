# =============================================================================
# HTTPS — design.simorghai.com  (Simorgh Design Suite)
# -----------------------------------------------------------------------------
# The app is built with /simorgh-design-suite/ as its base path: every asset
# and API call it emits is absolute under that prefix. So the subdomain keeps
# the prefix rather than fighting it — the root just redirects into it. Once
# the app is rebuilt with base "/", this whole block collapses to a plain
# `location / { proxy_pass http://chatbot_backend; }`.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name design.simorghai.com;

    # Not published for outside clients (see the maps at the top). At server
    # level, so it covers every location in this vhost — including any added
    # later. 404 rather than 403: a refusal that says "this exists" is a
    # service discovery endpoint for whoever is scanning.
    if ($simorghai_allowed = 0) {
        return 404;
    }

    ssl_certificate     /etc/letsencrypt/live/simorghai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simorghai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 100M;

    location = / {
        return 301 https://$host/simorgh-design-suite/;
    }

    # The Vite build emits absolute /assets/… and /vite.svg URLs regardless of
    # the prefix it is served under; see the same pair in the ElectroKavir
    # vhost above.
    location ^~ /assets/ {
        proxy_pass http://chatbot_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /vite.svg {
        proxy_pass http://chatbot_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /simorgh-design-suite/ {
        proxy_pass http://chatbot_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /simorgh-design-suite;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Allow PDF / Excel attachments + the chatbot's project-context
        # snapshot to flow through without hitting the 1MB default.
        client_max_body_size 50M;

        # The chatbot's local-LLM round-trip (PDF parse + Qwen generation +
        # tool execution) can take 60-120s for complex prompts. Bumped from
        # 120s so users don't see the bare "Sorry, the page you are looking
        # for is currently unavailable" nginx error page on multi-action
        # prompts.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://chatbot_backend/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;

        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}

