    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 100M;

    location = / {
        return 308 /kara/login;
    }

    location = /kara {
        return 308 /kara/login;
    }

    location = /kara/ {
        return 308 /kara/login;
    }

    location ^~ /kara/ {
        proxy_pass http://kara_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /kara;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;

        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Root-level images the login page asks for. On this vhost KARA is the
    # only app, so nothing else competes for them.
    location ~* ^/(logo-clean\.png|logo\.png|welcome-bg\.jpg)$ {
        rewrite ^/(.*)$ /kara/$1 break;

        proxy_pass http://kara_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}

# =============================================================================
# HTTPS — demo.simorghai.com  (Vite/React)
# -----------------------------------------------------------------------------
# The app is built with base /demo/, so the prefix stays. Unlike the
# ElectroKavir vhost, nothing else here claims /vite.svg, so DEMO gets its own
# root-level assets back.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name demo.simorghai.com;

    # Not published for outside clients (see the maps at the top). At server
    # level, so it covers every location in this vhost — including any added
    # later. 404 rather than 403: a refusal that says "this exists" is a
    # service discovery endpoint for whoever is scanning.
    if ($simorghai_allowed = 0) {
        return 404;
    }

    ssl_certificate     /etc/letsencrypt/live/simorghai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simorghai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 100M;

    location = / {
        return 301 /demo/;
    }

    location ^~ /demo/ {
        proxy_pass http://demo_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /demo;

        # Vite HMR / WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_redirect off;
    }

    location ~* ^/(magic_3\.jpg|magic_4\.jpg|vite\.svg)$ {
        rewrite ^/(.*)$ /demo/$1 break;

        proxy_pass http://demo_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}

# =============================================================================
# HTTPS — *.simorghai.com  (the dynamic rule)
# -----------------------------------------------------------------------------
# Everything not named above. The requested hostname is resolved through PDNS
# at request time and proxied to over HTTPS, so a new HTTPS service needs one
# A record in the simorghai.com zone and nothing here.
#
# Three conditions a service must meet to be served by this block:
#   * it is HTTP(S) at all. A TURN/STUN server, game or media UDP, plain TCP —
#     none of them can pass through an HTTP proxy. turn.simorghai.com needs a
#     stream{} block or its own firewall forwarding, not this;
#   * it speaks HTTPS on 443 (plain-HTTP services need their own block, the
#     way openstack. does above);
#   * its A record points at the service, NOT at 192.168.1.68 — a record
#     pointing back here would make nginx proxy to itself.
#
# Reachable from the internet only if $host_is_public says so, up at the top
# of this file. On the LAN everything here is reachable regardless.
#
# -----------------------------------------------------------------------------
# Services that live on this host
# -----------------------------------------------------------------------------
# The Design Suite, the chatbot, GitLab, Kibana, KARA and DEMO cannot be served
# by this block, and no PDNS record can change that. This block dials
# https://$host — so a record pointing design.simorghai.com at 192.168.1.68
# would have nginx open a connection to itself, which is the 508 below, not a
# working service. A backend on this host is simply not reachable "through
# DNS" from this host.
#
# They each get a named block above instead: a PDNS record pointing at
# 192.168.1.68, an exact server_name that beats this wildcard, and a static
# upstream to 127.0.0.1. From where you stand that is the same two steps —
# add the record, set the switch — except that a NEW service of this kind also
# needs its block written here, once.
#
# Eplanix is the exception that proves the rule: it runs on 192.168.1.63/64,
# not here, so it could be served by this block dynamically the moment it
# answers HTTPS on 443. It has a named block today because it answers plain
# HTTP on 80.
#
# To make locally-hosted apps fully dynamic too, give this host a second
# address — say 192.168.1.78 — put the app containers behind their own TLS
# listener bound to it, and point their PDNS records there. Different address,
# no loop, and a new app becomes a compose file plus a record, with nothing to
# add here. That is infrastructure work, not a config change, which is why it
# is written down rather than done.
#
# Checked from this host on 2026-09-17 — all five answer HTTPS on 443, so none
# of them needs an exception block; the 302s are their own login redirects:
#   cloud 302   office 200   meet 200   monitoring 302   logs 302
# Re-run that check when a service moves, with:
#   for h in cloud office meet monitoring logs; do printf "%-12s " $h; \
#     curl -sk -o /dev/null -w "https=%{http_code}\n" --max-time 5 \
#     https://$h.simorghai.com/; done
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name *.simorghai.com;

    # Not published for outside clients (see the maps at the top). At server
    # level, so it covers every location in this vhost — including any added
    # later. 404 rather than 403: a refusal that says "this exists" is a
    # service discovery endpoint for whoever is scanning.
    if ($simorghai_allowed = 0) {
        return 404;
    }

    ssl_certificate     /etc/letsencrypt/live/simorghai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simorghai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 10G;

    location / {
        # Loop guard: if this request already carries our own marker, the
        # backend it was sent to was this nginx. Fail loudly on the second
        # hop instead of melting the worker with an endless chain.
        if ($http_x_simorgh_proxy) {
            return 508 "Proxy loop: $host resolves back to this nginx. Fix the PDNS record or give it its own server block.\n";
        }

        # Backend in a variable => resolved per request through PDNS, and a
        # DNS outage cannot keep nginx from starting.
        set $wildcard_backend "https://$host";
        proxy_pass $wildcard_backend$request_uri;

        # Internal services use self-signed certs; still send SNI so they can
        # pick the right vhost.
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Simorgh-Proxy 1;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
