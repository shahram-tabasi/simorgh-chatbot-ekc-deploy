# =============================================================================
# Host nginx hardening (192.168.1.68) — http-level, applies to every vhost
# =============================================================================
# Loaded before default.conf (00-), but everything here is either a global
# setting or a map, so the order does not matter for correctness.

# Don't say which nginx this is: the version in every error page and Server
# header is the first thing a scanner matches against CVE lists.
server_tokens off;

# TLS floor for every server block, including the ones that set none of their
# own (mail, website): TLS 1.2+, no session tickets (their key never rotates
# without a restart, which breaks forward secrecy).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_tickets off;

# Backends announcing their framework and version — same reason as above.
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;

# Slow-client protection (slowloris): headers and bodies that trickle in are
# cut off instead of holding a worker connection open.
client_header_timeout 15s;
send_timeout 60s;

# -----------------------------------------------------------------------------
# Operator pages: LAN only, whatever the host's publish switch says
# -----------------------------------------------------------------------------
# Publishing a name publishes every path under it. auth. and mail. have to be
# public — users sign in and read mail from outside — but their admin consoles
# must not be: Keycloak's admin API and the master realm, mailcow's admin and
# domain-admin logins and the rspamd UI. From outside these answer 404, as an
# unpublished name does. Keyed on $client_is_internal (default.conf), which
# uses the real peer address, so no header can talk its way in; $uri is the
# decoded, normalised path, so %2F or // tricks do not slip past.
map "$client_is_internal:$host:$uri" $operator_path_blocked {
    default 0;
    "~*^0:auth\.simorghai\.com:/(admin|realms/master)(/|$)"           1;
    "~*^0:mail\.simorghai\.com:/(admin|domainadmin|rspamd)(/|\.|$)"   1;
}

# -----------------------------------------------------------------------------
# Names this host answers for at all (port 80 redirect, default_server)
# -----------------------------------------------------------------------------
map $host $host_is_ours {
    default                                0;
    "~*^([a-z0-9-]+\.)*simorghai\.com$"    1;
    simorghai.electrokavir.com             1;
    192.168.1.68                           1;
}
