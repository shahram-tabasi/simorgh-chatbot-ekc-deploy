# =============================================================================
# VLM SERVER — 192.168.1.62 (NVIDIA A30 24 GB)
# =============================================================================
# Runs `vllm/vllm-openai:latest` with a vision-language model. Same
# OpenAI-compatible API as the LLM server, but accepts multimodal
# `messages` with `image_url` content parts:
#
#   {
#     "model": "qwen2.5-vl-7b",
#     "messages": [{"role": "user", "content": [
#       {"type": "text",      "text": "What's wrong with this drawing?"},
#       {"type": "image_url", "image_url": {"url": "data:image/jpeg;base64,..."}}
#     ]}]
#   }
#
# A30 sizing — why this default:
#   * Qwen2.5-VL-7B in BF16 = ~14 GB weights + ~2 GB vision tower +
#     6–7 GB KV cache @ 32K = ~22–24 GB → at the OOM edge.
#   * AWQ-INT4 7B = ~5 GB weights → leaves ~18 GB for KV / vision /
#     concurrency. Much more comfortable.
#   * Qwen2.5-VL is the successor to Qwen2-VL with measurably better
#     OCR + document understanding. Same API, same Persian support.
#
# Default: Qwen/Qwen2.5-VL-7B-Instruct-AWQ.
#
# Alternatives you can flip via env:
#   * BF16 native: Qwen/Qwen2.5-VL-7B-Instruct, with VLM_MAX_MODEL_LEN=16384
#     and VLM_QUANTIZATION="" — full precision, half the context.
#   * OCR-focused: openbmb/MiniCPM-V-2_6 (~16 GB BF16 fits, weaker
#     general reasoning but best-in-class for engineering drawings).
#
# Deploy on 192.168.1.62:
#   docker compose -f docker-compose.vlm.yml up -d
# =============================================================================

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    command: >
      --model ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      --served-model-name ${VLM_SERVED_NAME:-qwen2.5-vl-7b}
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --quantization ${VLM_QUANTIZATION:-awq}
      --dtype ${VLM_DTYPE:-half}
      --max-model-len ${VLM_MAX_MODEL_LEN:-32768}
      --max-num-seqs ${VLM_MAX_NUM_SEQS:-8}
      --limit-mm-per-prompt {"image":${VLM_MAX_IMAGES_PER_PROMPT:-5}}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.92}
      --enable-prefix-caching
      --api-key ${VLLM_API_KEY:-}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/models/huggingface
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
    volumes:
      - ${MODEL_CACHE_PATH:-/home/ubuntu/models}:/models
    expose:
      - "8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 7B AWQ + vision tower: ~2-3 min typical; 8 min covers the
      # first-run HF download.
      start_period: 480s
    networks:
      - ai_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vllm_nginx
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ./nginx_configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai_net
    restart: unless-stopped

  gpu_monitor:
    build: ./gpu_monitor
    image: simorgh-llm-gpu-monitor:local
    container_name: gpu_monitor
    environment:
      - TARGET_CONTAINER=vllm
      - BACKEND_URL=http://vllm:8000
      - GPU_MEMORY_THRESHOLD=95
      - GPU_IDLE_THRESHOLD=5
      - IDLE_DURATION=300
      - CHECK_INTERVAL=10
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - ai_net
    restart: unless-stopped

networks:
  ai_net:
    driver: bridge
