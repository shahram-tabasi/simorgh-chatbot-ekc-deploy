# =============================================================================
# VLM SERVER — 192.168.1.62
# =============================================================================
# Runs `vllm/vllm-openai:latest` with a vision-language model
# (Qwen2-VL-7B-Instruct by default). Same OpenAI-compatible API as the
# LLM server, but accepts multimodal `messages` with `image_url` content
# parts:
#
#   {
#     "model": "qwen2-vl-7b",
#     "messages": [
#       {"role": "user", "content": [
#         {"type": "text",      "text": "What's wrong with this drawing?"},
#         {"type": "image_url", "image_url": {"url": "data:image/jpeg;base64,..."}}
#       ]}
#     ]
#   }
#
# Deploy on 192.168.1.62:
#   docker compose -f docker-compose.vlm.yml up -d
# =============================================================================

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    # Qwen2-VL needs --trust-remote-code (custom modelling files) and
    # --limit-mm-per-prompt to cap how many images / videos the client
    # can attach in one request.
    command: >
      --model ${VLM_MODEL:-Qwen/Qwen2-VL-7B-Instruct}
      --served-model-name ${VLM_SERVED_NAME:-qwen2-vl-7b}
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --dtype ${VLM_DTYPE:-bfloat16}
      --max-model-len ${VLM_MAX_MODEL_LEN:-32768}
      --max-num-seqs ${VLM_MAX_NUM_SEQS:-5}
      --limit-mm-per-prompt image=${VLM_MAX_IMAGES_PER_PROMPT:-5}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.90}
      --enable-prefix-caching
      --api-key ${VLLM_API_KEY:-}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/models/huggingface
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
    volumes:
      - ${MODEL_CACHE_PATH:-/home/ubuntu/models}:/models
    expose:
      - "8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 480s   # ~8 min for 7B VLM weights + vision tower
    networks:
      - ai_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vllm_nginx
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ./nginx_configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai_net
    restart: unless-stopped

  gpu_monitor:
    build: ./gpu_monitor
    image: simorgh-llm-gpu-monitor:local
    container_name: gpu_monitor
    environment:
      - TARGET_CONTAINER=vllm
      - BACKEND_URL=http://vllm:8000
      - GPU_MEMORY_THRESHOLD=95
      - GPU_IDLE_THRESHOLD=5
      - IDLE_DURATION=300
      - CHECK_INTERVAL=10
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - ai_net
    restart: unless-stopped

networks:
  ai_net:
    driver: bridge
