# =============================================================================
# llms/ — this top-level compose is intentionally empty (no `services:` key).
#
# Each GPU server runs ONE of the two real compose files in this directory.
# Pick the one matching the role of the host:
#
#   192.168.1.61  (LLM, gpt-oss-20b 16-bit, text-only)
#       docker compose -f docker-compose.llm.yml up -d
#
#   192.168.1.62  (VLM, Qwen2-VL-7B-Instruct, vision + text)
#       docker compose -f docker-compose.vlm.yml up -d
#
# Both files run the official `vllm/vllm-openai:latest` container, so the
# local API is a drop-in OpenAI-compatible server:
#   /v1/chat/completions, /v1/completions, /v1/embeddings,
#   /v1/models, /health
#
# Routing across the two servers is done by `simorgh-agent/llm-gateway`
# on .68 — text-only requests go to .61, requests with image content go
# to .62. Clients only ever talk to llm-gateway, never directly to a
# GPU box.
#
# See ./README.md for full deploy + ops notes.
# =============================================================================
