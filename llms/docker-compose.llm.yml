# =============================================================================
# LLM SERVER — 192.168.1.61 (NVIDIA A30 24 GB × 1)
# =============================================================================
# Runs the bespoke Python service in `ai/` (Unsloth + vLLM 0.12.0). This
# is the same loader that worked on this box before the brief
# vllm/vllm-openai detour — it can fit `unsloth/gpt-oss-20b-16bit`
# (~40 GB BF16) on a single A30 24 GB by streaming layers from disk on
# demand. The off-the-shelf vllm/vllm-openai image cannot do this; it
# pins all weights in VRAM at startup, so it OOMs on a 24 GB card with
# the 16-bit form.
#
# The service exposes an OpenAI-compatible API on port 80 (nginx) →
# ai_service container :9000. The legacy `/generate-stream` endpoint
# is also still served for backward compatibility, but llm-gateway and
# every other client uses the OpenAI-compatible surface.
#
# Endpoints (OpenAI-compatible):
#   POST /v1/chat/completions      (streaming via "stream": true)
#   POST /v1/completions
#   GET  /v1/models
#   GET  /health
#   POST /generate-stream          (legacy, deprecated)
#
# The companion VLM box on .62 still uses vllm/vllm-openai:latest
# directly — see docker-compose.vlm.yml. AWQ-INT4 7B fits comfortably
# on one A30, so the upstream image is fine there.
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # Model initializer — pre-downloads gpt-oss-20b 16-bit before the main
  # service starts. Runs once and exits. Idempotent: if the cache already
  # has the model it just verifies and returns.
  # -------------------------------------------------------------------------
  model_initializer:
    build: ./initializer
    image: simorgh-llm-model-initializer:local
    container_name: model_initializer
    volumes:
      - ${MODEL_CACHE_PATH:-/home/ubuntu/models}:/models
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN:-}
    networks:
      - ai_net
    restart: "no"

  # -------------------------------------------------------------------------
  # AI service — Unsloth FastLanguageModel + vLLM, FastAPI front. This is
  # the Python service from `ai/`. It loads `unsloth/gpt-oss-20b-16bit` by
  # default (override via LLM_MODEL_PATH).
  # -------------------------------------------------------------------------
  ai_service:
    build: ./ai
    image: simorgh-llm-ai-service:local
    container_name: ai_service
    depends_on:
      model_initializer:
        condition: service_completed_successfully
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0

      # Model path inside the container (resolves under /models). The
      # initializer drops the 16-bit weights at this exact path.
      - MODEL_PATH=${LLM_MODEL_PATH:-/models/unsloth-gpt-oss-20b-16bit}
      - HF_TOKEN=${HF_TOKEN:-}

      # LangChain tooling exposed by the agent. Off by default for the
      # gateway-only deployment; chat tools live in simorgh-agent now.
      - ENABLE_SEARCH_TOOL=${ENABLE_SEARCH_TOOL:-false}
      - ENABLE_PYTHON_REPL=${ENABLE_PYTHON_REPL:-false}
      - ENABLE_SIEMENS_API=${ENABLE_SIEMENS_API:-false}
      - AGENT_VERBOSE=${AGENT_VERBOSE:-false}

      # Optional: Self-hosted search API
      - SEARCH_API_URL=${SEARCH_API_URL:-}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}

      # Siemens Developer API (only if ENABLE_SIEMENS_API=true)
      - SIEMENS_API_KEY=${SIEMENS_API_KEY:-}

      # Python REPL guardrails (only if ENABLE_PYTHON_REPL=true)
      - PYTHON_REPL_TIMEOUT=10
      - PYTHON_REPL_SANDBOX=true
    expose:
      - "9000"
    volumes:
      # Read-only model cache — initializer is the only writer.
      - ${MODEL_CACHE_PATH:-/home/ubuntu/models}:/models:ro
      # HF cache (writable so vLLM/Unsloth can drop tokenizer metadata).
      - ${MODEL_CACHE_PATH:-/home/ubuntu/models}/huggingface:/root/.cache/huggingface/hub
    networks:
      - ai_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health | grep -q 'healthy' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold model load via Unsloth streaming is ~2.5 min. 4 min covers the
      # warm case; first cold HF download can take 15+ min — bump if needed.
      start_period: 240s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # nginx — IP-allowlist + SSE-friendly proxy in front of ai_service:9000.
  # Mounts llm.conf (LLM-side upstream); the VLM box uses default.conf.
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ai_nginx
    depends_on:
      ai_service:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ./nginx_configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs/conf.d/llm.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai_net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # GPU monitor — watches ai_service GPU memory + idle time, restarts if
  # it hangs. Same image as the VLM box; just retargets the container.
  # -------------------------------------------------------------------------
  gpu_monitor:
    build: ./gpu_monitor
    image: simorgh-llm-gpu-monitor:local
    container_name: gpu_monitor
    environment:
      - TARGET_CONTAINER=ai_service
      - BACKEND_URL=http://ai_service:9000
      - GPU_MEMORY_THRESHOLD=95
      - GPU_IDLE_THRESHOLD=5
      - IDLE_DURATION=300
      - CHECK_INTERVAL=10
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    depends_on:
      ai_service:
        condition: service_healthy
    networks:
      - ai_net
    restart: unless-stopped

networks:
  ai_net:
    driver: bridge
