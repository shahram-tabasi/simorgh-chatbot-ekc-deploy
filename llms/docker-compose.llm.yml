# =============================================================================
# LLM SERVER — 192.168.1.61 (NVIDIA A30 24 GB)
# =============================================================================
# Runs `vllm/vllm-openai:latest` directly. Exposes a standard
# OpenAI-compatible API on port 80 (nginx) → vllm container :8000.
#
# Endpoints (all OpenAI-compatible):
#   POST /v1/chat/completions
#   POST /v1/completions
#   GET  /v1/models
#   GET  /health
#
# A30 sizing — why this default:
#   * A30 has 24 GB of HBM2.
#   * BF16 7B uses ~14 GB → tight; BF16 14B uses ~28 GB → won't fit;
#     BF16 20B uses ~40 GB → not even close.
#   * AWQ-INT4 14B uses ~8 GB → comfortable, leaves ~14 GB for KV cache
#     + concurrent users at 8K context.
#   * AWQ is vllm-native (`--quantization awq`), faster than bnb,
#     supports prefix caching.
#
# Default model: Qwen/Qwen2.5-14B-Instruct-AWQ — same family as the VLM
# on .62 for consistent behavior, strong Persian support, top-tier
# instruction following at A30-sized footprint.
#
# Alternatives you can flip via env:
#   * gpt-oss-20b on A30 — only viable as bitsandbytes 4-bit. Set:
#         LLM_MODEL=unsloth/gpt-oss-20b-bnb-4bit
#         LLM_QUANTIZATION=bitsandbytes
#         LLM_DTYPE=half
#         LLM_LOAD_FORMAT=bitsandbytes
#     Slower than AWQ and breaks prefix caching — not recommended.
#   * Smaller, faster: Qwen/Qwen2.5-7B-Instruct (BF16, ~14 GB, fits).
#   * Larger: Qwen/Qwen2.5-32B-Instruct-AWQ (~18 GB, tight headroom).
#
# Deploy on 192.168.1.61:
#   docker compose -f docker-compose.llm.yml up -d
# =============================================================================

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen2.5-14B-Instruct-AWQ}
      --served-model-name ${LLM_SERVED_NAME:-qwen2.5-14b}
      --host 0.0.0.0
      --port 8000
      --quantization ${LLM_QUANTIZATION:-awq}
      --dtype ${LLM_DTYPE:-half}
      --max-model-len ${LLM_MAX_MODEL_LEN:-8192}
      --max-num-seqs ${LLM_MAX_NUM_SEQS:-8}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.92}
      --enable-prefix-caching
      --api-key ${VLLM_API_KEY:-}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/models/huggingface
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
    volumes:
      - ${MODEL_CACHE_PATH:-/home/ubuntu/models}:/models
    expose:
      - "8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 14B AWQ initial load on A30: ~3 minutes typical, give 10 to cover
      # cold-start downloads from HF on first run.
      start_period: 600s
    networks:
      - ai_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vllm_nginx
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ./nginx_configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai_net
    restart: unless-stopped

  gpu_monitor:
    build: ./gpu_monitor
    image: simorgh-llm-gpu-monitor:local
    container_name: gpu_monitor
    environment:
      - TARGET_CONTAINER=vllm
      - BACKEND_URL=http://vllm:8000
      - GPU_MEMORY_THRESHOLD=95
      - GPU_IDLE_THRESHOLD=5
      - IDLE_DURATION=300
      - CHECK_INTERVAL=10
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - ai_net
    restart: unless-stopped

networks:
  ai_net:
    driver: bridge
