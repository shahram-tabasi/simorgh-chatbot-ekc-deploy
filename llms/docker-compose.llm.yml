# =============================================================================
# LLM SERVER — 192.168.1.61 (NVIDIA A30 24 GB × 2)
# =============================================================================
# Runs `vllm/vllm-openai:latest` directly. Exposes a standard
# OpenAI-compatible API on port 80 (nginx) → vllm container :8000.
#
# Endpoints (all OpenAI-compatible):
#   POST /v1/chat/completions
#   POST /v1/completions
#   GET  /v1/models
#   GET  /health
#
# =============================================================================
# Why tensor-parallelism (TP=2) and not single-GPU
# =============================================================================
# Default model: unsloth/gpt-oss-20b-16bit
#   Weights:    ~40 GB (BF16)
#   Single A30: 24 GB → won't fit
#   2× A30:     48 GB → fits with --tensor-parallel-size 2
#
# Run `nvidia-smi -L` on .61 to confirm GPU count. If `.61` is single-card,
# you have THREE choices:
#
#   (B) Single A30 + CPU offload — set:
#         LLM_TP_SIZE=1
#         LLM_CPU_OFFLOAD_GB=20
#       Inference becomes ~5-10× slower because weights stream from
#       RAM. Usable but not for production load.
#
#   (C) MXFP4-native form (recommended single-GPU path) — set:
#         LLM_MODEL=unsloth/gpt-oss-20b
#         LLM_QUANTIZATION=mxfp4
#         LLM_TP_SIZE=1
#       MXFP4 IS the trained gpt-oss format; the `-16bit` variant is
#       unsloth's upcast for fine-tuning. Inference quality is
#       essentially identical, weights are ~12 GB → fits on 1 A30
#       with 12 GB free for KV cache.
#
#   (D) Different model entirely — back to Qwen2.5-14B-AWQ:
#         LLM_MODEL=Qwen/Qwen2.5-14B-Instruct-AWQ
#         LLM_QUANTIZATION=awq
#         LLM_DTYPE=half
#         LLM_TP_SIZE=1
#       (See git log of this file for the full Qwen-based config.)
#
# Default below assumes 2× A30 (Path A). Will fail to start on a
# single-card host with a clear error — flip env per above and re-up.
# =============================================================================

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    command: >
      --model ${LLM_MODEL:-unsloth/gpt-oss-20b-16bit}
      --served-model-name ${LLM_SERVED_NAME:-gpt-oss-20b}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size ${LLM_TP_SIZE:-2}
      --dtype ${LLM_DTYPE:-bfloat16}
      --max-model-len ${LLM_MAX_MODEL_LEN:-8192}
      --max-num-seqs ${LLM_MAX_NUM_SEQS:-4}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.92}
      --enable-prefix-caching
      --api-key ${VLLM_API_KEY:-}
      ${LLM_QUANTIZATION:+--quantization ${LLM_QUANTIZATION}}
      ${LLM_CPU_OFFLOAD_GB:+--cpu-offload-gb ${LLM_CPU_OFFLOAD_GB}}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/models/huggingface
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      # NCCL settings for tensor-parallel — keeps sharded comm on the
      # PCIe bus reliable.
      - NCCL_DEBUG=${NCCL_DEBUG:-WARN}
      - NCCL_P2P_DISABLE=${NCCL_P2P_DISABLE:-0}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-1}
    volumes:
      - ${MODEL_CACHE_PATH:-/home/ubuntu/models}:/models
    expose:
      - "8000"
    # ipc=host is REQUIRED for multi-GPU tensor parallelism (vllm uses
    # /dev/shm to pass tensors between worker processes). Without it
    # the workers crash with "Bus error" on first request.
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 2× A30 loading 40 GB BF16 weights + warming TP communicators:
      # typically ~8-12 min on the first cold cache load (HF download
      # + PCIe shard distribution). 15 min covers it.
      start_period: 900s
    networks:
      - ai_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vllm_nginx
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ./nginx_configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai_net
    restart: unless-stopped

  gpu_monitor:
    build: ./gpu_monitor
    image: simorgh-llm-gpu-monitor:local
    container_name: gpu_monitor
    environment:
      - TARGET_CONTAINER=vllm
      - BACKEND_URL=http://vllm:8000
      - GPU_MEMORY_THRESHOLD=95
      - GPU_IDLE_THRESHOLD=5
      - IDLE_DURATION=300
      - CHECK_INTERVAL=10
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - ai_net
    restart: unless-stopped

networks:
  ai_net:
    driver: bridge
