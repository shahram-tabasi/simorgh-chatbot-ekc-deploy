# =============================================================================
# LLM SERVER — 192.168.1.61 (NVIDIA A30 24 GB × 1)
# =============================================================================
# Stack architecture (post-Harmony migration):
#
#   nginx :80
#     ├── /generate-stream → ai_adapter :9100 (FastAPI translator)
#     │                          └── calls ai_service /v1/chat/completions
#     └── everything else  → ai_service :9000 (vLLM serve)
#
# ai_service runs vLLM's native OpenAI server with the openai_harmony
# tool-call parser, so `tools=[...]` requests get parsed into proper
# `message.tool_calls` responses (Harmony's native channel). This is
# what makes gpt-oss-20b a viable planner — guided_json was forcing
# the model into a worst-case minimum-effort JSON which produced
# 1-step "Direct response" degenerate plans.
#
# ai_adapter is a tiny (~50 MB, no GPU) FastAPI sidecar that keeps the
# seven legacy callers of /generate-stream working without touching
# their code. It translates the legacy {system_prompt, user_prompt,
# thinking_level, stream} body into an OpenAI /v1/chat/completions
# request and streams the response back in the legacy SSE shape.
#
# The previous custom ai_service (bespoke FastAPI + Unsloth + vLLM
# library mode) is no longer used. Its code stays in ai/ for
# reference / rollback. To roll back, swap the ai_service image
# back to simorgh-llm-ai-service:local and revert the command.
#
# Endpoints (post-migration):
#   POST /v1/chat/completions     (vLLM serve, supports tools=)
#   POST /v1/completions          (vLLM serve)
#   GET  /v1/models               (vLLM serve)
#   GET  /health                  (vLLM serve)
#   POST /generate-stream         (ai_adapter, legacy-shape SSE)
#
# The companion VLM box on .62 still uses vllm/vllm-openai directly
# (see docker-compose.vlm.yml). With gpt-oss-20b now able to plan
# correctly via Harmony, the VLM is no longer needed in the CoT
# planner path — it can be repurposed for actual vision workloads
# or retired entirely.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # AI service — vLLM OpenAI server with native Harmony tool calling.
  # Replaces the bespoke Unsloth+vLLM-library service; we proved in the
  # harmony-test side-by-side that vLLM serve handles gpt-oss-20b tool
  # calls correctly with --tool-call-parser openai.
  # ---------------------------------------------------------------------------
  ai_service:
    image: vllm/vllm-openai:v0.21.0
    container_name: ai_service
    expose:
      - "9000"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN:-}
      # gpt-oss-20b weights are already on disk; no re-validate against HF.
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      # openai_harmony's Rust HTTP client doesn't honor HTTP_PROXY env
      # vars the way Python httpx does, so the harmony vocab is pre-
      # downloaded to ./harmony_cache and mounted at the exact path
      # tiktoken-rs hardcodes (/tmp/tiktoken-rs-cache).
      # Pre-download recipe (run once on first deploy):
      #   mkdir -p ./harmony_cache && sudo chmod 777 ./harmony_cache
      #   docker run --rm --network=host \
      #     -e HTTPS_PROXY=http://127.0.0.1:10809 \
      #     -v $(pwd)/harmony_cache:/tmp/tiktoken-rs-cache \
      #     python:3.12-slim bash -c '
      #       pip install --quiet --no-cache-dir openai-harmony &&
      #       python -c "from openai_harmony import load_harmony_encoding,
      #       HarmonyEncodingName;
      #       load_harmony_encoding(HarmonyEncodingName.HARMONY_GPT_OSS)"
      #     '
    command:
      - "--model"
      - "/models/unsloth-gpt-oss-20b-16bit"
      - "--served-model-name"
      - "gpt-oss-20b"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9000"
      - "--tensor-parallel-size"
      - "1"
      # Harmony tool-call path expands the CoT system prompt + COT_PLAN_SCHEMA
      # into ~13k tokens once the chat template wraps it. 8192 was rejecting
      # those requests with "Input length (13121) exceeds model's maximum
      # context length (8192)" and falling back to the VLM. 16384 gives
      # headroom without ballooning KV-cache VRAM (gpt-oss-20b supports 32k
      # natively but we don't need it on a 24GB A30).
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_UTIL:-0.85}"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "openai"
      - "--enable-prefix-caching"
      - "--trust-remote-code"
    volumes:
      # Read-only model cache.
      - ${MODEL_CACHE_PATH:-/home/ubuntu/models}:/models:ro
      # HF cache (writable so vLLM can drop tokenizer metadata).
      - ${MODEL_CACHE_PATH:-/home/ubuntu/models}/huggingface:/root/.cache/huggingface
      # Pre-downloaded harmony vocab at the path tiktoken-rs expects.
      - ./harmony_cache:/tmp/tiktoken-rs-cache
    networks:
      - ai_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # vLLM cold start = model load (60-180s on warm disk cache).
      start_period: 300s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Adapter — translates legacy /generate-stream → /v1/chat/completions.
  # No GPU. Tiny image. Keeps the seven existing callers of the legacy
  # endpoint working (llm_async_client.py in chat / project-agent /
  # documents-rag / etc.) without touching their code.
  # ---------------------------------------------------------------------------
  ai_adapter:
    build:
      context: ./ai_adapter
      # The host .61 routes outbound through xray on 127.0.0.1:10809.
      # Without host network, BuildKit's sandbox can't reach the proxy
      # and pip install fails with "Cannot connect to proxy."
      network: host
    image: simorgh-llm-ai-adapter:local
    container_name: ai_adapter
    depends_on:
      ai_service:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - UPSTREAM_URL=http://ai_service:9000
      - UPSTREAM_MODEL=${LOCAL_LLM_MODEL_TEXT:-gpt-oss-20b}
      - TIMEOUT_SEC=1800
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Docker daemon injects HTTP_PROXY=http://172.17.0.1:10809 (xray)
      # into every container so they can reach the internet. The adapter
      # only ever talks to ai_service over the docker network, so the
      # proxy isn't just unneeded — it actively breaks every call
      # ("httpx.ConnectError: All connection attempts failed"). Wipe
      # the proxy env entirely.
      - HTTP_PROXY=
      - http_proxy=
      - HTTPS_PROXY=
      - https_proxy=
      - NO_PROXY=*
      - no_proxy=*
    expose:
      - "9100"
    networks:
      - ai_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # nginx — IP-allowlist + SSE-friendly proxy. Routes /generate-stream
  # to ai_adapter; everything else to ai_service (vLLM serve).
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ai_nginx
    depends_on:
      ai_service:
        condition: service_healthy
      ai_adapter:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ./nginx_configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs/conf.d/llm.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai_net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # GPU monitor — watches ai_service GPU memory + idle time, restarts
  # if it hangs.
  # ---------------------------------------------------------------------------
  gpu_monitor:
    build: ./gpu_monitor
    image: simorgh-llm-gpu-monitor:local
    container_name: gpu_monitor
    environment:
      - TARGET_CONTAINER=ai_service
      - BACKEND_URL=http://ai_service:9000
      - GPU_MEMORY_THRESHOLD=95
      - GPU_IDLE_THRESHOLD=5
      - IDLE_DURATION=300
      - CHECK_INTERVAL=10
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    depends_on:
      ai_service:
        condition: service_healthy
    networks:
      - ai_net
    restart: unless-stopped

networks:
  ai_net:
    driver: bridge
