# =============================================================================
# nginx in front of vllm/vllm-openai
# Server: 192.168.1.61 (LLM) or 192.168.1.62 (VLM) — same config either way.
# Backend talks the standard OpenAI HTTP API on :8000.
# =============================================================================

upstream vllm_backend {
    server vllm:8000;
    # vllm benefits from connection reuse — chat completions are long-running
    keepalive 32;
}

# Allow only the central server (and localhost). Adjust if you front the
# GPU servers from somewhere else.
geo $limit {
    default 1;
    192.168.1.68 0;
    127.0.0.1    0;
}

map $limit $limit_key {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $limit_key zone=ai_limit:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;

    # Security
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options       "DENY"     always;

    # IP whitelist — central server + localhost
    allow 192.168.1.68;
    allow 127.0.0.1;
    deny  all;

    # Body limits — chat-completions with embedded base64 images can be big
    client_max_body_size 50M;
    client_body_timeout  300s;

    # Health passthrough for upstream probes
    location = /health {
        proxy_pass http://vllm_backend/health;
        access_log off;
        proxy_connect_timeout 5s;
        proxy_read_timeout    5s;
    }

    # Standard OpenAI-compatible API surface
    # /v1/chat/completions, /v1/completions, /v1/embeddings, /v1/models, …
    location / {
        limit_req zone=ai_limit burst=40 nodelay;

        proxy_pass http://vllm_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming: SSE over HTTP/1.1 — no buffering, no compression on the
        # response, long timeouts (LLM generation can run minutes for 20B).
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control     "no-cache" always;

        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }
}
