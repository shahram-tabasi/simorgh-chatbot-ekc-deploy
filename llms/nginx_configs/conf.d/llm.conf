# =============================================================================
# nginx in front of the bespoke Python ai_service (Unsloth + vLLM)
# Server: 192.168.1.61 (LLM only).
# Backend speaks the OpenAI HTTP API on :9000.
#
# The companion VLM box (192.168.1.62) uses the sibling default.conf,
# which proxies to the upstream `vllm/vllm-openai` container on :8000.
# =============================================================================

upstream ai_backend {
    server ai_service:9000;
    # ai_service benefits from connection reuse — chat completions are long-running.
    keepalive 32;
}

# Adapter that translates legacy /generate-stream → /v1/chat/completions.
# Tiny FastAPI sidecar, no GPU.
upstream ai_adapter {
    server ai_adapter:9100;
    keepalive 16;
}

# Allow only the central server (and localhost). Adjust if you front the
# GPU servers from somewhere else.
geo $limit {
    default 1;
    192.168.1.68 0;
    127.0.0.1    0;
}

map $limit $limit_key {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $limit_key zone=ai_limit:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;

    # Security
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options       "DENY"     always;

    # IP whitelist — central server + localhost
    allow 192.168.1.68;
    allow 127.0.0.1;
    deny  all;

    # Body limits — chat-completions with long contexts can be sizeable.
    client_max_body_size 50M;
    client_body_timeout  300s;

    # Health passthrough for upstream probes
    location = /health {
        proxy_pass http://ai_backend/health;
        access_log off;
        proxy_connect_timeout 5s;
        proxy_read_timeout    5s;
    }

    # Legacy /generate-stream endpoint → ai_adapter (translates to
    # /v1/chat/completions on the way to vLLM serve). Same SSE
    # buffering rules as the main location.
    location = /generate-stream {
        limit_req zone=ai_limit burst=40 nodelay;

        proxy_pass http://ai_adapter/generate-stream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control     "no-cache" always;

        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }

    # Standard OpenAI-compatible API surface — straight to vLLM serve.
    location / {
        limit_req zone=ai_limit burst=40 nodelay;

        proxy_pass http://ai_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming: SSE over HTTP/1.1 — no buffering, no compression on the
        # response, long timeouts (LLM generation can run minutes for 20B).
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control     "no-cache" always;

        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }
}
